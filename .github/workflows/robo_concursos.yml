name: Robô Atualizador de Concursos

on:
  schedule:
    - cron: '0 9 * * *' # Roda automaticamente todo dia às 6h da manhã no Brasil (9h UTC)
  workflow_dispatch: # Permite criar um botão para rodar manualmente quando você quiser

jobs:
  varredura:
    runs-on: ubuntu-latest

    steps:
    - name: Puxar os arquivos do repositório
      uses: actions/checkout@v3

    - name: Instalar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar ferramentas do Robô
      run: pip install -r requirements.txt

    - name: Rodar o Robô Caçador
      run: python scraper_v2.py

    - name: Salvar novo site e publicar
      run: |
        git config --global user.name 'Robo-Auditor'
        git config --global user.email 'robo@auditoriadf.com'
        git add index.html
        # Se houve mudança no index.html, ele salva e joga pro ar. Se não, não faz nada.
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Site atualizado com novas notícias" && git push)
