za, Competência e Jurisdição","alt":[{"letra":"a","texto":"dirigentes de empresas privadas que recebam recursos do Distrito Federal à conta de contratos de prestação de serviços."},{"letra":"b","texto":"responsáveis por associações que prestem serviços de interesse público ou social com recursos próprios."},{"letra":"c","texto":"sucessores de responsáveis por valores públicos no que exceder o montante do patrimônio transferido."},{"letra":"d","texto":"membros de conselhos fiscais de estatais indicados pelo Governo do Distrito Federal (GDF) que não tiverem formalizado sua discordância em decisão prejudicial aos interesses da empresa."},{"letra":"e","texto":"liquidantes de empresa privada em processo falimentar."}]},{"n":178,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"baixa","td":"→ Estável","fr":"2014 (1 questão)","an":[2014],"ar":2014,"q":"178) Julgue o item subsequente relativo à LO/TCDF.\nEntidades dotadas de personalidade jurídica de direito privado criadas com a finalidade de prestar serviço de interesse público estão abrangidas, em razão de sua finalidade, pela jurisdição do TCDF.","r":"O gabarito é Errado[cite: 2]. O art. 6º, IV, da LO/TCDF exige dois requisitos cumulativos para que a entidade privada fique sob a jurisdição da Corte: prestar serviço de interesse público ou social E \"receber contribuições\" (recursos)[cite: 1]. O simples fato de ser criada com finalidade pública, sem a comprovação do efetivo recebimento ou gestão de verba distrital, não atrai, por si só, a jurisdição do Tribunal[cite: 1].","rf":"A jurisdição sobre entes privados exige cumulação: prestar serviço público E receber contribuição/recurso público distrital.","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":179,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2012 (1 questão)","an":[2012],"ar":2012,"q":"179) Julgue o próximo item, acerca da jurisdição e da Lei Orgânica do TCDF.\nA jurisdição do TCDF abrange tanto as pessoas físicas como as jurídicas públicas e privadas que tenham recebido recursos públicos sob a responsabilidade do DF, podendo atingir os sucessores dos responsáveis por esses recursos.","r":"O gabarito é Certo[cite: 2]. A norma da Lei Complementar nº 01/1994 (Art. 6º, I, IV, e VII) estabelece de forma ampla o alcance da Corte[cite: 1]. A jurisdição estende-se sem distinção de natureza (física ou jurídica, pública ou privada) àqueles que gerem recursos do DF, alcançando inclusive seus sucessores jurídicos até o limite do patrimônio que lhes houver sido transferido[cite: 1].","rf":"A jurisdição atinge administradores (pessoas físicas ou jurídicas de direito público ou privado) e seus sucessores (limitado ao patrimônio transferido).","g":"Certo","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":180,"bc":"CEBRASPE, Consultor Legislativo (CLDF)","es":"tematico","ft":"Externa (Jurisprudência / Lei 8.666/14.133)","nv":"baixa","td":"→ Estável","fr":"2006 (1 questão)","an":[2006],"ar":2006,"q":"180) No que se refere ao controle exercido pela Câmara Legislativa do DF, julgue o item.\nConsidere que uma empresa seja contratada pelo GDF para prestar serviços públicos de natureza contínua, em nome do governo. Nessa situação, as contas dos dirigentes dessa empresa deverão ser julgadas pelo Tribunal de Contas do Distrito Federal (TCDF).","r":"O gabarito é Errado[cite: 2]. A celebração de contratos administrativos corriqueiros para prestação de serviços remunerados não submete as contas internas dos dirigentes da empresa contratada ao julgamento do Tribunal de Contas. Apenas as entidades que gerem ou recebam repasses sob a forma de subvenções, convênios ou contribuições de natureza parafiscal estão sujeitas a essa modalidade estrita de prestação de contas.","rf":"A empresa privada contratada pelo Estado (Lei de Licitações) tem seu contrato fiscalizado, mas seus dirigentes não prestam \"contas de gestão\" ao TC.","g":"Errado","t":"CE","tm":"Controle Externo e Legislação Institucional"},{"n":181,"bc":"CEBRASPE, Auditor (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2002 (1 questão), 2024 (1 questão)","an":[2002,2024],"ar":2024,"q":"181) O controle externo, constitucionalmente definido, compreende a fiscalização contábil, financeira, orçamentária, operacional e patrimonial relativa ao ente político e a suas entidades. Essa fiscalização, incluindo a aplicação das subvenções e a renúncia de receitas, abrange os aspectos de legalidade, legitimidade e também de economicidade, de maneira que os atos administrativos, ainda que praticados segundo a lei e os regulamentos, podem vir a ser sancionados se forem antieconômicos. No âmbito do DF, o controle externo é de titularidade da Câmara Legislativa do DF (CLDF) e será exercido mediante o auxílio do TCDF, ao qual compete, em concreto, a realização das ações fiscalizatórias, a análise das contas anuais do governador do DF e o julgamento das contas dos administradores e demais responsáveis por dinheiros, bens e valores públicos distritais.\nAcerca das competências outorgadas ao TCDF e considerando as informações acima, julgue o item seguinte.\nA jurisdição do TCDF abrange os representantes do DF ou do poder público na assembléia geral das empresas estatais e sociedades anônimas de cujo capital o DF ou o poder público participem, solidariamente, com os membros dos conselhos fiscal e de administração, pela prática de atos de gestão ruinosa ou liberalidade à custa das respectivas sociedades.","r":"O gabarito é Certo[cite: 2]. A afirmativa replica ips litteris a previsão do art. 6º, inciso VIII, da Lei Complementar nº 01/1994 (LO/TCDF)[cite: 1]. A jurisdição alcança os representantes do Poder Público nas estatais, os quais respondem solidariamente com os membros dos Conselhos Fiscal e de Administração especificamente quando praticarem atos caracterizados como gestão ruinosa ou liberalidade à custa da sociedade[cite: 1].","rf":"Representantes do DF em sociedades anônimas caem na jurisdição do TCDF se praticarem gestão ruinosa ou liberalidade.","g":"Certo","t":"CE","tm":"Controle Externo e Legislação Institucional"},{"n":182,"bc":"CEBRASPE, Auditor (TCDF)","es":"tematico","ft":"Mista (Interna + Jurisprudência STF)","nv":"media","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"182) Ao fixar as regras gerais acerca de competência, atribuições, composição e funcionamento do TCU, a Constituição da República definiu os parâmetros a serem seguidos pelos tribunais de contas dos estados e municípios. Considerando a jurisprudência do STF referente aos tribunais de contas e em particular ao TCDF, julgue o item a seguir.\nSe, para a execução de obra, o DF e a União celebrarem convênio para o aporte de recursos federais e do próprio DF, conforme entendimento pacífico do STF, a fiscalização da obra ficará limitada à atuação do TCU.","r":"O gabarito é Errado[cite: 2]. Em casos de convênios mistos com aportes de esferas distintas (União e DF), a fiscalização não é excludente[cite: 1]. Conforme o art. 6º, VI, da LO/TCDF e a pacífica jurisprudência do STF, a jurisdição é concorrente no limite dos aportes: o TCU fiscaliza a parcela de recursos federais, e o TCDF mantém sua competência para fiscalizar rigorosamente a contrapartida estadual/distrital.","rf":"Convênios mistos (União + DF) geram fiscalização concorrente: TCU audita a verba federal e o TCDF audita a contrapartida do DF.","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":183,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"183) Acerca da competência do TCDF, julgue o item abaixo.\nA competência do TCDF restringe-se aos órgãos e entidades que integram a estrutura do DF, não alcançando, por exemplo, uma pessoa de direito privado que, por força de convênio, receba recursos do DF.","r":"O gabarito é Errado[cite: 2]. A jurisdição da Corte de Contas é ampla e segue o dinheiro público, superando a mera barreira estrutural da Administração. Segundo o art. 6º, IV e VI, da LO/TCDF, pessoas de direito privado que recebam contribuições, recursos ou celebrem convênios com o Distrito Federal estão expressamente sujeitas à fiscalização e jurisdição do Tribunal de Contas[cite: 1].","rf":"A jurisdição do TCDF não se restringe a órgãos públicos; alcança plenamente entes privados que gerenciem verba pública distrital.","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":184,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"tematico","ft":"Interna","nv":"media","td":"→ Estável","fr":"2024 (1 questão)","an":[2024],"ar":2024,"q":"184) Em relação às normas que regem o Ministério Público (MP) junto aos tribunais de contas, julgue o item a seguir, considerando, no que couber, o entendimento jurisprudencial do STF.\nA forma de escolha do procurador-geral do MP junto aos tribunais de contas constitui norma constitucional de reprodução obrigatória pelos estados-membros.","r":"O gabarito é Errado[cite: 2]. De acordo com a jurisprudência atual do STF abordada na teoria da LO/TCDF, a definição do modelo de escolha e nomeação do Procurador-Geral das Cortes de Contas estaduais/distritais não é norma de reprodução obrigatória imposta pelo modelo federal[cite: 1]. Insere-se no âmbito da autonomia política e administrativa dos entes federativos organizar seu respectivo Ministério Público de Contas[cite: 1].","rf":"O modelo de escolha do Procurador-Geral do MPTC é de autonomia do ente federado (DF/Estados), não sendo norma de reprodução obrigatória da CF.","g":"Errado","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"},{"n":185,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2023 (1 questão)","an":[2023],"ar":2023,"q":"185) De acordo com a Lei Orgânica do Tribunal de Contas do Distrito Federal (TCDF) e o Regimento Interno do TCDF, julgue o item a seguir, considerando, quando cabível, o entendimento do Supremo Tribunal Federal (STF).\nOs membros do Ministério Público junto ao TCDF possuem independência funcional e, em razão disso, detêm legitimidade para impetrar mandado de segurança contra acórdão da corte de contas perante a qual oficia.","r":"O gabarito é Errado[cite: 2]. Apesar de os membros do Ministério Público de Contas gozarem expressamente de independência funcional (art. 76 da LO/TCDF), a jurisprudência pacífica do STF entende que o MPTC não detém personalidade jurídica própria nem capacidade processual (legitimidade ativa) para impetrar Mandado de Segurança contra as decisões proferidas pelo próprio Tribunal de Contas perante o qual oficia[cite: 1].","rf":"O MPTC não possui legitimidade para impetrar MS contra acórdãos do TCDF, a despeito de sua independência funcional.","g":"Errado","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"},{"n":190,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"tematico","ft":"Externa (Constituição Federal / LODF)","nv":"baixa","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"190) Acerca do Ministério Público que atua junto ao TCDF (MP/TCDF), julgue o item que se segue.\nOs procuradores do MP/TCDF equiparam-se aos procuradores do DF quanto a direitos, garantias, vedações e forma de investidura no cargo.","r":"O gabarito é Errado[cite: 2]. Há uma grave confusão de carreiras no enunciado. Os membros do Ministério Público junto ao TCDF equiparam-se, por simetria constitucional, aos membros do Ministério Público Comum (Promotores/Procuradores de Justiça do MPDFT). Eles não se equiparam aos \"Procuradores do DF\" (PGDF), que constituem a Advocacia Pública distrital e possuem regras, garantias e investiduras distintas.","rf":"Membros do MPTC equiparam-se aos membros do Ministério Público (MPDFT), e não aos membros da Advocacia Pública (Procuradores do DF/PGDF).","g":"Errado","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"},{"n":191,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"tematico","ft":"Externa (Regimento Interno do TCDF)","nv":"media","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"191) Acerca do Ministério Público que atua junto ao TCDF (MP/TCDF), julgue o item que se segue.\nNos processos que já se encontrem em tramitação no TCDF, os procuradores do MP/TCDF somente podem agir na qualidade de custus legis, sendo-lhes vedado, por exemplo, encaminhar representações ao Tribunal.","r":"O gabarito é Errado[cite: 2]. A atuação do MPTC não se restringe à emissão passiva de pareceres. Na defesa da ordem jurídica e fiscalização da lei, os membros do MP/TCDF detêm a prerrogativa proativa de formular representações e interpor recursos, não lhes sendo vedado provocar o Tribunal sobre irregularidades identificadas, inclusive em processos já autuados.","rf":"O MPTC atua ativamente formulando representações e interpondo recursos; não é um mero emissor passivo de pareceres.","g":"Errado","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"},{"n":192,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"tematico","ft":"Externa (Regimento Interno do TCDF)","nv":"media","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"192) Acerca do Ministério Público que atua junto ao TCDF (MP/TCDF), julgue o item que se segue.\nÉ obrigatória a manifestação do MP/TCDF em todos os processos em tramitação no TCDF.","r":"O gabarito é Errado[cite: 2]. Por força de racionalização processual regulada no Regimento Interno, a manifestação do MPTC não é obrigatória em *todos* os processos indiscriminadamente. Existem feitos de natureza meramente administrativa interna ou diligências preliminares que prescindem de manifestação obrigatória do parquet de contas, atuando este apenas nos processos previstos em lei ou regimentados.","rf":"A manifestação do MPTC não é irrestrita e obrigatória para todos os processos (ex: expedientes internos e processos sem mérito definido).","g":"Errado","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"},{"n":193,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"193) Acerca do Ministério Público que atua junto ao TCDF (MP/TCDF), julgue o item que se segue.\nComo o MP/TCDF integra a estrutura do TCDF, encontram-se os seus procuradores, quanto à sua atuação funcional, subordinados hierarquicamente ao presidente do Tribunal.","r":"O gabarito é Errado[cite: 2]. É basilar na organização da Corte que o Ministério Público junto ao TCDF, embora não tenha personalidade jurídica apartada, goza de estrita \"independência funcional\" (Art. 76 da LO/TCDF)[cite: 1]. Não existe qualquer subordinação hierárquica funcional entre os Procuradores do MPTC-DF e o Presidente do TCDF ou os Conselheiros[cite: 1].","rf":"Não há hierarquia nem subordinação funcional entre os Membros do MPTC-DF e a Presidência/Conselheiros do Tribunal de Contas.","g":"Errado","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"},{"n":194,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"194) Acerca da organização e do funcionamento do MP/TCDF, julgue o item a seguir.\nOs servidores que exercem atividades de apoio ao MP/TCDF integram o quadro de pessoal efetivo e comissionado do próprio TCDF.","r":"O gabarito é Certo[cite: 2]. Por não ostentar personalidade jurídica nem autonomia orçamentária autônoma nos moldes do MP comum, o apoio institucional ao Ministério Público de Contas provém do próprio Tribunal[cite: 1]. Os servidores que prestam esse apoio técnico e administrativo ao MPTC-DF compõem regularmente o quadro de pessoal (Serviços Auxiliares) do próprio TCDF[cite: 1].","rf":"O MPTC-DF não possui quadro próprio apartado; seus servidores administrativos integram o quadro geral do TCDF.","g":"Certo","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"},{"n":195,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"195) Acerca da organização e do funcionamento do MP/TCDF, julgue o item a seguir.\nO procurador-geral do MP/TCDF não é ordenador de despesas.","r":"O gabarito é Certo[cite: 2]. Como o MPTC-DF atua \"junto ao TCDF\" sem autonomia financeira para ter orçamento desvinculado, as despesas da instituição são ordenadas e movimentadas pelo Presidente do TCDF (Art. 68, IV, da LO/TCDF)[cite: 1]. Logo, o Procurador-Geral de Contas efetivamente não figura como ordenador de despesas[cite: 1].","rf":"O MPTC-DF não possui orçamento próprio; a ordenação de despesas caberá sempre ao Presidente do TCDF.","g":"Certo","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"},{"n":196,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"tematico","ft":"Externa (Lei nº 13.043/2014)","nv":"baixa","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"196) Acerca da organização e do funcionamento do MP/TCDF, julgue o item a seguir.\nO MP/TCDF encontra-se organizado em carreira. Desse modo, os procuradores são admitidos por concurso público e nomeados para o cargo de procurador, podendo ser posteriormente promovidos ao cargo de subprocurador-geral do TCDF.","r":"O gabarito é Errado[cite: 2]. Diferentemente da estrutura escalonada do Ministério Público da União (que conta com Subprocuradores-Gerais), a carreira dos membros do Ministério Público junto ao TCDF não é fracionada em entrâncias e instâncias de promoção (como Procurador e Subprocurador). A investidura e carreira dão-se de forma única no cargo de Procurador.","rf":"A carreira do MPTC-DF é de classe única (Procurador), não havendo ascensão para a figura de \"Subprocurador-Geral\".","g":"Errado","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"},{"n":197,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"197) Acerca da organização e do funcionamento do MP/TCDF, julgue o item a seguir.\nAdmite-se a recondução do procurador-geral do MP/TCDF.","r":"O gabarito é Certo[cite: 2]. O art. 76-A da LO/TCDF estabelece que o Procurador-Geral do Ministério Público junto ao Tribunal de Contas será nomeado para mandato de 2 anos, sendo expressamente \"PERMITIDA UMA RECONDUÇÃO\"[cite: 1].","rf":"O mandato do PG do MPTC-DF é de 2 anos, admitindo-se exatamente UMA recondução.","g":"Certo","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"}];

<script>
/* ============================================================
   Sala de Estudos — motor genérico de simulados
   Abas macro por matéria (cada uma com página independente)
   Simulado + Estatísticas + Caderno de erros + Flashcards por matéria
   ============================================================ */

const NIVEL_LABEL = { baixa:'Baixa incidência', media:'Média incidência', alta:'Alta incidência' };
const NIVEL_STARS = { baixa:'★☆☆☆☆', media:'★★★☆☆', alta:'★★★★★' };
const ESCOPO_LABEL = { literal:'Edital · literal', tematico:'Edital · temático', fora:'Fora do edital' };
const ESCOPO_CLASS = { literal:'tag-literal', tematico:'tag-tematico', fora:'tag-fora' };

const TEMA_ORDER = [
  'Natureza, Competência e Jurisdição',
  'Composição, Conselheiros e Auditores',
  'Ministério Público de Contas (MP/TCDF)',
  'Controle Externo e Legislação Institucional',
  'Processo, Fiscalização e Sanções',
  'Serviços Auxiliares e Servidores',
  'Fora do Edital',
  'Geral',
];

const TEMA_RULES = [
  ['Ministério Público de Contas (MP/TCDF)', /Minist[ée]rio P[úu]blico|MP\/TCDF|MPTC|[Pp]rocurador/],
  ['Composição, Conselheiros e Auditores', /composi[çc][ãa]o|estrutura.{0,20}(TCDF|membros)|[Cc]onselheiro|\bauditor(es)?\b|[Pp]len[áa]rio|c[âa]maras? do (tribunal|TCDF)|dividir.{0,15}c[âa]maras|[Pp]residente|[Vv]ice-presidente/],
  ['Serviços Auxiliares e Servidores', /servi[çc]os auxiliares|\bservidor(es)?\b/],
  ['Processo, Fiscalização e Sanções', /processual de contas|medidas cautelares|sanç|instrumentos de fiscaliza|auditoria governamental|inspeç|levantamento/],
  ['Controle Externo e Legislação Institucional', /controle externo|legisla[çc][ãa]o institucional|C[âa]mara Legislativa|controle da administra[çc][ãa]o|controle legislativo|poderes,? organiza[çc][ãa]o administrativa/],
];

function classifyTema(enunciado, escopoKey){
  if(escopoKey === 'fora') return 'Fora do Edital';
  const firstLine = (enunciado||'').split('\n')[0];
  for(const [tema, re] of TEMA_RULES){ if(re.test(firstLine)) return tema; }
  const head = (enunciado||'').slice(0,500);
  for(const [tema, re] of TEMA_RULES){ if(re.test(head)) return tema; }
  return null;
}

function ordenarTemas(lista){
  return lista.slice().sort((a,b)=>{
    const ia = TEMA_ORDER.indexOf(a), ib = TEMA_ORDER.indexOf(b);
    if(ia===-1 && ib===-1) return a.localeCompare(b,'pt-BR');
    if(ia===-1) return 1;
    if(ib===-1) return -1;
    return ia-ib;
  });
}

function slugify(str){
  return (str||'materia')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/(^-|-$)/g,'') || 'materia';
}

/* ------------- base dataset (embutido) ------------- */
const MATERIA_PADRAO = CONFIG.materiaPadrao || 'Questões';

// matérias que o usuário pode gerenciar (remover/publicar/atualizar) — inclui
// literalmente todas, até a matéria embutida diretamente no arquivo original,
// já que nenhuma matéria deve ficar "travada" sem opção de remover/atualizar
function materiasGerenciaveis(){
  return Array.from(new Set(ALL_QUESTIONS.map(q => q.materia)));
}
let ALL_QUESTIONS = QUESTIONS.map(q => ({
  ...q,
  materia: MATERIA_PADRAO,
  tema: q.tm || 'Geral',
  uid: slugify(MATERIA_PADRAO) + '-' + q.n,
  origem: 'embutido',
}));

let BY_UID = {};
// Alguns documentos de origem citam a fonte (ex.: "Apostila X — Y.pdf") sem usar o
// marcador [Fonte]: esperado — nesses casos ela acaba grudada no fim do enunciado
// ou da última alternativa durante o parse. Essa limpeza detecta esse padrão e
// separa a fonte pro campo próprio (q.ft), tirando ela de onde não devia estar.
// Roda em toda questão carregada (embutida, importada ou pública), então corrige
// retroativamente até questões já importadas antes dessa correção existir.
// Aceita vários formatos de separador antes da fonte (travessão —, hífen -,
// dois-pontos, quebra de linha), já que documentos de origem diferentes citam a
// fonte de jeitos diferentes — o sinal confiável é sempre terminar num arquivo
// (.pdf/.doc/.ppt/.xls/.txt).
function extrairFonteEmbutida(texto){
  if(!texto) return null;
  if(!/\.(pdf|docx?|pptx?|xlsx?|txt)\s*$/i.test(texto)) return null;
  const m = texto.match(/^([\s\S]*?)([.!?:]|\n|\s[-–—])\s*([A-Za-zÀ-ÿ0-9][\s\S]{0,120}\.(?:pdf|docx?|pptx?|xlsx?|txt))\s*$/i);
  if(!m) return null;
  const pontuacao = /[.!?:]/.test(m[2]) ? m[2] : '';
  const limpo = (m[1] + pontuacao).trim();
  if(!limpo) return null; // evita esvaziar o texto inteiro se o "match" cobrir tudo
  return { limpo, fonte: m[3].trim() };
}
// alguns documentos de origem marcam o resumo flash com "⚡ Resumo Flash:" (sem
// colchetes) em vez do formato [Resumo Flash]: esperado pelo parser — nesses
// casos ele fica grudado dentro da Resolução, e o campo de resumo fica vazio.
// Essa função detecta esse padrão e separa o resumo pro campo próprio.
function extrairResumoFlashEmbutido(texto){
  if(!texto) return null;
  const m = texto.match(/[⚡💡]?\s*Resumo\s+Flash\s*:\s*([\s\S]+)$/i);
  if(!m) return null;
  const limpo = texto.slice(0, m.index).trim();
  if(!limpo) return null; // evita esvaziar o texto inteiro se o "match" cobrir tudo
  return { limpo, resumo: m[1].trim() };
}
// remove marcadores de citação do tipo "[cite: 1]", "[cite: 2, 3]" que sobraram
// no texto — resíduo de ferramentas de IA usadas pra gerar o conteúdo original,
// que referenciam trechos-fonte internos e nunca deveriam aparecer pro usuário.
// Preserva colchetes legítimos (ex.: "[Art. 5º]"), já que exige especificamente
// a palavra "cite" seguida de dois-pontos e números.
function limparMarcadoresCitacao(texto){
  if(!texto) return texto;
  return texto
    .replace(/\s*\[\s*cite\s*:\s*[\d,\s]+\]/gi, '')
    .replace(/[ \t]{2,}/g, ' ')
    .trim();
}
// "[Fonte: Teoria — Apostila X, Bloco N / Art. Y]" às vezes aparece solto no meio
// do texto (mesmo problema do [cite: N], só que com informação útil dentro) —
// em vez de só apagar, aproveita o conteúdo pro campo q.ft antes de limpar
function extrairFonteColchete(texto){
  if(!texto) return null;
  const m = texto.match(/\[\s*fonte\s*:\s*([^\]]*)\]\.?/i);
  if(!m) return null;
  const limpo = (texto.slice(0, m.index) + texto.slice(m.index + m[0].length)).replace(/[ \t]{2,}/g, ' ').trim();
  return { limpo, fonte: m[1].trim() };
}
function sanitizarFonteEmbutida(q){
  ['q','r','rf'].forEach(campo=>{
    if(q[campo]) q[campo] = limparMarcadoresCitacao(q[campo]);
  });
  if(Array.isArray(q.alt)){
    q.alt.forEach(a=>{ if(a && a.texto) a.texto = limparMarcadoresCitacao(a.texto); });
  }
  // "[Fonte: ...]" colchete embutido em qualquer campo de texto — extrai pro
  // campo q.ft (se ainda vazio) antes de limpar o texto exibido
  ['q','r','rf'].forEach(campo=>{
    if(!q[campo]) return;
    const r = extrairFonteColchete(q[campo]);
    if(r){ q[campo] = r.limpo; if(!q.ft) q.ft = r.fonte; }
  });
  if(Array.isArray(q.alt)){
    q.alt.forEach(a=>{
      if(!a || !a.texto) return;
      const r = extrairFonteColchete(a.texto);
      if(r){ a.texto = r.limpo; if(!q.ft) q.ft = r.fonte; }
    });
  }
  if(q.q){
    const r = extrairFonteEmbutida(q.q);
    if(r){ q.q = r.limpo; if(!q.ft) q.ft = r.fonte; }
  }
  if(Array.isArray(q.alt)){
    q.alt.forEach(a=>{
      if(!a || !a.texto) return;
      const r = extrairFonteEmbutida(a.texto);
      if(r){ a.texto = r.limpo; if(!q.ft) q.ft = r.fonte; }
    });
  }
  if(q.r && !q.rf){
    const r = extrairResumoFlashEmbutido(q.r);
    if(r){ q.r = r.limpo; q.rf = r.resumo; }
  }
  // item 2: classificação retroativa de assunto — se a questão ainda não tem um
  // tema específico (fica em "Geral"/vazio), tenta extrair um nome de assunto
  // razoável a partir do campo Fonte (ex.: "Apostila LINDB — Direito Civil.pdf"
  // → assunto "LINDB"), já que esse campo costuma nomear o módulo/tópico exato
  if((!q.tema || q.tema==='Geral') && q.ft){
    const assuntoDaFonte = extrairAssuntoDaFonte(q.ft);
    if(assuntoDaFonte) q.tema = assuntoDaFonte;
  }
}
// tenta extrair um nome de assunto específico a partir do texto da fonte —
// heurística conservadora: só usa se o resultado for curto e plausível como
// nome de tópico, senão prefere deixar sem classificação a arriscar um rótulo
// errado
function extrairAssuntoDaFonte(fonte){
  if(!fonte) return null;
  // procura "Apostila <algo>" em qualquer posição do texto, já que às vezes vem
  // precedido de outro rótulo (ex.: "Teoria — Apostila LINDB, Bloco 5")
  const mApostila = fonte.match(/apostila\s+([^,—\-/]+)/i);
  if(mApostila){
    const candidato = mApostila[1].trim().replace(/\.(pdf|docx?|pptx?|xlsx?|txt)$/i, '').trim();
    if(candidato.length>=3 && candidato.length<=40 && !/^\d+$/.test(candidato)) return candidato;
  }
  const m = fonte.match(/^([^—\-/]+)/);
  if(!m) return null;
  const candidato = m[1].trim().replace(/\.(pdf|docx?|pptx?|xlsx?|txt)$/i, '').trim();
  if(candidato.length<3 || candidato.length>40) return null;
  if(/^\d+$/.test(candidato)) return null; // evita rótulos que são só números
  if(/^(teoria|pr[aá]tica|quest[aã]o|exerc[ií]cio)$/i.test(candidato)) return null; // rótulo genérico, não é assunto real
  return candidato;
}
// normaliza o enunciado pra comparação (ignora maiúscula/minúscula e espaços
// extras), usado só pra DETECTAR duplicatas — nunca altera o texto exibido
function normalizarParaComparacao(texto){
  return (texto||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
}
// questões com o MESMO enunciado (exatamente a mesma pergunta), dentro da MESMA
// matéria, cobradas em provas/anos diferentes — mantém só a mais recente
// (maior ano) selecionável, marcando as demais como duplicataOculta. Nada é
// apagado: quem já tiver respondido uma versão mais antiga mantém seu
// histórico intacto, ela só para de aparecer como opção pra NOVAS tentativas
function marcarDuplicatas(){
  const porMateria = {};
  ALL_QUESTIONS.forEach(q=>{
    q.duplicataOculta = false;
    const chave = normalizarParaComparacao(q.q);
    if(!chave || chave.length<15) return; // enunciados muito curtos não entram na checagem (risco de falso positivo)
    if(!porMateria[q.materia]) porMateria[q.materia] = {};
    if(!porMateria[q.materia][chave]) porMateria[q.materia][chave] = [];
    porMateria[q.materia][chave].push(q);
  });
  Object.values(porMateria).forEach(grupos=>{
    Object.values(grupos).forEach(lista=>{
      if(lista.length<=1) return;
      // mais recente primeiro (ano ausente conta como o mais antigo do grupo);
      // em caso de empate no ano, mantém a que tem gabarito/resolução mais completos
      lista.sort((a,b)=>{
        if((b.ar||0)!==(a.ar||0)) return (b.ar||0)-(a.ar||0);
        return ((b.r||'').length+(b.rf||'').length) - ((a.r||'').length+(a.rf||'').length);
      });
      lista.forEach((q,i)=>{ if(i>0) q.duplicataOculta = true; });
    });
  });
}
function reindex(){
  ALL_QUESTIONS.forEach(sanitizarFonteEmbutida);
  marcarDuplicatas();
  BY_UID = Object.fromEntries(ALL_QUESTIONS.map(q => [q.uid, q]));
}
reindex();

function materiasDisponiveis(){
  const seen = [];
  ALL_QUESTIONS.forEach(q=>{ if(!seen.includes(q.materia)) seen.push(q.materia); });
  return seen;
}
function temasDisponiveis(materia){
  const set = new Set(ALL_QUESTIONS.filter(q=>q.materia===materia).map(q=>q.tema));
  return ordenarTemas(Array.from(set));
}

/* ================= storage ================= */
const STORAGE_KEY = 'sim-progresso-v3';
const CUSTOM_KEY = 'sim-questoes-importadas-v3';
let PROGRESS = {}; // { [materia]: { perguntas:{}, flash:{}, sessoes:[] } }

// Camada de armazenamento: usa window.storage (Claude.ai artifact) quando disponível;
// se o arquivo for aberto fora do Claude.ai (ex.: baixado e aberto direto no navegador),
// cai automaticamente para localStorage, que funciona normalmente nesse cenário.
const CLAUDE_STORAGE_OK = (typeof window !== 'undefined') && window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function';
let STORAGE_MODE = CLAUDE_STORAGE_OK ? 'claude' : 'local';

async function storageGet(key){
  if(STORAGE_MODE === 'claude'){
    // erros aqui são esperados (ex.: chave ainda não existe) e não indicam indisponibilidade da API;
    // portanto não alternamos de modo por causa de um storageGet — só storageSet decide isso.
    return await window.storage.get(key, false);
  }
  const v = window.localStorage.getItem(key);
  if(v === null){ const err = new Error('not found'); throw err; }
  return { key, value: v };
}
async function storageSet(key, value){
  if(STORAGE_MODE === 'claude'){
    try{
      return await window.storage.set(key, value, false);
    }catch(e){
      console.warn('window.storage indisponível, alternando para localStorage neste navegador.', e);
      STORAGE_MODE = 'local';
    }
  }
  window.localStorage.setItem(key, value);
  return { key, value };
}

function getBucket(materiaKey){
  if(!PROGRESS[materiaKey]) PROGRESS[materiaKey] = { perguntas:{}, flash:{}, sessoes:[], simuladosSalvos:[] };
  if(!PROGRESS[materiaKey].simuladosSalvos) PROGRESS[materiaKey].simuladosSalvos = [];
  return PROGRESS[materiaKey];
}

/* ================= sincronização em nuvem (Firebase Firestore) ================= */
const SYNC_CODE_KEY = 'sim-sync-code';
const ZOOM_KEY = 'sim-zoom-level';
const THEME_KEY = 'sim-theme';
const LAST_SYNC_KEY = 'sim-ultimo-sync';

function quizStorageKey(materiaKey){
  return 'quiz-atual-' + slugify(materiaKey);
}
let syncQuizEmAndamentoTimer = null;
let quizSyncPendente = null; // { materiaKey, quiz } — usado pra garantir envio mesmo se a aba fechar antes do debounce
// salva automaticamente o simulado em andamento a cada ação do usuário — tanto
// localmente (funciona mesmo offline) quanto na nuvem (pra "Continuar último
// salvo" aparecer em qualquer PC/celular depois de digitar o mesmo código de
// sincronização, não só no aparelho onde a resposta foi dada)
function salvarQuizEmAndamento(){
  const quiz = STATE.quiz;
  if(!quiz || quiz.finished) return;
  quiz.ultimoSalvamento = Date.now();
  storageSet(quizStorageKey(quiz.materia), JSON.stringify(quiz)).catch(()=>{});
  STATE.quizzesEmAndamento[quiz.materia] = quiz;
  quizSyncPendente = { materiaKey: quiz.materia, quiz };
  clearTimeout(syncQuizEmAndamentoTimer);
  // debounce curto (250ms): junta cliques em sequência rápida num só envio, mas
  // sem deixar passar tempo demais até chegar na nuvem — se a aba fechar antes
  // disso, o flush em visibilitychange/pagehide cobre o que ficou pendente
  syncQuizEmAndamentoTimer = setTimeout(()=>{ flushQuizSyncPendente(); }, 250);
}
function flushQuizSyncPendente(){
  clearTimeout(syncQuizEmAndamentoTimer);
  if(!quizSyncPendente) return;
  const { materiaKey, quiz } = quizSyncPendente;
  quizSyncPendente = null;
  sincronizarQuizEmAndamentoNaNuvem(materiaKey, quiz);
}
// grava só o campo desta matéria (merge), sem tocar no progresso nem nos
// simulados em andamento de outras matérias que possam estar salvos na nuvem
async function sincronizarQuizEmAndamentoNaNuvem(materiaKey, quiz){
  if(!FIREBASE_OK || !STATE.syncCode) return;
  try{
    await fbDb.collection('progresso').doc(STATE.syncCode).set({
      quizzesEmAndamento: { [materiaKey]: sanitizarParaFirestore(quiz) }
    }, { merge: true });
  }catch(e){ console.warn('Falha ao sincronizar simulado em andamento na nuvem', e); }
}
function limparQuizSalvo(materiaKey){
  storageSet(quizStorageKey(materiaKey), '').catch(()=>{});
  STATE.quizzesEmAndamento[materiaKey] = null;
  if(quizSyncPendente && quizSyncPendente.materiaKey===materiaKey){
    clearTimeout(syncQuizEmAndamentoTimer);
    quizSyncPendente = null;
  }
  if(FIREBASE_OK && STATE.syncCode){
    fbDb.collection('progresso').doc(STATE.syncCode).set({
      quizzesEmAndamento: { [materiaKey]: null }
    }, { merge: true }).catch(e=>console.warn('Falha ao limpar simulado em andamento na nuvem', e));
  }
}
async function carregarQuizSalvo(materiaKey){
  try{
    const res = await storageGet(quizStorageKey(materiaKey));
    if(res && res.value){
      const q = JSON.parse(res.value);
      if(q && q.queue && q.queue.length && !q.finished) return q;
    }
  }catch(e){ /* nada salvo pra essa matéria ainda neste dispositivo */ }
  return null;
}
async function verificarQuizSalvo(materiaKey){
  const q = await carregarQuizSalvo(materiaKey);
  STATE.quizzesEmAndamento[materiaKey] = q;
  render();
}
function formatarDataHoraSalvamento(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

let FIREBASE_OK = false;
let fbDb = null;
try{
  if(typeof firebase !== 'undefined' && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey){
    firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.firestore();
    FIREBASE_OK = true;
  }
}catch(e){ console.warn('Firebase indisponível nesta sessão.', e); }

// pdf.js precisa do worker configurado antes do primeiro uso — mesma versão do
// script carregado no <head>, servido pelo mesmo CDN
if(typeof pdfjsLib !== 'undefined'){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js';
}

function mergeBucket(local, remote){
  local = local || { perguntas:{}, flash:{}, sessoes:[], simuladosSalvos:[] };
  remote = remote || { perguntas:{}, flash:{}, sessoes:[], simuladosSalvos:[] };
  const merged = { perguntas:{...local.perguntas}, flash:{...local.flash}, sessoes:[...(local.sessoes||[])], simuladosSalvos:[...(local.simuladosSalvos||[])] };

  Object.entries(remote.perguntas||{}).forEach(([uid, remoteP])=>{
    const localP = merged.perguntas[uid];
    const allHist = [...((localP&&localP.historico)||[]), ...(remoteP.historico||[])];
    if(allHist.length===0) return;
    const seen = new Set();
    const dedup = [];
    allHist.sort((a,b)=>a.ts-b.ts).forEach(h=>{
      const k = h.ts+'-'+h.c;
      if(!seen.has(k)){ seen.add(k); dedup.push(h); }
    });
    merged.perguntas[uid] = {
      tentativas: dedup.length,
      acertos: dedup.filter(h=>h.c).length,
      ultimoResultado: dedup[dedup.length-1].c,
      historico: dedup.slice(-20),
    };
  });

  Object.entries(remote.flash||{}).forEach(([uid, remoteF])=>{
    const localF = merged.flash[uid];
    if(!localF || (remoteF.ts||0) > (localF.ts||0)) merged.flash[uid] = remoteF;
  });

  const sessKeys = new Set(merged.sessoes.map(s=>s.ts));
  (remote.sessoes||[]).forEach(s=>{
    if(!sessKeys.has(s.ts)){ merged.sessoes.push(s); sessKeys.add(s.ts); }
  });
  merged.sessoes.sort((a,b)=>a.ts-b.ts);
  if(merged.sessoes.length>50) merged.sessoes = merged.sessoes.slice(-50);

  const salvosKeys = new Set(merged.simuladosSalvos.map(s=>s.ts));
  (remote.simuladosSalvos||[]).forEach(s=>{
    if(!salvosKeys.has(s.ts)){ merged.simuladosSalvos.push(s); salvosKeys.add(s.ts); }
  });
  merged.simuladosSalvos.sort((a,b)=>a.ts-b.ts);
  if(merged.simuladosSalvos.length>20) merged.simuladosSalvos = merged.simuladosSalvos.slice(-20);

  return merged;
}

function mergeRemoteProgressoNaMemoria(remoteProgress){
  Object.entries(remoteProgress||{}).forEach(([materiaKey, remoteBucket])=>{
    PROGRESS[materiaKey] = mergeBucket(PROGRESS[materiaKey], remoteBucket);
  });
}

// mescla os simulados "em andamento" vindos da nuvem com os que já estão em
// memória neste dispositivo. Em caso de conflito (a mesma matéria com uma sessão
// ativa tanto aqui quanto em outro aparelho), vence o salvamento mais recente —
// e o vencedor também é gravado no armazenamento local, pra "Continuar" funcionar
// mesmo se o dispositivo ficar sem internet logo em seguida
function mergeRemoteQuizzesEmAndamentoNaMemoria(remoteQuizzes){
  Object.entries(remoteQuizzes||{}).forEach(([materiaKey, quizRemoto])=>{
    const valido = quizRemoto && quizRemoto.queue && quizRemoto.queue.length && !quizRemoto.finished;
    if(!valido) return;
    const quizLocal = STATE.quizzesEmAndamento[materiaKey];
    const remotoMaisNovo = !quizLocal || (quizRemoto.ultimoSalvamento||0) > (quizLocal.ultimoSalvamento||0);
    if(remotoMaisNovo){
      STATE.quizzesEmAndamento[materiaKey] = quizRemoto;
      storageSet(quizStorageKey(materiaKey), JSON.stringify(quizRemoto)).catch(()=>{});
      // se essa matéria é a que está aberta agora e não há nada mais novo em tela,
      // atualiza a sessão ativa também (evita ficar respondendo uma versão velha)
      if(STATE.quiz && STATE.quiz.materia===materiaKey && (STATE.quiz.ultimoSalvamento||0) < (quizRemoto.ultimoSalvamento||0)){
        STATE.quiz = quizRemoto;
      }
    }
  });
}

function mergeRemoteQuestoesNaMemoria(remoteQuestoes){
  if(!Array.isArray(remoteQuestoes)) return 0;
  const existingUids = new Set(ALL_QUESTIONS.map(q=>q.uid));
  let added = 0;
  remoteQuestoes.forEach(q=>{
    if(q && q.uid && !existingUids.has(q.uid)){
      ALL_QUESTIONS.push(q);
      existingUids.add(q.uid);
      added++;
    }
  });
  if(added>0) reindex();
  return added;
}

function setSyncStatusDOM(type, msg, detalhe){
  STATE.syncStatus = { type, msg, detalhe, ts: Date.now() };
  const el = document.getElementById('sync-status-el');
  if(el){
    el.textContent = msg;
    el.className = 'sync-status ' + type;
    if(detalhe) el.title = detalhe; else el.removeAttribute('title');
  }
}

function motivoErroFirestore(e){
  const codigo = e && e.code ? e.code : '';
  if(codigo === 'permission-denied') return 'Acesso negado — confira se você publicou as regras do Firestore (aba Regras → botão Publicar).';
  if(codigo === 'unavailable') return 'Sem conexão com o Firestore no momento — verifique sua internet e tente novamente.';
  if(codigo === 'not-found') return 'Banco de dados Firestore não encontrado — confira se ele foi criado no projeto certo.';
  return (e && e.message) ? e.message : 'erro desconhecido';
}

function formatarUltimoSync(ts){
  const d = new Date(ts);
  return `nuvem ✓ ${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})} ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
}
function marcarUltimoSyncOk(){
  const ts = Date.now();
  setSyncStatusDOM('ok', formatarUltimoSync(ts));
  storageSet(LAST_SYNC_KEY, String(ts)).catch(()=>{});
}

async function pullFromCloud({silent} = {}){
  if(!FIREBASE_OK || !STATE.syncCode) return null;
  if(!silent) setSyncStatusDOM('pending', 'sincronizando…');
  try{
    const doc = await fbDb.collection('progresso').doc(STATE.syncCode).get();
    if(doc.exists){
      const data = doc.data();
      if(data.progress) mergeRemoteProgressoNaMemoria(data.progress);
      // matérias/questões em si não vêm mais daqui — elas já chegam via
      // carregarMateriasPublicas() (coleção publico/{materia}), evitando duplicar
      // o banco inteiro de questões dentro do documento pessoal de progresso
      if(data.quizzesEmAndamento) mergeRemoteQuizzesEmAndamentoNaMemoria(data.quizzesEmAndamento);
      saveProgress();
      marcarUltimoSyncOk();
      return true;
    }else{
      // o código existe localmente, mas não tem NENHUM dado salvo na nuvem com esse
      // nome ainda — pode ser a primeira vez usando, ou pode ser um erro de digitação
      // (maiúscula/minúscula, espaço) fazendo cair num documento diferente do esperado
      setSyncStatusDOM('pending', `nenhum dado encontrado para "${STATE.syncCode}" — confira se digitou o código exatamente igual em todos os dispositivos`);
      return false;
    }
  }catch(e){
    console.error('Falha ao puxar da nuvem', e);
    setSyncStatusDOM('err', 'falha ao sincronizar (passe o mouse aqui)', motivoErroFirestore(e));
    return null;
  }
}

function sanitizarParaFirestore(obj){
  // remove chaves com valor undefined recursivamente (Firestore não aceita undefined)
  return JSON.parse(JSON.stringify(obj));
}

/* ================= matérias públicas (visíveis para todos os usuários) ================= */
async function carregarMateriasPublicas(){
  if(!FIREBASE_OK) return;
  try{
    // cada matéria pública tem seu próprio documento (em vez de um documento gigante
    // compartilhado), pra nunca bater no limite de 1MB por documento do Firestore
    const snapshot = await fbDb.collection('publico').get();
    const docs = snapshot.docs || [];
    const existingUids = new Set(ALL_QUESTIONS.map(q=>q.uid));
    let added = 0;
    docs.forEach(doc=>{
      const data = doc.data();
      if(data && Array.isArray(data.questoes)){
        data.questoes.forEach(q=>{
          if(q && q.uid && !existingUids.has(q.uid)){
            ALL_QUESTIONS.push({ ...q, origem: 'publico' });
            existingUids.add(q.uid);
            added++;
          }
        });
      }
    });
    if(added>0) reindex();
  }catch(e){ console.warn('Falha ao carregar matérias públicas', e); }
}

// grava cada matéria no seu próprio documento na coleção pública do Firestore (não
// mais um documento único compartilhado, que estourava o limite de 1MB conforme mais
// matérias iam sendo publicadas) — sem mexer em STATE.importLog nem chamar render(),
// usada tanto pelos botões manuais quanto pela publicação automática após importar
async function publicarQuestoesNoFirestore(nomesMaterias){
  if(!FIREBASE_OK) return { ok:false, motivo:'Sincronização em nuvem indisponível nesta sessão.' };
  if(!nomesMaterias || nomesMaterias.length===0) return { ok:false, motivo:'Nenhuma matéria selecionada.' };
  // cada matéria é publicada de forma INDEPENDENTE — se uma falhar (ex.: limite de
  // tamanho do documento no Firestore), as demais continuam sendo processadas
  // normalmente, e o retorno indica exatamente quais falharam, em vez de abortar o
  // lote inteiro silenciosamente na primeira matéria problemática
  let totalNovas = 0;
  const falhas = [];
  for(const materiaNome of nomesMaterias){
    try{
      const ref = fbDb.collection('publico').doc(slugify(materiaNome));
      const doc = await ref.get();
      let questoesAtuais = (doc.exists && Array.isArray(doc.data().questoes)) ? doc.data().questoes : [];
      const existingUids = new Set(questoesAtuais.map(q=>q.uid));
      ALL_QUESTIONS.filter(q=>q.materia===materiaNome).forEach(q=>{
        if(!existingUids.has(q.uid)){
          questoesAtuais.push({ ...q, origem:'publico' });
          existingUids.add(q.uid);
          totalNovas++;
        }
      });
      const payload = sanitizarParaFirestore({ materia: materiaNome, questoes: questoesAtuais, atualizadoEm: Date.now() });
      await ref.set(payload);
      STATE.materiasPublicadasNestaSessao.add(materiaNome);
    }catch(e){
      console.error('Falha ao publicar a matéria "'+materiaNome+'"', e);
      falhas.push({ materia: materiaNome, motivo: e && e.message ? e.message : motivoErroFirestore(e) });
    }
  }
  if(falhas.length===0) return { ok:true, totalNovas };
  if(falhas.length===nomesMaterias.length) return { ok:false, motivo: falhas.map(f=>`${f.materia}: ${f.motivo}`).join(' · ') };
  // sucesso parcial: publicou algumas, outras falharam — reporta os dois lados
  return { ok:true, parcial:true, totalNovas, falhas };
}

async function pushToCloud(){
  if(!FIREBASE_OK || !STATE.syncCode) return;
  try{
    // Só o progresso pessoal vai pro documento do usuário — as questões em si já
    // vivem em publico/{materia} (carregadas por qualquer visitante em
    // carregarMateriasPublicas()). Reenviar o banco de questões aqui duplicava
    // dezenas de milhares de caracteres a cada sync e estourava o limite de 1MB
    // por documento do Firestore conforme mais matérias eram importadas.
    const payload = sanitizarParaFirestore({
      progress: PROGRESS,
      updatedAt: Date.now(),
    });
    // merge:true é essencial aqui: sem isso, cada vez que o progresso é salvo
    // (a cada resposta) o documento inteiro seria sobrescrito, apagando o campo
    // quizzesEmAndamento gravado separadamente por sincronizarQuizEmAndamentoNaNuvem
    await fbDb.collection('progresso').doc(STATE.syncCode).set(payload, { merge: true });
    marcarUltimoSyncOk();
  }catch(e){
    console.error('Falha ao enviar para a nuvem', e);
    setSyncStatusDOM('err', 'falha ao sincronizar (passe o mouse aqui)', motivoErroFirestore(e));
  }
}

async function conectarSincronizacao(codigo){
  codigo = (codigo||'').trim().toLowerCase();
  if(!codigo) return;
  STATE.syncCode = codigo;
  try{ await storageSet(SYNC_CODE_KEY, codigo); }catch(e){ /* ignora */ }
  const encontrouDados = await pullFromCloud();
  await pushToCloud();
  if(encontrouDados === false){
    // evita que a mensagem de sucesso do push (que roda logo em seguida, criando o
    // documento pela primeira vez) esconda o aviso importante de que não havia
    // NENHUM dado prévio salvo com esse código — sinal de possível erro de digitação
    setSyncStatusDOM('pending', `código "${STATE.syncCode}" conectado — é a primeira vez que ele é usado, sem dados prévios na nuvem`);
  }
  render();
}

function desconectarSincronizacao(){
  STATE.syncCode = '';
  STATE.syncStatus = null;
  storageSet(SYNC_CODE_KEY, '').catch(()=>{});
  render();
}

async function loadProgress(){
  try{
    const res = await storageGet(STORAGE_KEY);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(parsed && parsed.perguntas && !Object.values(parsed).some(v=>v && v.perguntas)){
        PROGRESS = { [MATERIA_PADRAO]: parsed };
      } else {
        PROGRESS = parsed || {};
      }
    }
  }catch(e){ /* chave ainda não existe */ }

  try{
    const res2 = await storageGet(CUSTOM_KEY);
    if(res2 && res2.value){
      const custom = JSON.parse(res2.value);
      if(Array.isArray(custom) && custom.length){
        const uids = new Set(ALL_QUESTIONS.map(q=>q.uid));
        custom.forEach(q=>{
          if(!q || !q.uid || uids.has(q.uid)) return;
          const fixed = {
            ...q,
            es: (q.es==='literal'||q.es==='tematico'||q.es==='fora') ? q.es : 'literal',
            nv: (q.nv==='baixa'||q.nv==='media'||q.nv==='alta') ? q.nv : 'media',
            t: (q.t==='CE'||q.t==='MC') ? q.t : 'sem_gabarito',
            materia: q.materia || 'Importado',
            tema: q.tema || 'Geral',
          };
          ALL_QUESTIONS.push(fixed);
          uids.add(q.uid);
        });
        reindex();
      }
    }
  }catch(e){ /* sem questões importadas ainda */ }

  try{
    const res3 = await storageGet(SYNC_CODE_KEY);
    if(res3 && res3.value) STATE.syncCode = res3.value.trim().toLowerCase();
  }catch(e){ /* sem código de sincronização configurado ainda */ }

  try{
    const res4 = await storageGet(ZOOM_KEY);
    if(res4 && res4.value){
      const z = parseFloat(res4.value);
      if(!isNaN(z) && z>=0.8 && z<=1.6) STATE.zoomLevel = z;
    }
  }catch(e){ /* usa o padrão de 100% */ }

  try{
    const res5 = await storageGet(THEME_KEY);
    if(res5 && res5.value==='light') STATE.theme = 'light';
  }catch(e){ /* usa o padrão escuro */ }
  aplicarTema();

  if(STATE.syncCode){
    try{
      const res6 = await storageGet(LAST_SYNC_KEY);
      if(res6 && res6.value){
        STATE.syncStatus = { type:'ok', msg: formatarUltimoSync(parseInt(res6.value,10)) };
      }
    }catch(e){ /* nunca sincronizou ainda neste dispositivo */ }
    await pullFromCloud({ silent: true });
  }

  // matérias públicas (publicadas pelo administrador) aparecem para TODOS os usuários,
  // conectados ou não a um código de sincronização pessoal
  await carregarMateriasPublicas();
}

let saveTimer = null;
function saveProgress(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await storageSet(STORAGE_KEY, JSON.stringify(PROGRESS)); }
    catch(e){ console.error('Falha ao salvar progresso', e); }
    pushToCloud();
  }, 300);
}

async function saveCustomQuestions(){
  const custom = ALL_QUESTIONS.filter(q => q.origem === 'importado');
  try{ await storageSet(CUSTOM_KEY, JSON.stringify(custom)); }
  catch(e){ console.error('Falha ao salvar questões importadas', e); }
}

/* ================= exportar / importar progresso (backup manual entre computadores) ================= */
function exportarProgresso(){
  const payload = {
    formato: 'sim-progresso-backup-v1',
    exportadoEm: new Date().toISOString(),
    progress: PROGRESS,
    questoesImportadas: ALL_QUESTIONS.filter(q => q.origem === 'importado'),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dataStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `progresso-simulado-${dataStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

async function importarProgresso(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const payload = JSON.parse(e.target.result);
      if(!payload || typeof payload.progress !== 'object'){
        STATE.importProgressoLog = { error: 'Arquivo não reconhecido como backup de progresso válido.' };
        render();
        return;
      }
      // mescla progresso usando a mesma lógica robusta da sincronização em nuvem
      // (soma tentativas por questão sem perder nada do que já existe aqui)
      mergeRemoteProgressoNaMemoria(payload.progress);

      // reimporta também as questões customizadas do backup, se houver, evitando duplicar uid
      mergeRemoteQuestoesNaMemoria(payload.questoesImportadas);

      saveProgress();
      await saveCustomQuestions();
      STATE.importProgressoLog = { ok: true, ts: Date.now() };
      render();
    }catch(err){
      STATE.importProgressoLog = { error: 'Erro ao interpretar o arquivo: ' + err.message };
      render();
    }
  };
  reader.onerror = () => {
    STATE.importProgressoLog = { error: 'Não foi possível ler o arquivo selecionado.' };
    render();
  };
  reader.readAsText(file, 'utf-8');
}

function registrarResposta(materiaKey, uid, acertou){
  const bucket = getBucket(materiaKey);
  const p = bucket.perguntas[uid] || { tentativas:0, acertos:0, ultimoResultado:null, historico:[] };
  p.tentativas += 1;
  if(acertou) p.acertos += 1;
  p.ultimoResultado = acertou;
  p.historico.push({ ts: Date.now(), c: acertou });
  if(p.historico.length > 20) p.historico = p.historico.slice(-20);
  bucket.perguntas[uid] = p;
  saveProgress();
}

function undoRegistro(materiaKey, uid){
  const bucket = getBucket(materiaKey);
  const p = bucket.perguntas[uid];
  if(!p || !p.historico || p.historico.length===0) return;
  const last = p.historico.pop();
  p.tentativas = Math.max(0, p.tentativas-1);
  if(last.c) p.acertos = Math.max(0, p.acertos-1);
  p.ultimoResultado = p.historico.length ? p.historico[p.historico.length-1].c : null;
  if(p.tentativas===0){ delete bucket.perguntas[uid]; } else { bucket.perguntas[uid] = p; }
  saveProgress();
}

function registrarFlash(materiaKey, uid, status){
  getBucket(materiaKey).flash[uid] = { status, ts: Date.now() };
  saveProgress();
}

function registrarSessao(materiaKey, total, acertos, tema, queue, respostas){
  const bucket = getBucket(materiaKey);
  // guarda queue/respostas (além de total/acertos) pra dar pra reabrir o simulado
  // depois a partir do histórico "Últimos simulados", não só dos salvos manualmente
  bucket.sessoes.push({ ts: Date.now(), total, acertos, tema: tema || 'todos', queue: queue||null, respostas: respostas||null });
  if(bucket.sessoes.length > 50) bucket.sessoes = bucket.sessoes.slice(-50);
  saveProgress();
}

function resetProgressoMateria(materiaKey){
  PROGRESS[materiaKey] = { perguntas:{}, flash:{}, sessoes:[] };
  saveProgress();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function pct(n,d){ return d ? Math.round((n/d)*100) : 0; }

function esc(str){
  // remove marcadores de citação tipo "[cite: 4]" ou "[cite: 4, 7]" que vêm do
  // material de origem — não fazem sentido pro usuário final da plataforma
  str = (str||'').replace(/\s*\[cite:\s*\d+(?:\s*,\s*\d+)*\]/gi, '');
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// confirma que existe uma sequência real de algarismos romanos (I...II ou II...III)
// antes de tratar qualquer "I"/"V"/"X" isolado como item de lista — sem essa
// checagem, palavras/iniciais comuns do texto poderiam ser quebradas por engano
function temListaRomana(texto){
  return /\bI\b[\s\S]{0,400}?\bII\b/.test(texto) || /\bII\b[\s\S]{0,400}?\bIII\b/.test(texto);
}
function quebrarItensRomanos(texto){
  if(!texto || !temListaRomana(texto)) return texto;
  // aceita tanto "I O princípio" (espaço direto) quanto "I. Configura-se" (com
  // ponto logo após o algarismo) — formatos diferentes de origem usam um ou outro
  return texto.replace(/\s*\b(I|II|III|IV|V|VI|VII|VIII|IX|X)\b(\.?)(?=\s+\w)/g, '\n$1$2');
}

// separa a frase de contexto/introdução (ex.: "Com base na LODF, julgue o
// próximo item.") da assertiva/item propriamente dita, colocando cada uma em
// um parágrafo visualmente distinto — sem isso as duas ficam grudadas num
// bloco só de texto corrido
function separarContextoDoItem(texto){
  if(!texto) return texto;
  // acha a frase de contexto completa (ex.: "julgue os itens seguintes, conforme
  // a Lei Maria da Penha.") e quebra só depois dela terminar de verdade — em vez
  // de quebrar logo após "julgue...item(ns)", que falhava quando havia uma
  // cláusula extra no meio (", conforme a Lei X") antes do ponto final real
  const m = texto.match(/julgue\s+(?:o\s+(?:próximo\s+)?item|a\s+assertiva|os\s+itens?)\b[\s\S]{0,80}?[.!?:]\s+/i);
  if(!m) return texto;
  const fim = m.index + m[0].length;
  return texto.slice(0, fim).trimEnd() + '\n\n' + texto.slice(fim);
}

function limparEnunciado(texto, tipo){
  if(!texto) return '';
  let out = texto
    .replace(/\n?\s*\(\s*\)\s*(Certo|Errado)?\s*$/gim, '')
    .replace(/(\n\s*\(\s*\)\s*)+$/g, '')
    .replace(/\s*(Certo\s+Errado|Errado\s+Certo)\s*$/i, '') // remove "Certo Errado" solto no fim, sem parênteses
    .replace(/^\d+[.)]\s*/, ''); // remove numeração inicial, ex.: "13) " ou "18. "
  // ordem importa: quebra os itens romanos primeiro; se separarContextoDoItem
  // rodasse antes, a quebra dupla de parágrafo que ele insere seria engolida
  // pelo \s* da regex de itens romanos (que colapsa qualquer espaço/quebra
  // anterior a "I"/"II"/etc. em uma quebra simples só)
  out = quebrarItensRomanos(out);
  out = separarContextoDoItem(out);
  if(tipo==='MC'){
    // remove a listagem de alternativas (a) ... b) ... c) ...) do corpo do enunciado —
    // ela já aparece separadamente, como botões clicáveis, logo abaixo; sem isso a
    // mesma informação apareceria duas vezes na tela
    const semAlternativas = out
      .replace(/\n\s*a\)\s[\s\S]*$/i, '')
      .replace(/\s(?=[a-e]\)\s)[\s\S]*$/i, '')
      .trimEnd();
    // só aplica a limpeza se ainda sobrar um enunciado com conteúdo de verdade —
    // evita deixar a caixa em branco quando a extração "come" o texto todo
    if(semAlternativas.length >= 10) out = semAlternativas;
  }
  return out.trimEnd();
}

const STOPWORDS_PT = new Set(['a','o','as','os','de','da','do','das','dos','e','ou','que','se','em','no','na','nos','nas','um','uma','uns','umas','ao','aos','à','às','para','por','com','sem','sob','sobre','entre','até','desde','como','mais','menos','muito','pouco','já','não','sim','ser','são','é','foi','ter','tem','têm','seu','sua','seus','suas','este','esta','isto','esse','essa','isso','aquele','aquela','aquilo','ele','ela','eles','elas','nós','vós','lhe','lhes','me','te','também','apenas','só','pelo','pela','pelos','pelas','deve','devem','pode','podem','assim','cujo','cuja']);

function extrairPalavrasSignificativas(texto){
  if(!texto) return [];
  const palavras = texto
    .toLowerCase()
    .replace(/[.,;:()"'“”]/g,' ')
    .split(/\s+/)
    .filter(w=>w.length>=5 && !STOPWORDS_PT.has(w));
  return Array.from(new Set(palavras)).slice(0,8);
}

// palavras-chave da resposta correta: pra múltipla escolha, vem do texto da
// alternativa certa; pra Certo/Errado não existe "alternativa" com texto próprio,
// então usamos os termos determinantes do próprio enunciado (é a assertiva que
// está sendo julgada certa ou errada)
function palavrasChaveDaRespostaCorreta(q){
  if(q.t==='MC'){
    if(!q.alt || !q.g) return [];
    const correta = q.alt.find(a=>a.letra.toUpperCase()===q.g.toUpperCase());
    if(!correta || !correta.texto) return [];
    return extrairPalavrasSignificativas(correta.texto);
  }
  if(q.t==='CE'){
    return extrairPalavrasSignificativas(q.q || '');
  }
  return [];
}

function destacarPalavrasChave(texto, palavrasExtras){
  if(!texto) return '';
  let html = esc(texto);
  // negrito só nas palavras-chave extraídas estritamente da resposta correta —
  // nada de padrão genérico (referência legal, conector modal etc.) que não vem
  // diretamente do gabarito da questão
  if(palavrasExtras && palavrasExtras.length){
    const ordenadas = [...palavrasExtras].sort((a,b)=>b.length-a.length);
    ordenadas.forEach(palavra=>{
      const escapada = palavra.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`\\b(${escapada}\\w*)\\b`, 'gi');
      html = html.replace(re, (m, offset) => /<[^>]*$/.test(html.slice(0, offset)) ? m : `<strong class="kw-gabarito">${m}</strong>`);
    });
  }
  return html;
}

// quebra um texto corrido em frases (nova sentença = novo parágrafo), evitando
// quebrar em abreviações jurídicas comuns (art., §, nº, inc., etc.) ou em siglas
function dividirEmFrases(texto){
  if(!texto) return [];
  const marcado = texto.replace(
    /\b(art|arts|inc|par|§|nº|n°|no|ed|op|cit|cf|vs|sr|sra|dr|dra|min|des|ex)\.\s/gi,
    m => m.replace('.', '\u0000')
  );
  const partes = marcado
    .split(/(?<=[.!?])\s+(?=[A-ZÀ-Ú"“(])|\n+/)
    .map(p => p.replace(/\u0000/g, '.').trim())
    .filter(Boolean);
  return partes.length ? partes : [texto.trim()];
}

// confirma que existe uma lista alfabética real (pelo menos "a)" e "b)") antes de
// tratar qualquer letra solta como item de lista — evita falso positivo em
// referências avulsas como "art. 5º, a)"
function temListaAlfabetica(texto){
  return /\ba\)/i.test(texto) && /\bb\)/i.test(texto);
}
// quebra de linha antes de cada item alfabético (a) b) c)...), inclusive o caso
// "c. e d)" (quando duas letras são combinadas numa análise só)
function quebrarItensAlfabeticos(texto){
  if(!texto || !temListaAlfabetica(texto)) return texto;
  return texto.replace(/\s*\b([a-e])(\)|\.\s*e\s*[a-e]\))/gi, '\n$1$2');
}

// combina a quebra em frases (item 5) com o destaque de palavras-chave (item 6):
// cada frase vira um parágrafo próprio, já com os termos relevantes marcados
function formatarTextoComDestaque(texto, palavrasExtras){
  if(!texto) return '';
  const comQuebras = quebrarItensAlfabeticos(texto);
  const frases = dividirEmFrases(comQuebras);
  return frases.map(f => `<p>${destacarPalavrasChave(f, palavrasExtras)}</p>`).join('');
}

// extrai banca/cargo de q.bc, aceitando dois formatos:
// 1) clássico "BANCA, cargo (órgão)" — usado no material embutido e no parser padrão
// 2) alternativo "cargo abrev (órgão)/ÓRGÃO/área/cargo completo/ano" — visto em
//    matérias importadas cujo texto de origem não usa vírgula; nesse caso o campo
//    logo após a primeira barra costuma ser a sigla do órgão/concurso, que é o que
//    dá pra usar como "banca" pra fins de filtro
function extrairBancaECargo(bc){
  if(!bc) return { banca:'—', cargo:'' };
  const txt = String(bc).trim();
  if(txt.indexOf(',') !== -1){
    const idx = txt.indexOf(',');
    return { banca: txt.slice(0, idx).trim() || '—', cargo: txt.slice(idx+1).trim() };
  }
  if(txt.indexOf('/') !== -1){
    const partes = txt.split('/').map(p=>p.trim()).filter(Boolean);
    const semAno = (partes.length>1 && /^\d{4}$/.test(partes[partes.length-1])) ? partes.slice(0,-1) : partes.slice();
    if(semAno.length===0) return { banca:'—', cargo:'' };
    const banca = semAno[1] || semAno[0] || '—';
    const cargo = semAno.length>2 ? semAno.slice(2).join(' — ') : (semAno[0] || '');
    return { banca, cargo };
  }
  return { banca: txt, cargo: '' };
}
function bancaCurta(bc){
  return extrairBancaECargo(bc).banca;
}
function cargoCurto(bc){
  return extrairBancaECargo(bc).cargo;
}
function tendenciaCurta(td){
  if(!td) return 'estável';

function questoesFiltradas(){

  return ALL_QUESTIONS.filter(q => q.materia===STATE.materia && (STATE.tema==='todos' || q.tema===STATE.tema) && !q.duplicataOculta);
}
// mesmo escopo de questoesFiltradas(), mas incluindo de volta qualquer questão
// que o usuário já tenha respondido alguma vez — mesmo que ela tenha sido
// marcada como duplicata depois. Usado só pra estatísticas/caderno de erros,
// pra não sumir com histórico de quem respondeu antes dessa checagem existir
function scopeUidsComHistorico(){
  if(!STATE.materia) return new Set();
  const bucket = getBucket(STATE.materia);
  const base = new Set(questoesFiltradas().map(q=>q.uid));
  Object.keys(bucket.perguntas).forEach(uid=>{
    const q = BY_UID[uid];
    if(q && q.materia===STATE.materia && (STATE.tema==='todos' || q.tema===STATE.tema)) base.add(uid);
  });
  return base;
}
function scoreableFiltradas(){
  return questoesFiltradas().filter(q => q.t==='CE' || q.t==='MC');
}

function computeSnapshot(){
  if(!STATE.materia) return { respondidas:0, tent:0, ac:0, taxa:0, erros:0, totalPontuavel:0 };
  const bucket = getBucket(STATE.materia);
  const scopeUids = scopeUidsComHistorico();
  const nums = Object.keys(bucket.perguntas).filter(u=>scopeUids.has(u));
  let tent=0, ac=0;
  nums.forEach(u=>{ tent += bucket.perguntas[u].tentativas; ac += bucket.perguntas[u].acertos; });
  const erros = getCadernoErros().length;
  return { respondidas: nums.length, tent, ac, taxa: pct(ac,tent), erros, totalPontuavel: scoreableFiltradas().length };
}

// mesma métrica de computeSnapshot, mas pra QUALQUER matéria (não só a atualmente
// selecionada) e sem filtro de assunto — usada pra mostrar "% geral | certo |
// errado | total" ao lado do nome de cada disciplina no menu
function computeSnapshotMateria(materiaKey){
  const bucket = getBucket(materiaKey);
  let tent=0, ac=0;
  Object.values(bucket.perguntas).forEach(p=>{ tent += p.tentativas; ac += p.acertos; });
  const totalPontuavel = ALL_QUESTIONS.filter(q=>q.materia===materiaKey && !q.duplicataOculta && (q.t==='CE'||q.t==='MC')).length;
  return { taxa: pct(ac,tent), ac, erradas: tent-ac, totalPontuavel };
}

// detecta questão inédita (gerada por IA, não pertence a nenhuma banca real) pelo

// extrai referências legais citadas num texto (artigos, súmulas, leis), pra
// identificar quais são os "temas centrais" mais recorrentes de cada assunto —
// item 2 do dashboard analítico. Normaliza pequenas variações de escrita
// ("art." / "artigo", "nº" / "n°") pra não contar a mesma referência 2x.
function extrairReferenciasLegais(texto){
  if(!texto) return [];
  const refs = [];
  let m;
  const reArt = /\bart(?:igo)?\.?\s*(\d+)[ºo°]?/gi;
  while((m = reArt.exec(texto))) refs.push('Art. ' + m[1]);
  const reSumula = /\bs[uú]mula\s*n?[ºo°]?\.?\s*(\d+)/gi;
  while((m = reSumula.exec(texto))) refs.push('Súmula ' + m[1]);
  const reLei = /\blei\s+(?:complementar\s+)?n[ºo°]?\.?\s*([\d./]+)/gi;
  while((m = reLei.exec(texto))) refs.push('Lei ' + m[1]);
  return refs;
}

// analisa todos os assuntos de uma matéria: pra cada um, levanta as referências
// legais mais citadas (item 2) e calcula um índice de "probabilidade de
// cobrança" combinando % de questões de alta incidência com % de questões em
// tendência de alta recente (item 3) — quanto maior, mais provável de cair de
// novo em provas futuras, segundo o histórico já registrado nessa matéria
// identifica se a questão veio de uma banca/prova real (tem q.bc com banca
// reconhecível) ou é uma questão inédita (sem banca real, "—" de fallback) —
// item 1: a análise por assunto do dashboard só deve considerar questões reais
function ehQuestaoDeBancaReal(q){
  if(isInedita(q)) return false;
  const b = bancaCurta(q.bc);
  return !!b && b !== '—';
}
function analisarTemasDaMateria(materiaKey){
  const temas = temasDisponiveis(materiaKey).filter(t => t && t!=='Fora do Edital');
  return temas.map(tema=>{
    const qs = ALL_QUESTIONS.filter(q => q.materia===materiaKey && q.tema===tema && !q.duplicataOculta && (q.t==='CE'||q.t==='MC') && ehQuestaoDeBancaReal(q));
    if(qs.length===0) return null;
    const refsMap = {};
    qs.forEach(q=>{
      // dedup por questão: se o mesmo artigo aparece no enunciado E na resolução
      // da mesma questão, conta como 1 só — o que importa é quantas QUESTÕES
      // diferentes citam aquela referência, não quantas vezes ela é mencionada
      const refsUnicas = new Set(extrairReferenciasLegais((q.q||'') + ' ' + (q.r||'')));
      refsUnicas.forEach(ref=>{ refsMap[ref] = (refsMap[ref]||0) + 1; });
    });
    const refsOrdenadas = Object.entries(refsMap).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const altaCount = qs.filter(q=>q.nv==='alta').length;
    const mediaCount = qs.filter(q=>q.nv==='media').length;
    const baixaCount = qs.filter(q=>q.nv==='baixa').length;
    const quenteCount = qs.filter(q=>tendenciaQuente(q)).length;
    const score = (altaCount/qs.length)*0.6 + (quenteCount/qs.length)*0.4;
    return { tema, total: qs.length, refsOrdenadas, altaCount, mediaCount, baixaCount, quenteCount, score };
  }).filter(Boolean).sort((a,b)=>b.score-a.score || b.total-a.total);
}

// dashboard analítico por matéria: mapeia os temas centrais mais recorrentes de
// cada assunto (item 2) e destaca os de maior probabilidade de cobrança futura
// (item 3) — pensado pra aparecer logo abaixo de "Configurar simulado"
function renderDashboardAnalitico(){
  if(!STATE.materia) return '';
  const analise = analisarTemasDaMateria(STATE.materia);
  if(analise.length===0) return '';
  const destaques = analise.filter(a=>a.score>0).slice(0,3);

  // desempenho (certas/erradas) por assunto, pra desenhar a barra verde/vermelha
  // na mesma linha do assunto — não filtra por banca real, reflete o desempenho
  // de fato nas tentativas do candidato, incluindo inéditas respondidas
  const bucket = getBucket(STATE.materia);
  const acertosPorTema = {};
  Object.entries(bucket.perguntas||{}).forEach(([uid,p])=>{
    const q = BY_UID[uid]; if(!q || q.materia!==STATE.materia) return;
    if(!acertosPorTema[q.tema]) acertosPorTema[q.tema]=[0,0];
    acertosPorTema[q.tema][0]+=p.acertos; acertosPorTema[q.tema][1]+=p.tentativas;
  });

  return `
  <div class="card-block dashboard-analitico" style="margin-top:24px;">
    <h3>📊 Análise por assunto</h3>
    <p style="font-size:12px;color:var(--ink-soft);margin-bottom:14px;">Levantamento automático a partir de questões reais de bancas (questões inéditas não entram nesta análise) — distribuição por nível de incidência e seu desempenho (acertos/erros) em cada assunto. Quanto maior o percentual, maior a probabilidade de cobrança em provas futuras.</p>
    ${destaques.length ? `<div class="tendencia-alerta">
      <b>⚠ Maior probabilidade de cobrança agora:</b> ${destaques.map(a=>esc(a.tema)).join(', ')} — assuntos com mais questões de alta incidência e tendência de alta recente.
    </div>` : ''}
    ${analise.map(a=>{
      const [ac,tt] = acertosPorTema[a.tema] || [0,0];
      const pctAcerto = tt ? Math.round((ac/tt)*100) : 0;
      const pctErro = tt ? 100-pctAcerto : 0;
      return `
      <div class="assunto-analise-row">
        <div class="assunto-analise-nome">${esc(a.tema)} <span class="cnt">(${a.total})</span></div>
        <div class="assunto-analise-incidencia" title="Distribuição por nível de incidência neste assunto: alta / média / baixa">
          ${a.altaCount ? `<span class="inc-badge inc-alta">★${a.altaCount} alta</span>` : ''}
          ${a.mediaCount ? `<span class="inc-badge inc-media">★${a.mediaCount} média</span>` : ''}
          ${a.baixaCount ? `<span class="inc-badge inc-baixa">★${a.baixaCount} baixa</span>` : ''}
        </div>
        <div class="assunto-analise-bar" title="${tt? `${ac} certas / ${tt-ac} erradas de ${tt} tentativas` : 'ainda não respondida'}">
          <div class="stacked-bar">
            ${tt ? `<div class="stacked-seg stacked-green" style="width:${pctAcerto}%;"></div><div class="stacked-seg stacked-red" style="width:${pctErro}%;"></div>` : `<div class="stacked-seg stacked-empty" style="width:100%;"></div>`}
          </div>
          <span class="stacked-pct">${tt ? `${pctAcerto}%` : '—'}</span>
        </div>
        <div class="assunto-analise-score" title="% de questões de alta incidência + tendência de alta recente neste assunto">${Math.round(a.score*100)}%</div>
      </div>
    `;}).join('')}
  </div>
  `;
}

function orgaoCargoDaMateria(){
  if(!STATE.materia) return null;
  const contagem = {};
  ALL_QUESTIONS.filter(q=>q.materia===STATE.materia).forEach(q=>{
    const cargo = cargoCurto(q.bc);
    if(cargo){
      const orgaoMatch = cargo.match(/\(([^)]+)\)\s*$/);
      const orgao = orgaoMatch ? orgaoMatch[1] : null;
      const chave = orgao || cargo;
      contagem[chave] = (contagem[chave]||0) + 1;
    }
  });
  const entradas = Object.entries(contagem).sort((a,b)=>b[1]-a[1]);
  return entradas.length ? entradas[0][0] : null;
}

/* ================= LANDING (simulado sem sessão ativa) ================= */
function renderLanding(){
  const s = computeSnapshot();
  const bucket = STATE.materia ? getBucket(STATE.materia) : { sessoes:[], perguntas:{} };
  const ultimaSessoes = bucket.sessoes.slice(-5).reverse();
  const qtdSimuladosGerados = bucket.sessoes.length;

  // desempenho por nível de incidência e por assunto (antiga aba "Estatísticas",
  // agora unificada aqui no painel principal do Simulado)
  const niveis = { alta:[0,0], media:[0,0], baixa:[0,0] };
  const byTema = {};
  Object.entries(bucket.perguntas||{}).forEach(([uid,p])=>{
    const q = BY_UID[uid]; if(!q || q.materia!==STATE.materia) return;
    if(STATE.tema!=='todos' && q.tema!==STATE.tema) return;
    if(niveis[q.nv]){ niveis[q.nv][0]+=p.acertos; niveis[q.nv][1]+=p.tentativas; }
    if(!byTema[q.tema]) byTema[q.tema]=[0,0];
    byTema[q.tema][0]+=p.acertos; byTema[q.tema][1]+=p.tentativas;
  });
  const temasDesempenho = temasDisponiveis(STATE.materia);

  if(STATE.materia && !STATE.quizzesVerificados.has(STATE.materia)){
    STATE.quizzesVerificados.add(STATE.materia);
    verificarQuizSalvo(STATE.materia);
  }
  const quizSalvo = STATE.quizzesEmAndamento[STATE.materia] && !STATE.quizzesEmAndamento[STATE.materia].finished
    ? STATE.quizzesEmAndamento[STATE.materia] : null;
  const continuarBloco = quizSalvo ? `<div class="landing-cta" style="border-color:var(--gold);">
    <b>Você tem um simulado salvo</b> nesta matéria — ${Object.keys(quizSalvo.respostas||{}).length} de ${quizSalvo.queue.length} questões <u>desta tentativa específica</u> já respondidas.
    <div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">(diferente do painel acima, que soma o histórico completo da matéria, incluindo outros simulados)</div>
    ${quizSalvo.ultimoSalvamento ? `<div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">💾 Salvamento automático às ${formatarDataHoraSalvamento(quizSalvo.ultimoSalvamento)}</div>` : ''}
    <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn btn-gold btn-sm" id="btn-continuar-simulado">▶ Continuar último salvo</button>
      <button class="btn-outline btn-sm" id="btn-iniciar-novo-simulado">🆕 Iniciar um novo</button>
    </div>
  </div>` : '';

  return `
  <div class="landing-hero">
    <div class="section-eyebrow">${esc(STATE.materia || '')} ${qtdSimuladosGerados>0 ? `<span class="sim-count-badge">${qtdSimuladosGerados} simulado(s) gerado(s)</span>` : ''}</div>
    <h2 class="section-title">${STATE.tema!=='todos' ? esc(STATE.tema) : 'Painel do candidato'}</h2>
    <p class="section-desc">Configure o nível de incidência e a quantidade de questões e clique em "Iniciar simulado" para começar.</p>
    <div class="big-stats">
      <div class="stat-card"><div class="num">${s.taxa}%</div><div class="lbl">Acerto geral</div></div>
      <div class="stat-card"><div class="num"><span class="n-certa">${s.ac}</span><span style="opacity:.45;">/</span><span class="n-errada">${s.tent-s.ac}</span><span style="opacity:.45;">/</span><span class="n-total">${s.totalPontuavel}</span></div><div class="lbl">Certas / erradas / total</div></div>
      <div class="stat-card"><div class="num">${s.erros}</div><div class="lbl">No caderno de erros</div></div>
    </div>
    ${continuarBloco}
    ${STATE.simuladoSalvoMsg ? `<div class="side-status ok" style="margin:10px 0 0;">✓ Simulado salvo! Veja em "Simulados salvos" logo abaixo.</div>` : ''}
    <button class="btn btn-primary" id="btn-abrir-config">⚙ Configurar simulado →</button>
  </div>
  ${renderDashboardAnalitico()}
  ${s.tent>0 ? `<div class="card-block" style="margin-top:22px;">
    <h3>Desempenho por nível de incidência</h3>
    ${['alta','media','baixa'].map(k=>barRow(NIVEL_STARS[k]+' '+NIVEL_LABEL[k], niveis[k][0], niveis[k][1])).join('')}

  ${s.tent>0 && temasDesempenho.length>1 ? `<div class="card-block" style="margin-top:22px;">
    <h3>Desempenho por assunto</h3>

  ${renderSimuladosSalvosBlock()}
  ${ultimaSessoes.length ? `<div class="card-block" style="margin-top:22px;">
    <h3>Últimos simulados nesta matéria</h3>
    ${ultimaSessoes.map(se=>{
      const d = new Date(se.ts);
      const dt = d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      const nome = dt + (se.tema && se.tema!=='todos' ? ` · ${se.tema}` : '');
      const podeAbrir = !!(se.queue && se.queue.length && se.respostas);
      const p = pct(se.acertos, se.total);
      const cor = p>=70 ? 'var(--stamp-green)' : p>=40 ? 'var(--gold)' : 'var(--stamp-red)';
      return `<div class="bar-row" style="flex-wrap:wrap;">
        <div class="name">${esc(nome)}</div>

        <button class="btn-outline" data-excluir-sessao="${se.ts}" style="padding:4px 10px;font-size:11px;">Excluir</button>
      </div>`;
    }).join('')}
  </div>` : ''}
  ${STATE.materia ? renderDangerZone() : ''}
  `;
}

function pool(){
  const setup = getSetup(STATE.materia);
  return scoreableFiltradas().filter(q =>
    setup.niveis.has(q.nv) &&
    !setup.anosExcluidos.has(String(q.ar||'')) &&
    !setup.bancasExcluidas.has(bancaCurta(q.bc)) &&
    !setup.cargosExcluidos.has(cargoCurto(q.bc)) &&
    !setup.tendenciasExcluidas.has(tendenciaCurta(q.td))
  );
}

function gerarImpressao(){
  const questoes = pool();
  if(questoes.length===0) return;
  const printArea = document.getElementById('print-area');
  const dataHoje = new Date().toLocaleDateString('pt-BR');
  const setup = getSetup(STATE.materia);
  const niveisTxt = Array.from(setup.niveis).map(k=>NIVEL_LABEL[k]).join(', ');
  const html = `
    <div class="print-header">
      <h2>${esc(CONFIG.title)} — ${esc(STATE.materia)}${STATE.tema!=='todos'?` · ${esc(STATE.tema)}`:''}</h2>
      <p>${questoes.length} questões · Nível de incidência: ${esc(niveisTxt)} · Gerado em ${dataHoje}</p>
    </div>
    ${questoes.map((q,i)=>`
      <div class="print-q">
        <h4>Questão ${i+1} (nº original ${q.n})</h4>
        <div class="print-tags">${esc(q.bc)} · ${NIVEL_STARS[q.nv]} · ${esc(q.td||'')}</div>
        <div class="print-enun">${esc(limparEnunciado(q.q, q.t))}</div>
        <div class="print-gab">Gabarito: ${esc(q.g||'—')}</div>
        <div class="print-res"><b>Resolução:</b> ${esc(q.r)}</div>
