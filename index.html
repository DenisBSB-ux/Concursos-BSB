function startQuiz(nums){
  const candidatos = nums ? nums.map(u=>BY_UID[u]).filter(Boolean) : pool();
  if(candidatos.length===0){
    const w = document.getElementById('setup-warn');
    if(w) w.textContent = 'Nenhuma questão encontrada com esses filtros. Ajuste a seleção.';
    return;
  }
  const setup = getSetup(STATE.materia);
  const qtd = nums ? candidatos.length : Math.min(setup.qtd, candidatos.length);
  // ordena pelas questões mais recentes primeiro (ano de aplicação, decrescente),
  // exceto quando é um conjunto específico (refazer erros), que mantém a ordem dada
  const ordenados = nums ? candidatos : [...candidatos].sort((a,b)=>(b.ar||0)-(a.ar||0));
  const queue = ordenados.slice(0, qtd).map(q=>q.uid);
  STATE.quiz = { queue, idx:0, respostas:{}, finished:false, materia: STATE.materia, tema: STATE.tema };
  STATE.setupDrawerOpen = false;
  STATE.mostrarConfigSimulado = false;
  STATE.simuladoSalvoMsg = false;
  STATE.quizzesEmAndamento[STATE.materia] = STATE.quiz;
  salvarQuizEmAndamento();
  render();
}

/* ================= QUIZ ================= */
function renderQuiz(){
  const quiz = STATE.quiz;
  if(quiz.finished) return renderResults();

  const uid = quiz.queue[quiz.idx];
  const q = BY_UID[uid];
  const resposta = quiz.respostas[uid];
  const revelado = !!resposta;

  const escLabel = ESCOPO_LABEL[q.es] || q.es;
  const escClass = ESCOPO_CLASS[q.es] || '';
  const nivLabel = NIVEL_STARS[q.nv] || '';
  const nivClass = 'tag-'+q.nv;

  let optionsHtml = '';
  const uidAtual = uid;
  const riscadas = (STATE.quiz.riscadas && STATE.quiz.riscadas[uidAtual]) || [];
  if(q.t === 'CE'){
    optionsHtml = `<div class="ce-buttons-row">` + ['Certo','Errado'].map(opt=>{
      let cls='answer-opt ce-btn ' + (opt==='Certo' ? 'ce-certo' : 'ce-errado');
      if(revelado){
        const isPicked = opt===resposta.picked;
        const isCorrect = opt===q.g;
        if(isPicked) cls+=' picked';
        if(isCorrect) cls+=' correct';
        else if(isPicked) cls+=' incorrect';

      if(riscadas.includes(opt)) cls+=' riscado';
      return `<button class="${cls}" data-opt="${opt}" ${revelado?'disabled':''} title="${opt} (2 cliques risca)">
        <span class="letter">${opt==='Certo'?'✓':'✗'}</span>
      </button>`;
    }).join('') + `</div>`;
  } else if(q.t==='MC' && q.alt){
    optionsHtml = q.alt.map(a=>{
      const letraUp = a.letra.toUpperCase();
      let cls='answer-opt';
      if(revelado){
        const isPicked = letraUp===resposta.picked;
        const isCorrect = letraUp===q.g;
        if(isPicked) cls+=' picked';
        if(isCorrect) cls+=' correct';
        else if(isPicked) cls+=' incorrect';
        else cls+=' nao-escolhida-errada';
      }
      if(riscadas.includes(letraUp)) cls+=' riscado';
      return `<button class="${cls}" data-opt="${letraUp}" ${revelado?'disabled':''} title="2 cliques risca esta alternativa">
        <span class="letter">${letraUp}</span> ${esc(a.texto)}

    optionsHtml = `<p style="font-size:13px;color:var(--ink-soft);padding:8px 0;">Questão sem gabarito identificado — não pontuável. Use as setas para navegar.</p>`;
  }

  if(STATE.focusMode){

    // botões de resposta, a justificativa depois de responder, setas de

          <span class="toolbar-divider"></span>
          <button class="icon-btn" id="btn-focus-toggle" title="Sair do modo foco">✕</button>
          <button class="theme-toggle-btn" id="btn-theme-toggle" title="Alternar modo claro/escuro" style="width:36px;height:36px;">${STATE.theme==='light'?'🌙':'☀️'}</button>
          ${renderZoomControl()}

      </div>

  const respondidas = Object.keys(quiz.respostas).length;

  const temaLinha = q.tema && q.tema!=='Geral' ? `<div class="q-tema-line">${esc(q.tema)}</div>` : '';
  const historicoUid = getBucket(quiz.materia).perguntas[uid];

      <div class="toolbar-btn-row">
        <button class="icon-btn" id="btn-prev" title="Questão anterior (seta ← ou Shift)" ${quiz.idx===0?'disabled':''}>←</button>
        <span class="q-jump-label">${quiz.idx+1} / ${quiz.queue.length}</span>
        <button class="icon-btn" id="btn-next-arrow" title="Próxima questão (seta → ou espaço)" ${quiz.idx===quiz.queue.length-1?'disabled':''}>→</button>
        <button class="icon-btn" id="btn-jump-ultima-respondida" title="Avançar para a última questão respondida" ${idxUltimaRespondida<0 || idxUltimaRespondida===quiz.idx?'disabled':''}>⏩</button>
        <button class="icon-btn" id="btn-jump-proximo-assunto" title="Ir para o próximo assunto" ${idxProximoAssunto<0?'disabled':''}>⏭</button>
        <span class="toolbar-divider"></span>
        <button class="icon-btn" id="btn-reset-questao" title="Limpar a resposta desta questão" ${revelado?'':'disabled'}>↺</button>
        <button class="icon-btn" id="btn-reset-simulado" title="Limpar todas as respostas deste simulado" ${respondidas===0?'disabled':''}>⟲</button>

    </button>

      ${quiz.queue.map((u,i)=>{

        if(r) cls += r.correct ? ' page-correct' : ' page-incorrect';
        if(i===quiz.idx) cls += ' page-current';

function renderResolucao(q, resposta, quiz){
  const correto = resposta.correct;
  const tintClass = correto ? 'tint-correct' : 'tint-incorrect';
  const feedbackClass = correto ? 'correct' : 'incorrect';
  const temProxima = quiz && quiz.idx < quiz.queue.length-1;
  const palavrasChave = palavrasChaveDaRespostaCorreta(q);
  return `
  <div class="answer-feedback ${feedbackClass}">${correto ? 'Você acertou' : 'Você errou'} — gabarito: ${esc(q.g)}</div>
  <div class="resolucao-box ${tintClass}">
    <span class="lbl">Resolução</span>
    ${formatarTextoComDestaque(q.r, palavrasChave)}
  </div>
  <div class="resumo-flash-box">
    <span class="lbl">Resumo flash</span>
    ${formatarTextoComDestaque(q.rf, palavrasChave)}
  </div>
  ${temProxima ? `<button class="btn btn-gold btn-sm" id="btn-proxima-rapida" style="margin-top:16px;width:100%;justify-content:center;">Próxima questão ⏩</button>` : ''}
  `;
}

function pickAnswer(opt){
  const quiz = STATE.quiz;
  if(!quiz) return; // clique atrasado (temporizador de duplo clique) após sair da sessão
  const uid = quiz.queue[quiz.idx];
  if(quiz.respostas[uid]) return;
  const q = BY_UID[uid];
  const correct = opt === q.g;
  quiz.respostas[uid] = { picked: opt, correct };
  registrarResposta(quiz.materia, uid, correct);
  salvarQuizEmAndamento();
  render();
}

function goPrev(){
  const quiz = STATE.quiz;
  if(quiz.idx>0){ quiz.idx -= 1; salvarQuizEmAndamento(); render(); }
}
function goNext(){
  const quiz = STATE.quiz;
  if(quiz.idx < quiz.queue.length-1){ quiz.idx += 1; salvarQuizEmAndamento(); render(); }
}
function goToQuestion(i){
  const quiz = STATE.quiz;
  if(i>=0 && i<quiz.queue.length){ quiz.idx = i; salvarQuizEmAndamento(); render(); }
}

// acha o índice, na fila atual, da última questão já respondida (percorrendo do
// início ao fim da fila — não é necessariamente a posição atual do cursor)
function acharIdxUltimaRespondida(quiz){
  let last = -1;
  quiz.queue.forEach((uid,i)=>{ if(quiz.respostas[uid]) last = i; });
  return last;
}
function irParaUltimaRespondida(){
  const quiz = STATE.quiz;
  const last = acharIdxUltimaRespondida(quiz);
  if(last>=0 && last!==quiz.idx) goToQuestion(last);
}
// acha o índice da primeira questão, a partir da posição atual, cujo assunto
// é diferente do assunto da questão atual (i.e. o começo do próximo assunto)
function acharIdxProximoAssunto(quiz){
  const atual = BY_UID[quiz.queue[quiz.idx]];
  const temaAtual = atual ? atual.tema : null;
  for(let i=quiz.idx+1; i<quiz.queue.length; i++){
    const q = BY_UID[quiz.queue[i]];
    if(q && q.tema !== temaAtual) return i;
  }
  return -1;
}
function irParaProximoAssunto(){
  const quiz = STATE.quiz;
  const alvo = acharIdxProximoAssunto(quiz);
  if(alvo>=0) goToQuestion(alvo);
}

function toggleRiscarAlternativa(opt){
  const quiz = STATE.quiz;
  const uid = quiz.queue[quiz.idx];
  if(!quiz.riscadas) quiz.riscadas = {};
  if(!quiz.riscadas[uid]) quiz.riscadas[uid] = [];
  const idx = quiz.riscadas[uid].indexOf(opt);
  if(idx>=0) quiz.riscadas[uid].splice(idx,1);
  else quiz.riscadas[uid].push(opt);
  salvarQuizEmAndamento();
  render();
}

function resetQuestaoAtual(){
  const quiz = STATE.quiz;
  const uid = quiz.queue[quiz.idx];
  if(!quiz.respostas[uid]) return;
  undoRegistro(quiz.materia, uid);
  delete quiz.respostas[uid];
  salvarQuizEmAndamento();
  render();
}

function resetSimuladoAtual(){
  const quiz = STATE.quiz;
  Object.keys(quiz.respostas).forEach(uid => undoRegistro(quiz.materia, uid));
  quiz.respostas = {};
  quiz.idx = 0;
  salvarQuizEmAndamento();
  render();
}

function abandonarQuiz(){
  STATE.quiz = null;
  STATE.focusMode = false;
  render();
}

function finalizarQuiz(){
  const quiz = STATE.quiz;
  quiz.finished = true;
  const total = quiz.queue.length;
  const acertos = Object.values(quiz.respostas).filter(r=>r.correct).length;
  registrarSessao(quiz.materia, total, acertos, quiz.tema, quiz.queue, quiz.respostas);
  limparQuizSalvo(quiz.materia);
  STATE.simuladoSalvoMsg = false;
  render();
}

function salvarSimuladoParaComparacao(quizAlvo){
  const quiz = quizAlvo || STATE.quiz;
  if(!quiz) return;
  const bucket = getBucket(quiz.materia);
  if(!bucket.simuladosSalvos) bucket.simuladosSalvos = [];
  const acertos = Object.values(quiz.respostas).filter(r=>r.correct).length;
  bucket.simuladosSalvos.push({
    ts: Date.now(),
    queue: quiz.queue,
    respostas: quiz.respostas,
    tema: quiz.tema,
    total: quiz.queue.length,
    acertos,
  });
  if(bucket.simuladosSalvos.length>20) bucket.simuladosSalvos = bucket.simuladosSalvos.slice(-20);
  saveProgress();
  STATE.simuladoSalvoMsg = true;
  render();
}

/* ---- ações sobre o histórico "Últimos simulados nesta matéria" (bucket.sessoes) ---- */
function abrirSessaoHistorico(ts){
  const bucket = getBucket(STATE.materia);
  const se = (bucket.sessoes||[]).find(s=>s.ts===ts);
  if(!se || !se.queue || !se.queue.length) return;
  STATE.quiz = { queue: se.queue, idx:0, respostas: se.respostas||{}, finished:true, materia: STATE.materia, tema: se.tema, reaberto:true };
  render();
}
function salvarSessaoHistoricoParaComparacao(ts){
  const bucket = getBucket(STATE.materia);
  const se = (bucket.sessoes||[]).find(s=>s.ts===ts);
  if(!se || !se.queue || !se.queue.length) return;
  salvarSimuladoParaComparacao({ materia: STATE.materia, queue: se.queue, respostas: se.respostas||{}, tema: se.tema });
}
function excluirSessaoHistorico(ts){
  const bucket = getBucket(STATE.materia);
  bucket.sessoes = (bucket.sessoes||[]).filter(s=>s.ts!==ts);
  saveProgress();
  render();
}

/* ================= ESTATÍSTICAS ================= */
function renderStats(){
  const s = computeSnapshot();
  if(s.tent===0){
    return emptyState('📋','Nenhum dado ainda',`Responda seu primeiro simulado em "${esc(STATE.materia||'')}" para começar a acompanhar acertos, cobertura e evolução por nível de incidência.`) + renderDangerZone();
  }

  const bucket = getBucket(STATE.materia);
  const niveis = { alta:[0,0], media:[0,0], baixa:[0,0] };
  const byTema = {};
  Object.entries(bucket.perguntas).forEach(([uid,p])=>{
    const q = BY_UID[uid]; if(!q || q.materia!==STATE.materia) return;
    if(STATE.tema!=='todos' && q.tema!==STATE.tema) return;
    if(niveis[q.nv]){ niveis[q.nv][0]+=p.acertos; niveis[q.nv][1]+=p.tentativas; }
    if(!byTema[q.tema]) byTema[q.tema]=[0,0];
    byTema[q.tema][0]+=p.acertos; byTema[q.tema][1]+=p.tentativas;
  });

  const ultimaSessoes = bucket.sessoes.slice(-8).reverse();
  const temas = temasDisponiveis(STATE.materia);

  return `
  <div class="section-eyebrow">${esc(STATE.materia)}</div>
  <h2 class="section-title">Estatísticas de desempenho</h2>
  <p class="section-desc">Acompanhamento consolidado desta matéria${STATE.tema!=='todos'?`, assunto <b>${esc(STATE.tema)}</b>`:''}.</p>

  <div class="stat-grid">
    <div class="stat-card"><div class="num">${s.taxa}%</div><div class="lbl">Acerto geral</div></div>
    <div class="stat-card"><div class="num"><span class="n-certa">${s.ac}</span><span style="opacity:.45;">/</span><span class="n-errada">${s.tent-s.ac}</span><span style="opacity:.45;">/</span><span class="n-total">${s.totalPontuavel}</span></div><div class="lbl">Certas / erradas / total</div></div>
    <div class="stat-card"><div class="num">${s.erros}</div><div class="lbl">No caderno de erros</div></div>
  </div>

  <div class="card-block">
    <h3>Desempenho por nível de incidência</h3>
    ${['alta','media','baixa'].map(k=>barRow(NIVEL_STARS[k]+' '+NIVEL_LABEL[k], niveis[k][0], niveis[k][1])).join('')}
  </div>

  ${temas.length>1 ? `<div class="card-block">
    <h3>Desempenho por assunto</h3>
    ${temas.map(t=>barRow(t, (byTema[t]||[0,0])[0], (byTema[t]||[0,0])[1])).join('')}
  </div>` : ''}

  ${ultimaSessoes.length ? `<div class="card-block">
    <h3>Últimos simulados</h3>
    ${ultimaSessoes.map(se=>{
      const d = new Date(se.ts);
      const dt = d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      return barRow(dt + (se.tema && se.tema!=='todos' ? ` · ${se.tema}` : ''), se.acertos, se.total);
    }).join('')}
  </div>` : ''}

  ${renderDangerZone()}
  `;
}

function renderDangerZone(){
  return `<div class="card-block" style="border-color:#eabdb6;">
    <h3 style="color:var(--stamp-red);">Zona de risco — ${esc(STATE.materia||'')}</h3>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;">Apaga o histórico de tentativas, o caderno de erros e as marcações de flashcards apenas desta matéria. As demais matérias não são afetadas.</p>
    <button class="btn-danger" id="btn-reset-materia">Resetar progresso desta matéria</button>

}

function barRow(name, a, t){
  const p = pct(a,t);
  const color = p>=70 ? 'var(--stamp-green)' : p>=40 ? 'var(--gold)' : 'var(--stamp-red)';
  return `<div class="bar-row">
    <div class="name">${esc(name)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${t? p:0}%;background:${color};"></div></div>
    <div class="pct">${t? `${p}% (${a}/${t})` : '—'}</div>
  </div>`;
}

/* ================= CADERNO DE ERROS ================= */
function getCadernoErros(){
  if(!STATE.materia) return [];
  const bucket = getBucket(STATE.materia);
  const scopeUids = scopeUidsComHistorico();
  return Object.entries(bucket.perguntas)
    .filter(([uid,p]) => p.ultimoResultado === false && scopeUids.has(uid))
    .map(([uid,p]) => ({ uid, p }))
    .sort((a,b)=> (b.p.historico[b.p.historico.length-1] ? b.p.historico[b.p.historico.length-1].ts : 0) - (a.p.historico[a.p.historico.length-1] ? a.p.historico[a.p.historico.length-1].ts : 0));
}

function renderErros(){
  const lista = getCadernoErros();
  if(lista.length===0){

  }
  return `

  <h2 class="section-title">Caderno de erros</h2>
  <p class="section-desc">${lista.length} questão(ões) com o último resultado registrado como erro${STATE.tema!=='todos'?` no assunto ${esc(STATE.tema)}`:''}. Refaça-as para atualizar o status.</p>

/* ================= RESUMO PARA REVISÃO DE VÉSPERA ================= */
// pega o resumo flash de todas as questões atualmente erradas (mesma base do
// caderno de erros) e organiza por assunto — pensado pra revisar rapidinho no
// dia anterior à prova, sem precisar refazer questão por questão
// item 6: gera um .txt de texto plano com o resumo flash de tudo que está no
// caderno de erros, agrupado por assunto — pra levar consigo e revisar offline
// gera um Markdown com todas as questões de uma matéria, no mesmo formato que
// parseMarkdownQuestoes sabe ler de volta — permite baixar, editar num editor
// de texto/Markdown qualquer e reimportar depois (item 2 e 3)
function gerarMarkdownDaMateria(materiaKey){
  const qs = ALL_QUESTIONS.filter(q => q.materia===materiaKey && !q.duplicataOculta).sort((a,b)=>a.n-b.n);
  let md = `# ${materiaKey}\n\n`;
  qs.forEach(q=>{
    md += `## QUESTÃO ${q.n}\n\n`;
    md += `**Banca/Cargo:** ${q.bc||'—'}\n`;
    md += `**Ano:** ${q.ar||'—'} | **Nível:** ${NIVEL_LABEL[q.nv]||'Média'} | **Tendência:** ${tendenciaCurta(q.td)}\n`;
    md += `**Assunto:** ${q.tema||'Geral'}\n\n`;
    md += `### Enunciado\n${q.q||''}\n\n`;
    if(q.t==='MC' && q.alt){
      md += `### Alternativas\n`;
      q.alt.forEach(a=>{ md += `- **${a.letra.toUpperCase()})** ${a.texto}\n`; });
      md += `\n**Gabarito:** ${q.g}\n\n`;
    } else {
      md += `**Gabarito:** ${q.g}\n\n`;
    }
    md += `### Resolução\n${q.r||''}\n\n`;
    md += `### Resumo Flash\n${q.rf||''}\n\n`;
    md += `---\n\n`;
  });
  return md;
}
function downloadListaQuestoes(materiaKey){
  if(!materiaKey) return;
  const md = gerarMarkdownDaMateria(materiaKey);
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dataStr = new Date().toISOString().slice(0,10);
  const nomeArquivo = materiaKey.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-');
  a.href = url;
  a.download = `questoes-${nomeArquivo}-${dataStr}.md`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadResumoRevisao(){
  const lista = getCadernoErros();
  if(lista.length===0) return;
  const porTema = {};
  lista.forEach(({uid})=>{
    const q = BY_UID[uid];
    if(!q) return;
    const tema = (q.tema && q.tema!=='Geral') ? q.tema : 'Geral';
    if(!porTema[tema]) porTema[tema] = [];
    porTema[tema].push(q);
  });
  const temasOrdenados = Object.keys(porTema).sort((a,b)=>a.localeCompare(b,'pt-BR'));
  let texto = `RESUMO PARA REVISÃO DE VÉSPERA — ${STATE.materia}\n`;
  texto += `Gerado em ${new Date().toLocaleDateString('pt-BR')} · ${lista.length} ponto(s) de atenção\n`;
  texto += '='.repeat(60) + '\n\n';
  temasOrdenados.forEach(tema=>{
    texto += `${tema.toUpperCase()} (${porTema[tema].length})\n`;
    texto += '-'.repeat(40) + '\n';
    porTema[tema].sort((a,b)=>a.n-b.n).forEach(q=>{
      texto += `${String(q.n).padStart(3,'0')}. ${(q.rf||'').replace(/\s+/g,' ').trim()}\n\n`;
    });
    texto += '\n';
  });
  const blob = new Blob([texto], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dataStr = new Date().toISOString().slice(0,10);
  const nomeArquivo = (STATE.materia||'materia').toLowerCase().replace(/[^a-z0-9]+/g,'-');
  a.href = url;
  a.download = `resumo-revisao-${nomeArquivo}-${dataStr}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  if(lista.length===0){

// true se existe um simulado salvo com progresso real nesta matéria que seria
// perdido ao iniciar uma nova sessão agora — usado pra confirmar com o usuário
// antes de qualquer fluxo que crie um STATE.quiz novo (iniciar, refazer erros etc.)
function avisarSeForPerderProgresso(){
  const salvo = STATE.quizzesEmAndamento[STATE.materia];
  const temProgresso = salvo && !salvo.finished && Object.keys(salvo.respostas||{}).length>0 && salvo!==STATE.quiz;
  if(!temProgresso) return true;
  const qtdRespondidas = Object.keys(salvo.respostas).length;
  return window.confirm(`Você tem um simulado salvo nesta matéria com ${qtdRespondidas} de ${salvo.queue.length} questões já respondidas nesta tentativa específica. Continuar agora vai substituir esse progresso salvo assim que você responder algo aqui — o histórico de acertos/erros já registrado continua contando normalmente nas suas estatísticas, só a opção de "continuar de onde parou" nessa fila específica é perdida. Deseja continuar mesmo assim?`);
}
function refazerQuestao(uid){
  if(!avisarSeForPerderProgresso()) return;
  setLocalTab(STATE.materia, 'simulado');
  STATE.quiz = { queue:[uid], idx:0, respostas:{}, finished:false, materia: STATE.materia, tema: STATE.tema };
  render();
}

function refazerTodasErros(){
  const uids = getCadernoErros().map(e=>e.uid);
  if(uids.length===0) return;
  if(!avisarSeForPerderProgresso()) return;
  setLocalTab(STATE.materia, 'simulado');
  STATE.quiz = { queue: shuffle(uids), idx:0, respostas:{}, finished:false, materia: STATE.materia, tema: STATE.tema };
  render();
}

/* ================= FLASHCARDS ================= */
function gabaritoDestacado(g){
  if(!g) return '—';
  if(g==='Certo') return `<span class="gab-destaque gab-certo">Certo</span>`;
  if(g==='Errado') return `<span class="gab-destaque gab-errado">Errado</span>`;
  return `<span class="gab-destaque gab-letra">${esc(g)}</span>`;
}

  if(!STATE.flashDeck){

    const naoVistas = escopoQ.filter(q=>!bucket.flash[q.uid]).length;

}

let selectedDeck = 'todas';
function startFlashDeck(){
  const escopoQ = questoesFiltradas();
  const bucket = getBucket(STATE.materia);
  let uids;
  if(selectedDeck==='revisar'){
    uids = escopoQ.filter(q=>bucket.flash[q.uid] && bucket.flash[q.uid].status==='revisar').map(q=>q.uid);
  } else if(selectedDeck==='novas'){
    uids = escopoQ.filter(q=>!bucket.flash[q.uid]).map(q=>q.uid);
  } else if(selectedDeck==='erradas'){
    uids = escopoQ.filter(q=>bucket.perguntas[q.uid] && bucket.perguntas[q.uid].ultimoResultado===false).map(q=>q.uid);
  } else {
    uids = escopoQ.map(q=>q.uid);
  }
  if(uids.length===0) uids = escopoQ.map(q=>q.uid);
  STATE.flashDeck = { uids: shuffle(uids), idx:0, flipped:false, materia: STATE.materia };
  render();
}

function flashGoPrev(){
  const deck = STATE.flashDeck;
  if(deck.idx>0){ deck.idx-=1; deck.flipped=false; render(); }
}
function flashGoNext(){
  const deck = STATE.flashDeck;
  if(deck.idx < deck.uids.length-1){ deck.idx+=1; deck.flipped=false; render(); }
  else { STATE.flashDeck = null; render(); }
}

/* --- parser de txt --- */
function lineField(re, text){
  const m = text.match(re);
  return m ? m[1].trim() : null;
}
function blockField(name, text){
  const re = new RegExp('\\['+name+'\\]:\\s*\\n?([\\s\\S]*?)(?=\\n\\[[A-ZÀÁÂÃÉÍÓÔÕÚa-zçã ]+\\]:|$)', 'i');
  const m = text.match(re);
  return m ? m[1].trim() : null;
}

// campo de bloco no formato Markdown (### Rótulo\nconteúdo), até o próximo ###,
// --- (separador de questão) ou um campo em negrito (**Rótulo:**)
function blockFieldMd(name, text){
  const re = new RegExp('###\\s*'+name+'\\s*\\n([\\s\\S]*?)(?=\\n###\\s|\\n---|\\n\\*\\*|$)', 'i');
  const m = text.match(re);
  return m ? m[1].trim() : null;
}

// parser do formato Markdown gerado pelo botão de download da própria
// plataforma ("⬇ Baixar lista de questões") — permite reimportar depois de
// editar manualmente num editor de texto/Markdown qualquer
function parseMarkdownQuestoes(content){
  const results = [];
  let ignoradas = 0;
  let semGabarito = 0;
  const blocos = content.split(/\n(?=##\s*QUEST[ÃA]O\s+\d+)/i).filter(b => /##\s*QUEST[ÃA]O\s+\d+/i.test(b));
  blocos.forEach(bloco=>{
    const numMatch = bloco.match(/##\s*QUEST[ÃA]O\s+(\d+)/i);
    if(!numMatch){ ignoradas++; return; }
    const n = parseInt(numMatch[1], 10);
    const bancaCargoMatch = bloco.match(/\*\*Banca\/Cargo:\*\*\s*(.+)/i);
    const bancaCargoTxt = bancaCargoMatch ? bancaCargoMatch[1].trim() : '';
    const anoMatch = bloco.match(/\*\*Ano:\*\*\s*(\d{4})/i);
    const ano = anoMatch ? parseInt(anoMatch[1], 10) : null;
    const nivelMatch = bloco.match(/\*\*N[ií]vel:\*\*\s*(\w+)/i);
    const nivelTxt = nivelMatch ? nivelMatch[1].trim().toLowerCase() : '';
    const nivel = nivelTxt.includes('alta') ? 'alta' : (nivelTxt.includes('baixa') ? 'baixa' : 'media');
    const tendMatch = bloco.match(/\*\*Tend[êe]ncia:\*\*\s*(\w+)/i);
    const tendTxt = tendMatch ? tendMatch[1].trim().toLowerCase() : '';
    const tendencia = tendTxt.includes('cresc') ? '↑ Crescente' : (tendTxt.includes('decresc') ? '↓ Decrescente' : '→ Estável');
    const assuntoMatch = bloco.match(/\*\*Assunto:\*\*\s*(.+)/i);
    const assunto = assuntoMatch ? assuntoMatch[1].trim() : null;

    const enunciado = blockFieldMd('Enunciado', bloco);
    const resolucao = blockFieldMd('Resolu[çc][ãa]o', bloco);
    const resumo = blockFieldMd('Resumo Flash', bloco);

    const altMatches = [...bloco.matchAll(/-\s*\*\*([A-E])\)\*\*\s*(.+)/gi)];
    const alternativas = altMatches.length ? altMatches.map(m => ({ letra: m[1], texto: m[2].trim() })) : null;

    const gabaritoMatch = bloco.match(/\*\*Gabarito:\*\*\s*([^\n]+)/i);
    let gabarito = gabaritoMatch ? gabaritoMatch[1].trim() : null;

    if(!enunciado){ ignoradas++; return; }
    if(!gabarito) semGabarito++;

    const tipo = alternativas ? 'MC' : 'CE';
    if(gabarito){
      if(tipo==='CE'){
        gabarito = /certo/i.test(gabarito) ? 'Certo' : (/errado/i.test(gabarito) ? 'Errado' : gabarito);
      } else {
        const letraMatch = gabarito.match(/[A-E]/i);
        gabarito = letraMatch ? letraMatch[0].toUpperCase() : gabarito;
      }
    }

    results.push({
      n, bc: bancaCargoTxt || '—', es: 'literal', ft: '', nv: nivel, td: tendencia, fr: '',
      q: enunciado, t: tipo, alt: alternativas, g: gabarito, r: resolucao || '', rf: resumo || '',
      ar: ano, tema: assunto,
    });
  });
  return { results, ignoradas, semGabarito };
}

function extractGabarito(blockText, resolucaoText){
  const campoGabarito = blockField('Gabarito', blockText);
  const candidatos = [campoGabarito, resolucaoText, blockText].filter(Boolean);

  for(const hay of candidatos){
    let m = hay.match(/gabarito\s*(?:é|foi|:|-|–|—|=)?\s*(certo|errado)/i);
    if(m) return m[1].toLowerCase()==='certo' ? 'Certo' : 'Errado';
    m = hay.match(/resposta correta\s*(?:é|foi|:|-|–|—|=)?\s*(certo|errado)/i);
    if(m) return m[1].toLowerCase()==='certo' ? 'Certo' : 'Errado';
    m = hay.match(/(?:item|assertiva|afirmativa)\s+est[áa]\s+(certo|errado)/i);
    if(m) return m[1].toLowerCase()==='certo' ? 'Certo' : 'Errado';

    m = hay.match(/gabarito\s*(?:é|foi|:|-|–|—|=)?\s*(?:a\s+)?(?:letra\s*)?\(?([a-e])\)?\b/i);
    if(m) return m[1].toUpperCase();
    m = hay.match(/resposta correta\s*(?:é|foi|:|-|–|—|=)?\s*(?:a\s+)?(?:letra\s*)?\(?([a-e])\)?\b/i);
    if(m) return m[1].toUpperCase();
    m = hay.match(/alternativa correta\s*(?:é|foi|:|-|–|—|=)?\s*(?:a\s+)?(?:letra\s*)?\(?([a-e])\)?\b/i);
    if(m) return m[1].toUpperCase();
  }
  if(campoGabarito){
    const c = campoGabarito.trim();
    if(/^certo$/i.test(c)) return 'Certo';
    if(/^errado$/i.test(c)) return 'Errado';
    if(/^[a-e]$/i.test(c)) return c.toUpperCase();
  }
  return null;
}

function detectaFormatoGemini(content){
  return /QUEST[ÃA]O\s+\d+[^\n\[]{0,60}\[Tend[êe]ncia/i.test(content) || /Probabilidade Preditiva/i.test(content);
}
// formato Markdown gerado pelo próprio botão de download da plataforma — usa
// cabeçalho "# QUESTÃO N" (com #), diferente dos outros dois formatos que nunca
// usam # antes de "QUESTÃO"
function detectaFormatoMarkdown(content){
  return /^#{1,2}\s*QUEST[ÃA]O\s+\d+/im.test(content);
}

function valorAposLabelEmLinhas(linhas, labelRegex){
  for(let i=0;i<linhas.length;i++){
    if(labelRegex.test(linhas[i])){
      for(let j=i+1;j<linhas.length;j++){
        const v = linhas[j].trim();
        if(v) return v;
      }
    }
  }
  return null;
}

// Parser pro formato de saída gerado por assistentes de IA (Gemini/etc.) — usa uma
// "tabela de métricas" e rótulos [Enunciado]/[Resolução]/[Resumo Flash], mas sem os
// campos [Status]/[Escopo]/[Fonte] do formato original, e ignora todo o texto que não
// seja diretamente sobre as questões (cabeçalhos de prompt, blocos de auditoria etc.)
function parseTxtQuestoesFormatoGemini(content){
  const results = [];
  let ignoradas = 0;
  let semGabarito = 0;

  // detecta TODAS as trocas de "TEMA/ASSUNTO:" ao longo do texto colado, não só
  // a primeira — permite colar um arquivo inteiro com vários blocos de assuntos
  // diferentes em sequência, sem precisar recortar e colar um tema de cada vez.
  // Cada questão recebe o tema mais recente declarado antes dela no texto.
  const marcadoresTema = [...content.matchAll(/TEMA\/ASSUNTO:\s*([^\n]+)/gi)].map(m => ({
    pos: m.index,
    tema: m[1].trim().replace(/\s*\([^)]*\)\s*$/, '').trim(),
  }));
  function temaVigenteEm(pos){
    let atual = null;
    for(const marcador of marcadoresTema){
      if(marcador.pos <= pos) atual = marcador.tema;
      else break;
    }
    return atual;
  }

  // localiza a posição de início de cada bloco "QUESTÃO N [...]" no texto
  // ORIGINAL (não depois de já ter cortado em pedaços), pra poder casar cada
  // questão com o tema vigente naquele ponto específico do texto.
  // Tolerante a texto decorativo entre o número e o colchete (ex.: marcador
  // "🟥🟨 INÉDITA 🟨🟥") — sem isso, questões inéditas eram engolidas pela
  // questão anterior por não baterem com \s*\[ (só espaço em branco).
  const iniciosBloco = [...content.matchAll(/QUEST[ÃA]O\s+\d+[^\n\[]{0,60}\[/gi)].map(m => m.index);
  const blocos = iniciosBloco.map((pos, i) => ({
    pos,
    texto: content.slice(pos, iniciosBloco[i+1] ?? content.length),
  }));

  blocos.forEach(({ pos, texto: bloco })=>{
    const numMatch = bloco.match(/QUEST[ÃA]O\s+(\d+)/i);
    if(!numMatch){ ignoradas++; return; }
    const n = parseInt(numMatch[1], 10);
    const temaDaQuestao = temaVigenteEm(pos);

    const linhas = bloco.split('\n').map(l=>l.trim());
    const probPreditiva = valorAposLabelEmLinhas(linhas, /^Probabilidade Preditiva$/i);
    const tendenciaTxt = valorAposLabelEmLinhas(linhas, /^Tend[êe]ncia temporal$/i);
    const nivelTxt = valorAposLabelEmLinhas(linhas, /^N[íi]vel de incid[êe]ncia$/i);
    const freqTxt = valorAposLabelEmLinhas(linhas, /^Frequ[êe]ncia por banca e ano$/i);
    const bancaCargoTxt = lineField(/Banca,\s*cargo:\s*(.+)/i, bloco);

    let enunciado = blockField('Enunciado', bloco);
    const resolucao = blockField('Resolu[çc][ãa]o', bloco);
    const resumo = blockField('Resumo Flash', bloco);

    if(!enunciado || !resolucao){ ignoradas++; return; }

    const gabarito = extractGabarito(bloco, resolucao);
    let tipo = (gabarito==='Certo'||gabarito==='Errado') ? 'CE' : (gabarito ? 'MC' : 'sem_gabarito');
    if(tipo==='sem_gabarito') semGabarito++;

    enunciado = enunciado.replace(/\(\s*\)\s*Certo\s*\(\s*\)\s*Errado\s*$/i,'').trim();

    let alternativas = null;
    if(tipo==='MC'){
      // nesse formato as alternativas costumam vir coladas no mesmo parágrafo, sem
      // quebra de linha entre elas ("...desde a a) posse... b) expedição...")
      const partes = enunciado.split(/\s(?=[a-e]\)\s)/i);
      if(partes.length>1){
        const corpoCandidato = partes[0].trim();
        const altsCandidatas = partes.slice(1).map(p=>{
          const m = p.match(/^([a-e])\)\s*([\s\S]+)$/i);
          return m ? { letra:m[1].toLowerCase(), texto:m[2].trim() } : null;
        }).filter(Boolean);
        // só substitui o enunciado se ainda sobrar um corpo com conteúdo de verdade —
        // evita deixar a questão sem nenhum texto de contexto
        if(corpoCandidato.length >= 5){
          enunciado = corpoCandidato;
          alternativas = altsCandidatas;
        }
      }
    }

    // remove numeração inicial do enunciado (ex.: "18. " ou "18) ")
    enunciado = enunciado.replace(/^\d+[.)]\s*/, '');

    let nivel = 'media';
    if(nivelTxt){
      if(/baixa/i.test(nivelTxt)) nivel='baixa';
      else if(/alta/i.test(nivelTxt)) nivel='alta';
    }

    let tendenciaSeta = '→ Estável';
    if(tendenciaTxt){
      if(/crescente/i.test(tendenciaTxt)) tendenciaSeta = '↑ Crescente';
      else if(/decrescente|queda/i.test(tendenciaTxt)) tendenciaSeta = '↓ Decrescente';
    }

    let ar = null;
    const anoMatch = (bancaCargoTxt||'').match(/(\d{4})\s*$/);
    if(anoMatch) ar = parseInt(anoMatch[1],10);
    const anosFreq = (freqTxt||'').match(/20\d{2}/g);
    const anosNum = anosFreq ? Array.from(new Set(anosFreq.map(Number))) : (ar?[ar]:[]);

    results.push({
      n, bc: bancaCargoTxt||'—', es:'literal', ft:'', nv:nivel, td:tendenciaSeta, fr:freqTxt||'',
      an:anosNum, ar: ar || (anosNum.length?Math.max(...anosNum):null),
      q:enunciado, r:resolucao, rf:resumo||'', g:gabarito, t:tipo,
      alt: alternativas, pp: probPreditiva||null, tema: temaDaQuestao||null,
    });
  });

  return { results, ignoradas, semGabarito };
}

function parseTxtQuestions(content){
  if(detectaFormatoMarkdown(content)){
    return parseMarkdownQuestoes(content);
  }
  if(detectaFormatoGemini(content)){
    return parseTxtQuestoesFormatoGemini(content);
  }
  const blocks = content.split(/={10,}/).filter(b => /QUEST[ÃA]O\s+\d+/.test(b));
  const results = [];
  let ignoradas = 0;
  let semGabarito = 0;

  blocks.forEach(b=>{
    const numStr = lineField(/QUEST[ÃA]O\s+(\d+)/, b);
    if(!numStr) { ignoradas++; return; }
    const num = parseInt(numStr,10);
    const banca = lineField(/Banca,\s*cargo:\s*(.+)/, b);
    const status = lineField(/\[Status\]:\s*(.+)/, b);
    const escopoRaw = lineField(/\[Escopo\]:\s*(.+)/, b);
    const fonte = lineField(/\[Fonte\]:\s*(.+)/, b);
    const freq = lineField(/Frequ[êe]ncia hist[óo]rica\s*\|\s*(.+?)\s*\|/, b);
    const nivelRaw = lineField(/N[íi]vel de incid[êe]ncia\s*\|\s*(.+?)\s*\|/, b);
    const tendencia = lineField(/Tend[êe]ncia\s*\|\s*(.+?)\s*\|/, b);

    let enunciado = blockField('Enunciado', b);
    const resolucao = blockField('Resolu[çc][ãa]o', b) || blockField('Resolução', b);
    const resumo = blockField('Resumo Flash', b);

    if(status && status.trim() !== 'Válida'){ ignoradas++; return; }
    if(!enunciado){ ignoradas++; return; }

    const anos = (freq||'').match(/20\d{2}/g);
    const anosNum = anos ? anos.map(Number) : [];

    let nivel = 'media';
    if(nivelRaw){
      if(/baixa/i.test(nivelRaw)) nivel='baixa';
      else if(/alta/i.test(nivelRaw)) nivel='alta';
      else nivel='media';
    }
    let escopo = 'literal';
    if(escopoRaw){
      if(/fora do edital/i.test(escopoRaw)) escopo='fora';
      else if(/tem[áa]tico/i.test(escopoRaw)) escopo='tematico';
      else escopo='literal';
    }

    const gabarito = extractGabarito(b, resolucao);
    const tipo = (gabarito==='Certo'||gabarito==='Errado') ? 'CE' : (gabarito ? 'MC' : 'sem_gabarito');
    if(tipo==='sem_gabarito') semGabarito++;

    enunciado = enunciado.replace(/\n?\s*(Certo\s*Errado|Certo|Errado)\s*$/,'').trim();

    let alternativas = null;
    if(tipo==='MC'){
      const altMatches = [...enunciado.matchAll(/([a-e]\))\s*([\s\S]+?)(?=\n[a-e]\)|$)/g)];
      if(altMatches.length){
        alternativas = altMatches.map(m=>({ letra:m[1].replace(')','').trim(), texto:m[2].trim() }));
      }
    }

    results.push({
      n:num, bc:banca||'—', es:escopo, ft:fonte||'', nv:nivel, td:tendencia||'', fr:freq||'',
      an:anosNum, ar:anosNum.length?Math.max(...anosNum):null,
      q:enunciado, r:resolucao||'', rf:resumo||'', g:gabarito, t:tipo,
      alt: alternativas || null,
    });
  });

  return { results, ignoradas, semGabarito };
}

async function processImportedText(content, sugestaoNome){
  let materiaNome = (STATE.importDeckName||'').trim();
  if(!materiaNome) materiaNome = (sugestaoNome||'').trim();
  if(!materiaNome) materiaNome = 'Módulo importado';

  try{
    const { results, ignoradas, semGabarito } = parseTxtQuestions(content);
    if(results.length===0){
      STATE.importLog = { error: 'Nenhuma questão com Status "Válida" foi encontrada nesse texto. Confira o formato.' };
      render();
      return;
    }
    const slug = slugify(materiaNome);
    const existingUids = new Set(ALL_QUESTIONS.map(q=>q.uid));
    let added = 0;
    results.forEach(r=>{
      let uid = `${slug}-${r.n}`;
      let suffix = 1;
      while(existingUids.has(uid)){ uid = `${slug}-${r.n}-${suffix++}`; }
      existingUids.add(uid);
      const temaAuto = r.tema || classifyTema(r.q, r.es);
      ALL_QUESTIONS.push({ ...r, materia: materiaNome, tema: temaAuto || 'Geral', uid, origem:'importado' });
      added++;
    });
    reindex();
    await saveCustomQuestions();

    const pontuaveis = results.filter(r=>r.t==='CE'||r.t==='MC').length;
    STATE.importLog = {
      importadas: pontuaveis,
      semGabarito,
      ignoradas,
      materia: materiaNome,
      amostra: results.slice(0,8).map(r=>({ n:r.n, tipo: r.t==='CE'?'Certo/Errado':(r.t==='MC'?'Múltipla escolha':'Sem gabarito') })),
    };
    STATE.materia = materiaNome;
    STATE.tema = 'todos';
    STATE.importDeckName = '';
    STATE.pasteText = '';
    STATE.showPaste = false;
    render();

    // publica automaticamente, sem precisar de clique manual, pra que qualquer
    // visitante do site já veja essa matéria assim que ela for importada
    const pub = await publicarQuestoesNoFirestore([materiaNome]);
    STATE.importLog.publicadoAutomaticamente = pub.ok;
    STATE.importLog.erroPublicacao = pub.ok ? null : pub.motivo;
    render();
  }catch(err){
    STATE.importLog = { error: 'Erro ao interpretar o texto: ' + err.message };
    render();
  }
}

function handleImportFile(file){
  const sugestaoNome = (file.name||'').replace(/\.[^/.]+$/,'').replace(/[_\-]+/g,' ').trim();
  const ehPdf = /\.pdf$/i.test(file.name||'') || file.type === 'application/pdf';
  if(ehPdf){
    extrairTextoDePdf(file, sugestaoNome);
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    const content = e.target.result;
    processImportedText(content, sugestaoNome);
  };
  reader.onerror = () => {
    STATE.importLog = { error: 'Não foi possível ler o arquivo selecionado.' };
    render();
  };
  reader.readAsText(file, 'utf-8');
}

// extrai o texto de um PDF usando pdf.js (carregado via CDN) e alimenta o mesmo
// pipeline de importação usado pros arquivos .txt — funciona bem com PDFs que
// têm texto selecionável; PDFs só com imagem escaneada (sem camada de texto)
// não têm como ser lidos assim, já que não existe OCR embutido no navegador
async function extrairTextoDePdf(file, sugestaoNome){
  if(typeof pdfjsLib === 'undefined'){
    STATE.importLog = { error: 'A biblioteca de leitura de PDF não carregou nesta sessão (pode ser falta de conexão). Recarregue a página e tente de novo, ou converta o PDF pra .txt antes de importar.' };
    render();
    return;
  }
  STATE.importLog = { pending: true, msg: `Lendo "${file.name}"…` };
  render();
  try{
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    let textoCompleto = '';
    for(let i=1; i<=pdf.numPages; i++){
      STATE.importLog = { pending: true, msg: `Lendo "${file.name}"… página ${i} de ${pdf.numPages}` };
      if(i % 5 === 0) render(); // atualiza o progresso na tela de tempos em tempos, sem re-renderizar a cada página
      const page = await pdf.getPage(i);
      const conteudo = await page.getTextContent();
      // agrupa por linha aproximada (mesma coordenada Y) pra preservar quebras de
      // linha do PDF original, já que o pdf.js devolve os fragmentos soltos
      let linhaAtualY = null;
      let linha = '';
      conteudo.items.forEach(item=>{
        const y = item.transform[5];
        if(linhaAtualY!==null && Math.abs(y - linhaAtualY) > 2){
          textoCompleto += linha.trim() + '\n';
          linha = '';
        }
        linha += item.str + ' ';
        linhaAtualY = y;
      });
      textoCompleto += linha.trim() + '\n\n';
    }
    if(!textoCompleto.trim()){
      STATE.importLog = { error: `Não foi possível extrair texto de "${file.name}". Esse PDF provavelmente é uma imagem escaneada, sem camada de texto selecionável — nesse caso, não tem como ler automaticamente.` };
      render();
      return;
    }
    processImportedText(textoCompleto, sugestaoNome);
  }catch(e){
    console.error('Falha ao extrair texto do PDF', e);
    STATE.importLog = { error: `Não foi possível ler o PDF "${file.name}": ` + (e && e.message ? e.message : 'erro desconhecido') };
    render();
  }
}

async function despublicarMateria(materiaNome){
  if(!FIREBASE_OK || !materiaNome) return;
  try{
    // agora cada matéria tem seu próprio documento — despublicar é simplesmente
    // apagar o documento dela inteiro, sem precisar reler/reescrever nada mais
    await fbDb.collection('publico').doc(slugify(materiaNome)).delete();
  }catch(e){
    console.error('Falha ao remover da versão pública', e);
  }
}

async function removerMateria(materiaNome){
  const uidsRemover = new Set(ALL_QUESTIONS.filter(q=>q.materia===materiaNome).map(q=>q.uid));
  if(uidsRemover.size===0) return;
  ALL_QUESTIONS = ALL_QUESTIONS.filter(q=>!uidsRemover.has(q.uid));
  reindex();
  // limpa também o progresso de qualquer bucket que referencie essas questões
  uidsRemover.forEach(uid=>{
    Object.values(PROGRESS).forEach(bucket=>{
      if(bucket && bucket.perguntas) delete bucket.perguntas[uid];
      if(bucket && bucket.flash) delete bucket.flash[uid];
    });
  });
  delete PROGRESS[materiaNome];
  STATE.materiasPublicadasNestaSessao.delete(materiaNome);
  STATE.importLog = null;
  // se havia um simulado/modo leitura aberto justamente nessa matéria, ele ficaria
  // com referências a questões que não existem mais — descarta pra evitar quebrar a tela
  if(STATE.quiz && STATE.quiz.materia===materiaNome) STATE.quiz = null;
  if(STATE.flashDeck && STATE.flashDeck.materia===materiaNome) STATE.flashDeck = null;
  if(STATE.materia===materiaNome) STATE.materia = null;
  render();

  // salva e envia pra nuvem IMEDIATAMENTE (sem esperar o debounce), pra evitar que uma
  // sincronização automática logo em seguida "restaure" a matéria removida a partir
  // de uma cópia antiga que ainda estava no Firestore
  await saveCustomQuestions();
  try{ await storageSet(STORAGE_KEY, JSON.stringify(PROGRESS)); }catch(e){ console.error('Falha ao salvar progresso', e); }
  await pushToCloud();
  // se essa matéria tinha sido publicada, remove também da cópia pública —
  // senão ela reaparece pra todo mundo (inclusive você) no próximo carregamento
  await despublicarMateria(materiaNome);
}

// substitui todo o conteúdo de uma matéria por um arquivo novo, mantendo o mesmo nome —
// remove as questões antigas (local, nuvem pessoal e pública) e importa o arquivo por cima
// "Inserir" apenas ADICIONA questões novas a uma matéria já existente — nunca
// remove as antigas nem mexe no histórico de progresso. Reaproveita o mesmo
// pipeline de importação (handleImportFile → processImportedText), que já é
// aditivo por natureza (só dá push nas questões novas). A deduplicação (ver
// marcarDuplicatas) cuida de esconder qualquer questão idêntica que já exista,
// sem duplicar visualmente o conteúdo pro usuário nem contar duas vezes.
async function inserirNaMateria(materiaNome, file){
  STATE.importDeckName = materiaNome;
  handleImportFile(file);
}

  root.querySelectorAll('[data-abrir-sessao]').forEach(el=>{
    el.addEventListener('click', ()=> abrirSessaoHistorico(parseInt(el.dataset.abrirSessao,10)));
  });
  root.querySelectorAll('[data-salvar-sessao]').forEach(el=>{
    el.addEventListener('click', ()=> salvarSessaoHistoricoParaComparacao(parseInt(el.dataset.salvarSessao,10)));
  });
  root.querySelectorAll('[data-excluir-sessao]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const ok = window.confirm('Excluir este simulado do histórico "Últimos simulados"? Essa ação não pode ser desfeita.');
      if(ok) excluirSessaoHistorico(parseInt(el.dataset.excluirSessao,10));
    });
  });

  const btnToggleAssunto = document.getElementById('btn-toggle-assunto');
  if(btnToggleAssunto) btnToggleAssunto.addEventListener('click', ()=>{ STATE.assuntoAberto = !STATE.assuntoAberto; render(); });

  const btnToggleCargoMenu = document.getElementById('btn-toggle-cargo-menu');
  if(btnToggleCargoMenu) btnToggleCargoMenu.addEventListener('click', ()=>{
    const setup = getSetup(STATE.materia);
    setup.cargoMenuAberto = !setup.cargoMenuAberto;
    render();
  });
  const btnTogglePaginacao = document.getElementById('btn-toggle-paginacao');
  if(btnTogglePaginacao) btnTogglePaginacao.addEventListener('click', ()=>{
    STATE.paginacaoAberta = !STATE.paginacaoAberta;
    render();
  });

  const btnAbrirConfig = document.getElementById('btn-abrir-config');
  if(btnAbrirConfig) btnAbrirConfig.addEventListener('click', ()=>{ STATE.mostrarConfigSimulado = true; render(); });
  const btnVoltarLanding = document.getElementById('btn-voltar-landing');
  if(btnVoltarLanding) btnVoltarLanding.addEventListener('click', ()=>{ STATE.mostrarConfigSimulado = false; render(); });

  const uploadZone = document.getElementById('upload-zone');
  const fileInput = document.getElementById('file-input');
  const assuntoInput = document.getElementById('input-assunto-nome');
  if(assuntoInput) assuntoInput.addEventListener('input', (e)=>{ STATE.importDeckName = e.target.value; });
  if(uploadZone && fileInput){
    uploadZone.addEventListener('click', ()=> fileInput.click());
    uploadZone.addEventListener('dragover', (e)=>{ e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', ()=> uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', (e)=>{
      e.preventDefault(); uploadZone.classList.remove('dragover');
      if(e.dataTransfer.files && e.dataTransfer.files[0]) handleImportFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e)=>{
      if(e.target.files && e.target.files[0]) handleImportFile(e.target.files[0]);
    });
  }
  const btnBuscarComputador = document.getElementById('btn-buscar-computador');
  if(btnBuscarComputador && fileInput) btnBuscarComputador.addEventListener('click', ()=> fileInput.click());

  const btnTogglePaste = document.getElementById('btn-toggle-paste');
  if(btnTogglePaste) btnTogglePaste.addEventListener('click', ()=>{ STATE.showPaste = !STATE.showPaste; render(); });
  const btnToggleBackupManual = document.getElementById('btn-toggle-backup-manual');
  if(btnToggleBackupManual) btnToggleBackupManual.addEventListener('click', ()=>{ STATE.showBackupManual = !STATE.showBackupManual; render(); });
  const pasteTextarea = document.getElementById('paste-textarea');
  if(pasteTextarea) pasteTextarea.addEventListener('input', (e)=>{ STATE.pasteText = e.target.value; });
  const btnProcessarColado = document.getElementById('btn-processar-colado');
  if(btnProcessarColado) btnProcessarColado.addEventListener('click', ()=>{
    const texto = (STATE.pasteText||'').trim();
    if(!texto){
      STATE.importLog = { error: 'Cole o conteúdo do arquivo .txt na caixa de texto antes de processar.' };
      render();
      return;
    }
    processImportedText(texto, STATE.importDeckName || 'Colado manualmente');
  });

  root.querySelectorAll('[data-remover-materia]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const nome = el.dataset.removerMateria;
      const ok = window.confirm(`Remover todas as questões e o progresso da matéria "${nome}"? Isso também remove ela da versão pública, se estiver publicada. Essa ação não afeta as demais matérias.`);
      if(ok) await removerMateria(nome);
    });
  });
  const fileInputAtualizar = document.getElementById('file-input-atualizar');
  root.querySelectorAll('[data-download-materia]').forEach(el=>{
    el.addEventListener('click', ()=> downloadListaQuestoes(el.dataset.downloadMateria));
  });
  root.querySelectorAll('[data-inserir-materia]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const nome = el.dataset.inserirMateria;
      if(!fileInputAtualizar) return;
      fileInputAtualizar.onchange = (e)=>{
        if(e.target.files && e.target.files[0]) inserirNaMateria(nome, e.target.files[0]);
        fileInputAtualizar.value = '';
      };
      fileInputAtualizar.click();
    });
  });
}

/* ================= atalhos de teclado ================= */
function isDigitandoEmCampo(e){
  const tag = (e.target && e.target.tagName || '').toLowerCase();
  return tag==='input' || tag==='textarea';
}
document.addEventListener('keydown', (e)=>{
  if(isDigitandoEmCampo(e)) return;

  if(STATE.flashDeck){
    if(e.key==='ArrowLeft'){ e.preventDefault(); flashGoPrev(); return; }
    if(e.key==='ArrowRight'){ e.preventDefault(); flashGoNext(); return; }
    if(e.key===' ' || e.key==='Enter'){ e.preventDefault(); STATE.flashDeck.flipped = !STATE.flashDeck.flipped; render(); return; }
    return;
  }

  if(!STATE.quiz || STATE.quiz.finished) return;
  const quiz = STATE.quiz;
  if(e.key==='ArrowLeft' || e.key==='Shift'){ e.preventDefault(); goPrev(); return; }
  if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); goNext(); return; }
  const uid = quiz.queue[quiz.idx];
  const q = BY_UID[uid];
  if(q && q.t==='CE' && !quiz.respostas[uid]){
    if(e.key==='c' || e.key==='C'){ e.preventDefault(); pickAnswer('Certo'); return; }
    if(e.key==='e' || e.key==='E'){ e.preventDefault(); pickAnswer('Errado'); return; }
  }
});

/* ================= init ================= */
(async function init(){
  root.innerHTML = `<div style="padding:60px;text-align:center;color:#a9b6cc;font-family:var(--font-mono);font-size:13px;">Carregando processo…</div>`;
  await loadProgress();
  ensureMateriaSelecionada();
  render();
  // salvamento automático silencioso a cada minuto, além do salvamento
  // já disparado a cada resposta/ação
  setInterval(()=>{ saveProgress(); }, 60000);
  // garante que o simulado em andamento chegue na nuvem mesmo se a aba for
  // fechada/minimizada antes do debounce de 250ms disparar sozinho — essencial
  // pro "Continuar" aparecer certo em outro dispositivo depois
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='hidden') flushQuizSyncPendente();
  });
  window.addEventListener('pagehide', flushQuizSyncPendente);
})();

</script>
