rado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":64,"bc":"CEBRASPE, Auditor (TCDF)","es":"tematico","ft":"Externa (Jurisprudência do STF e LO/TCDF, Art. 1º, X)","nv":"media","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"64) Ao fixar as regras gerais acerca de competência, atribuições, composição e funcionamento do TCU, a Constituição da República definiu os parâmetros a serem seguidos pelos tribunais de contas dos estados e municípios. Considerando a jurisprudência do STF referente aos tribunais de contas e em particular ao TCDF, julgue o item a seguir.\nCaso identifique irregularidade grave em determinado contrato celebrado pelo DF, e desde que tenha assegurado à empresa contratada o direito ao contraditório e à ampla defesa, o TCDF possui competência para determinar que o DF anule o contrato.","r":"O gabarito é Certo[cite: 2]. De acordo com a jurisprudência do STF, os Tribunais de Contas têm a competência de expedir determinações corretivas aos órgãos jurisdicionados quando constatadas ilegalidades. Consoante o art. 1º, X, da LO/TCDF, a Corte assina prazo para o exato cumprimento da lei, o que pode incluir a determinação cogente para que o órgão executivo anule o contrato maculado, resguardados a ampla defesa e o contraditório do terceiro afetado.","rf":"O TCDF não anula diretamente o contrato (nem susta), mas pode determinar ao órgão jurisdicionado que o anule sob pena de sanções.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":65,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"tematico","ft":"Externa (Jurisprudência STF / Súmula 208 STJ)","nv":"baixa","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"65) Acerca da competência do TCDF, julgue o item abaixo.\nConsidere a seguinte situação hipotética.\nEm decorrência de convênio celebrado entre a União e o Distrito Federal (DF) para a execução de obra pública, foi definido que aquela entraria com 80% dos recursos necessários à execução do objeto do convênio, cabendo ao DF apenas completar a diferença.\nNessa situação, haja vista a evidente competência do TCU, ficará afastada a competência do TCDF para exercer processos de fiscalização ou instaurar processos de contas.","r":"O gabarito é Errado[cite: 2]. A competência fiscalizatória do TCU sobre a verba federal transferida não afasta, de forma excludente, a competência do TCDF sobre a contrapartida financeira do ente local (os 20% aportados pelo Distrito Federal). Há uma concorrência de controles sobre um mesmo objeto (o convênio), sendo cada Tribunal competente no limite dos recursos oriundos da respectiva esfera federativa.","rf":"Convênios mistos geram jurisdição concorrente: o TCU audita os recursos federais, e o TCDF audita a contrapartida do Distrito Federal.","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":66,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"66) Compete ao TCDF\njulgar as contas do governador do DF.","r":"O gabarito é Errado[cite: 2]. A LO/TCDF (Art. 1º, inciso I) veda o julgamento das contas do Governador pelo Tribunal[cite: 1]. Compete à Corte apenas apreciar, fazer relatório analítico e emitir parecer prévio, enviando tais instrumentos à Câmara Legislativa do Distrito Federal (CLDF), órgão soberano responsável por esse julgamento[cite: 1].","rf":"TCDF não julga contas do Governador, quem julga é a Câmara Legislativa.","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":67,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"67) Compete ao TCDF\nexaminar a legalidade, para fins de registro, dos atos de admissão de comissionados do DF.","r":"O gabarito é Errado[cite: 2]. O art. 1º, inciso III, da LO/TCDF impõe que a Corte aprecie a admissão de pessoal na administração direta e indireta, mas inclui uma ressalva cabal: ficam EXCETUADAS do registro as nomeações para cargo de provimento em comissão, dada sua precariedade e livre exoneração[cite: 1].","rf":"Atos de admissão para cargos em comissão estão expressamente isentos do registro pelo TCDF.","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":68,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"68) Compete ao TCDF\njulgar contas de organizações sociais do DF que tenham recebido recursos em decorrência de contratos de gestão celebrados com o DF.","r":"O gabarito é Certo[cite: 2]. Nos moldes da Lei Orgânica do TCDF (Art. 6º, IV), a jurisdição do Tribunal abrange amplamente os responsáveis por entidades dotadas de personalidade jurídica de direito privado que venham a receber contribuições, recursos públicos ou prestar serviços de interesse social[cite: 1]. Isto autoriza plenamente o julgamento das contas das Organizações Sociais atreladas aos contratos de gestão[cite: 1].","rf":"Organizações Sociais (OS) e entidades privadas que gerem recursos públicos sujeitam-se ao julgamento de contas do TCDF.","g":"Certo","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":69,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"tematico","ft":"Externa (Jurisprudência do STF)","nv":"baixa","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"69) Julgue o item que se segue, considerando a jurisprudência do STF acerca da atuação e da competência dos tribunais de contas.\nO TCDF poderá, caso seja absolutamente necessário à instrução de processos de sua competência, decretar a quebra de sigilo bancário e fiscal, em decisão motivada, de administradores públicos do DF.","r":"O gabarito é Errado[cite: 2]. O Supremo Tribunal Federal (STF) possui entendimento pacificado de que os Tribunais de Contas não dispõem de competência autônoma para determinar (decretar) diretamente a quebra do sigilo bancário e fiscal de entes ou cidadãos submetidos à sua jurisdição (MS 22.801 e subsequentes). Para acessar tais dados sigilosos sem autorização judicial, a Corte depende de compartilhamento feito por órgãos já competentes, e não de decretação própria.","rf":"O TCDF não pode quebrar diretamente o sigilo bancário ou fiscal; tal prerrogativa é restrita ao Poder Judiciário ou a CPIs.","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":70,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"70) A fiscalização contábil, financeira, orçamentária, operacional e patrimonial dos entes da Federação e de suas entidades da administração direta e indireta é exercida pelos órgãos do Poder Legislativo com o auxílio dos tribunais de contas. Considerando especialmente as disposições da Constituição da República e da Lei Orgânica do TCDF, julgue o item a seguir.\nAo TCDF compete, na forma estabelecida no seu Regimento Interno, julgar as contas prestadas anualmente pelo governador do DF. As contas consistirão nos balanços gerais e no relatório do órgão central do sistema de controle interno do Poder Executivo, acerca da execução dos orçamentos fiscal, da seguridade social e de investimentos das empresas.","r":"O gabarito é Errado[cite: 2]. A competência constitucional e legal do TCDF (Art. 1º, inciso I) restringe-se a apreciar, instruir com relatório analítico e emitir parecer prévio sobre as contas prestadas anualmente pelo Governador[cite: 1]. É vedado e juridicamente incorreto afirmar que o Tribunal irá \"julgar\" o mérito das referidas contas, competência exclusiva da CLDF[cite: 1].","rf":"A competência perante as contas do Governador limita-se à emissão de parecer prévio; o julgamento cabe ao Poder Legislativo.","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":71,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"71) A fiscalização contábil, financeira, orçamentária, operacional e patrimonial dos entes da Federação e de suas entidades da administração direta e indireta é exercida pelos órgãos do Poder Legislativo com o auxílio dos tribunais de contas. Considerando especialmente as disposições da Constituição da República e da Lei Orgânica do TCDF, julgue o item a seguir.\nO TCDF apreciará, para fins de registro ou reexame, os atos de admissão de pessoal, de concessão inicial de aposentadorias, reformas e pensões, bem como editais de licitação e os contratos, convênios, acordos, ajustes ou outros instrumentos congêneres.","r":"O gabarito é Errado[cite: 2]. O art. 1º, inciso III, da LO/TCDF prevê a apreciação para \"fins de registro\" APENAS dos atos de admissão de pessoal (exceto cargos em comissão) e de concessões iniciais de aposentadorias, reformas e pensões[cite: 1]. O Tribunal audita e fiscaliza contratos e convênios (incisos V e VII), mas tais instrumentos não são atos sujeitos a \"registro\"[cite: 1].","rf":"O instituto da apreciação para registro aplica-se aos atos complexos de pessoal e inatividade, não abrangendo contratos e convênios.","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":72,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2014 (1 questão), 2024 (1 questão)","an":[2014,2024],"ar":2024,"q":"72) A respeito da composição do TCDF, do seu Plenário, das suas câmaras e das competências do seu presidente, julgue o item que se seguem.\nCabe ao presidente dirigir o TCDF, devendo aquele solicitar autorização do Plenário do tribunal para movimentar as dotações e os créditos orçamentários do órgão.","r":"O gabarito é Errado[cite: 2]. Segundo o art. 68, inciso IV, da Lei Orgânica do TCDF, compete expressamente ao Presidente do Tribunal movimentar as dotações e créditos orçamentários próprios da Corte[cite: 1]. Esse ato de administração financeira é executado de forma direta, não dependendo de prévia autorização ou submissão ao Plenário do Tribunal[cite: 1].","rf":"A movimentação orçamentária do TCDF é competência administrativa direta do Presidente, independente de autorização do Plenário.","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":73,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"↑ Crescente","fr":"2024 (1 questão)","an":[2024],"ar":2024,"q":"73) A respeito da composição do TCDF, do seu Plenário, das suas câmaras e das competências do seu presidente, julgue o item que se seguem.\nO auditor, ao substituir um conselheiro, terá as mesmas garantias e prerrogativas do titular, não podendo, entretanto, tomar parte nas eleições para presidente do TCDF.","r":"O gabarito é Certo[cite: 2]. O art. 63, § 3º, outorga ao Auditor convocado, durante a substituição, as mesmas garantias e prerrogativas do Conselheiro titular[cite: 1]. Entretanto, a restrição ao voto é absoluta: o art. 67, § 8º, preconiza que SOMENTE os Conselheiros titulares, mesmo afastados ou em gozo de férias, poderão tomar parte nas eleições da Mesa Diretora do TCDF[cite: 1].","rf":"Auditores (Conselheiros-Substitutos) em substituição exercem as prerrogativas dos titulares, mas são expressamente proibidos de votar na eleição da Mesa Diretora.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":74,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2024 (1 questão)","an":[2024],"ar":2024,"q":"74) A respeito dos conselheiros, dos auditores e do Ministério Público, julgue o item seguinte, de acordo com a Lei Orgânica do TCDF.\nOs conselheiros e os auditores do TCDF adquirem a vitaliciedade com a posse nos respectivos cargos.","r":"O gabarito é Errado[cite: 2]. A garantia de permanecer no cargo (vitaliciedade) incide em tempos distintos para ambas as carreiras[cite: 1]. Enquanto os Conselheiros adquirem a garantia diretamente com a posse (Art. 71, § único, I), a LO/TCDF estabelece no art. 75 que os Auditores só perderão o cargo por sentença judicial após implementados dois anos de efetivo exercício[cite: 1].","rf":"Conselheiros adquirem vitaliciedade com a posse; Auditores (Conselheiros-Substitutos) garantem o benefício apenas após 2 anos de exercício.","g":"Errado","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"},{"n":75,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2024 (1 questão)","an":[2024],"ar":2024,"q":"75) A respeito dos conselheiros, dos auditores e do Ministério Público, julgue o item seguinte, de acordo com a Lei Orgânica do TCDF.\nO requisito de notório conhecimento jurídico, contábil, econômico e financeiro ou de administração pública para ocupar o cargo de conselheiro pode ser substituído pela comprovação do exercício, por mais de 10 anos, de função ou de efetiva atividade profissional que exija os conhecimentos mencionados.","r":"O gabarito é Errado[cite: 2]. O art. 69 da Lei Orgânica do TCDF elenca quatro requisitos para a nomeação de Conselheiro (idade, idoneidade moral, notórios conhecimentos e 10 anos de experiência) que são estritamente *cumulativos*, e não alternativos[cite: 1]. A experiência profissional prática exige e complementa os notórios conhecimentos, mas em momento algum substitui ou supre a ausência do outro requisito na qualificação técnica[cite: 1].","rf":"Os requisitos para o cargo de Conselheiro (notórios conhecimentos e 10 anos de experiência) são cumulativos, e não substitutivos.","g":"Errado","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"},{"n":76,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2024 (1 questão)","an":[2024],"ar":2024,"q":"76) Em relação aos serviços auxiliares do TCDF, julgue o item a seguir.\nAo servidor responsável pela execução dos serviços administrativos no TCDF é assegurada a prerrogativa de livre ingresso em órgãos e entidades sujeitos à jurisdição desse tribunal de contas.","r":"O gabarito é Errado[cite: 2]. As prerrogativas conferidas aos servidores — como livre ingresso e acesso irrestrito a documentos — não se aplicam indiscriminadamente a qualquer servidor da área administrativa[cite: 1]. Conforme o art. 79 da LO/TCDF, essas prerrogativas são asseguradas apenas ao servidor que exerce \"funções específicas de controle externo\" quando devidamente *credenciado* para realizar inspeções e auditorias determinadas pela Corte[cite: 1].","rf":"O livre ingresso nos órgãos jurisdicionados é prerrogativa do servidor de controle externo credenciado, não de todo servidor administrativo do TCDF.","g":"Errado","t":"CE","tm":"Serviços Auxiliares e Servidores"},{"n":77,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2024 (1 questão)","an":[2024],"ar":2024,"q":"77) A respeito da composição do TCDF, do seu Plenário, das suas câmaras e das competências do seu presidente, julgue o item que se seguem.\nÉ facultado ao TCDF dividir-se em câmaras e, caso não opte por essa divisão, a corte funcionará com apenas um órgão colegiado deliberativo, o Plenário, sem que isso ocasione qualquer prejuízo à regularidade da atuação do tribunal.","r":"O gabarito é Certo[cite: 2]. A inteligência conjugada dos arts. 65 e 66 da Lei Complementar distrital nº 01/1994 demonstra que o funcionamento pleno do TCDF está atrelado ao seu órgão máximo (o Plenário)[cite: 1]. A divisão interna do Tribunal em Câmaras é uma opção estrutural (\"poderá dividir-se\"), cujo exercício ou omissão não inviabiliza nem macula a atuação regular da Corte[cite: 1].","rf":"A divisão do TCDF em Câmaras não é obrigatória, sendo uma faculdade estrutural que, se não exercida, concentra os poderes no Plenário.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":78,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2024 (1 questão)","an":[2024],"ar":2024,"q":"78) Em relação aos serviços auxiliares do TCDF, julgue o item a seguir.\nOs servidores integrantes dos serviços auxiliares do TCDF fazem jus a assistência médica e hospitalar, e as suas remunerações mensais não podem ultrapassar o valor da remuneração total recebida por conselheiro desse tribunal.","r":"O gabarito é Certo[cite: 2]. A proposição congrega o art. 80 (assistência médica e hospitalar, cuja promoção é dever do Presidente) e a regra do art. 81 da LO/TCDF[cite: 1]. O teto de vencimentos fixado para qualquer servidor dos Serviços Auxiliares corresponde efetivamente ao valor em espécie recebido por Conselheiro do próprio TCDF (equiparado a Desembargador do TJDFT), ressalvadas apenas as vantagens de caráter pessoal[cite: 1].","rf":"A assistência médica dos servidores é dever do TCDF, e a remuneração deles se submete ao teto do vencimento de Conselheiro da Corte.","g":"Certo","t":"CE","tm":"Serviços Auxiliares e Servidores"},{"n":79,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"tematico","ft":"Mista (Interna + Jurisprudência STF)","nv":"media","td":"→ Estável","fr":"2024 (1 questão)","an":[2024],"ar":2024,"q":"79) No que diz respeito aos membros dos tribunais de contas, julgue o item a seguir.\nHavendo vacância do cargo de conselheiro de tribunal de contas, o seu preenchimento deve atender ao critério da cadeira cativa, salvo, entre outros casos, quando inexistir, na composição da corte de contas, representante do MP especial, uma vez que a sua ausência importaria a completa falta de representatividade constitucional do MP especial","r":"O gabarito é Errado[cite: 2]. O Supremo Tribunal Federal, ao julgar a dinâmica de preenchimento das vagas de provimento do Executivo destinadas a Auditores e Membros do MPTC, firmou a teoria vinculante da \"cadeira cativa\"[cite: 1]. Segundo a Corte, a vaga reservada (originada) de um integrante técnico pertence sempre àquela respectiva carreira, não havendo exceções como a sugerida (\"falta de representatividade\") para subverter a vinculação técnica da sucessão[cite: 1].","rf":"Pela tese da \"cadeira cativa\", se aposenta um Conselheiro oriundo de vaga de Auditor, o novo será obrigatoriamente um Auditor (e vice-versa).","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":80,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2024 (1 questão)","an":[2024],"ar":2024,"q":"80) A respeito do funcionamento do TCDF e das súmulas de jurisprudência no âmbito desse tribunal, julgue o item seguintes.\nAs atribuições do vice-presidente do TCDF incluem a de suceder o presidente caso ocorra a vacância do cargo nos noventa dias anteriores ao término do mandato.","r":"O gabarito é Errado[cite: 2]. Há dois equívocos crassos na afirmativa frente ao texto da LO/TCDF (Art. 67, § 2º e § 5º)[cite: 1]. Primeiro, a lei confere ao Vice-Presidente a competência restrita para \"substituir\" e não formalmente para suceder o Presidente. Segundo, o período limitador para o qual não se convoca nova eleição (sendo suprido pelo substituto legal) é o lapso dos últimos 60 (SESSENTA) dias do mandato, e não 90 dias[cite: 1].","rf":"Se vagar o cargo de Presidente faltando 60 dias para o fim do mandato, não haverá nova eleição (conclui-se via substituição).","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":81,"bc":"CEBRASPE, Analista (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2023 (1 questão)","an":[2023],"ar":2023,"q":"81) À luz da Lei Orgânica do Tribunal de Contas do Distrito Federal - Lei Complementar n.º 1/1994-, julgue o item a seguir.\nOs conselheiros, em suas ausências ou impedimentos por motivo de licença, férias ou outro afastamento legal, desde que por prazo superior a trinta e cinco dias, poderão ser substituídos pelos auditores, observada a ordem de antiguidade no cargo.","r":"O gabarito é Errado[cite: 2]. O art. 63 da Lei Orgânica do TCDF autoriza expressamente a substituição de Conselheiro por Auditor nos casos de licença, férias ou outro impedimento por prazo *superior a trinta dias*[cite: 1]. A banca incorreu na alteração sutil do prazo legal, cobrando \"superior a trinta e cinco dias\" para invalidar a assertiva[cite: 1].","rf":"O afastamento que legitima a substituição ordinária de Conselheiro por Auditor deve ter prazo superior a 30 (trinta) dias.","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":82,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2023 (1 questão)","an":[2023],"ar":2023,"q":"82) Em relação à estrutura, à composição e aos membros do TCDF, julgue o item a seguir, considerando o disposto na Lei Orgânica do TCDF.\nOs auditores podem ser convocados para substituir conselheiro na ausência e impedimentos deste, para completar quórum dos colegiados, bem como em caso de vacância do cargo do conselheiro.","r":"O gabarito é Certo[cite: 2]. A alternativa exaure as três hipóteses expressamente previstas no art. 63 da Lei Orgânica do TCDF[cite: 1]. Os Auditores (Conselheiros-Substitutos) atuarão em três frentes de suplência: nas ausências/impedimentos de longo prazo (>30 dias) do Conselheiro titular (caput), nas substituições emergenciais apenas para completar quórum de votação (§ 1º) e provisoriamente em caso de vacância definitiva da cadeira do titular (§ 2º)[cite: 1].","rf":"As 3 hipóteses de convocação de Auditor: Ausências prolongadas (>30 dias), complementar quórum da sessão ou suprir cargo vago até novo provimento.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":83,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2023 (1 questão)","an":[2023],"ar":2023,"q":"83) Em relação à estrutura, à composição e aos membros do TCDF, julgue o item a seguir, considerando o disposto na Lei Orgânica do TCDF.\nQuando os auditores estão em substituição, a eles se aplicam as mesmas vedações aplicadas aos conselheiros, as quais cessam com o término da substituição.","r":"O gabarito é Errado[cite: 2]. A restrição é aplicável aos membros técnicos da Corte sem qualquer condicionalidade provisória[cite: 1]. Conforme dispõe categoricamente o art. 75, parágrafo único, as rigorosas vedações (v.g., proibição de atividade política e de acúmulo de cargos) e incompatibilidades por parentesco impostas aos Conselheiros aplicam-se ao Auditor (Conselheiro-Substituto) de maneira permanente e indissociável de sua função originária, não cessando ao término de uma substituição pontual[cite: 1].","rf":"As vedações legais do regime jurídico de magistrado aplicam-se ao Auditor do TCDF de forma PERMANENTE (não apenas quando está substituindo).","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":84,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2023 (1 questão)","an":[2023],"ar":2023,"q":"84) Em relação à estrutura, à composição e aos membros do TCDF, julgue o item a seguir, considerando o disposto na Lei Orgânica do TCDF.\nO TCDF poderá dividir-se em câmaras, desde que haja a deliberação favorável de, pelo menos, 4 conselheiros titulares.","r":"O gabarito é Certo[cite: 2]. O art. 66 estabelece a divisão interna do TCDF em Câmaras de julgamento mediante deliberação da *maioria absoluta* de seus membros titulares[cite: 1]. Considerando que o Tribunal de Contas do Distrito Federal compõe-se fixamente de 7 Conselheiros (Art. 62), a aprovação por maioria absoluta requer matematicamente o número mínimo de 4 (quatro) Conselheiros titulares favoráveis[cite: 1].","rf":"A divisão do TCDF em Câmaras não pode ser ato monocrático do Presidente; exige-se voto da maioria absoluta (4 titulares).","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":85,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2023 (1 questão)","an":[2023],"ar":2023,"q":"85) Em relação à estrutura, à composição e aos membros do TCDF, julgue o item a seguir, considerando o disposto na Lei Orgânica do TCDF.\nO procurador-geral, o procurador -corregedor e o procurador- ouvidor do Ministério Público junto ao TCDF são indicados em lista tríplice pelo colégio de procuradores e nomeados pelo governador do Distrito Federal.","r":"O gabarito é Errado[cite: 2]. A assertiva funde equivocadamente as competências estatuídas nos arts. 76-A e 76-B da LO/TCDF[cite: 1]. Somente o Procurador-Geral do MPTC-DF é submetido à chancela externa e nomeado pelo Governador do Distrito Federal[cite: 1]. O Procurador-Corregedor e o Procurador-Ouvidor, eleitos internamente, são designados pelo próprio Presidente do TCDF para mandato de 2 anos, limitados a uma recondução[cite: 1].","rf":"O Governador nomeia APENAS o Procurador-Geral do MPTC; os demais dirigentes (Corregedor/Ouvidor) são designados pelo Presidente do TCDF.","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":86,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2023 (1 questão)","an":[2023],"ar":2023,"q":"86) Em relação à estrutura, à composição e aos membros do TCDF, julgue o item a seguir, considerando o disposto na Lei Orgânica do TCDF.\nA Lei Orgânica do TCDF estabelece apenas uma competência para o vice-presidente do tribunal, qual seja, a substituição do presidente em suas ausências e impedimentos.","r":"O gabarito é Certo[cite: 2]. Uma análise pormenorizada da própria Lei Complementar nº 01/1994 (LO/TCDF) demonstra que o único dispositivo voltado a traçar as funções do Vice-Presidente é o art. 67, § 2º, fixando com exclusividade a tarefa de \"substituir o Presidente em suas ausências ou impedimentos\"[cite: 1]. Qualquer outra atribuição acessória provém do Regimento Interno, extrapolando a reserva da Lei Orgânica tratada no enunciado.","rf":"A única competência fixada expressamente na Lei Orgânica para o Vice-Presidente é substituir o Presidente em suas faltas e impedimentos.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":87,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2023 (1 questão)","an":[2023],"ar":2023,"q":"87) No tocante aos serviços auxiliares do TCDF, julgue o próximo item, de acordo com a Lei Orgânica do TCDF.\nEm uma interpretação sistemática da Lei Orgânica do TCDF, é possível concluir, por via oblíqua, que o teto remuneratório dos servidores dos serviços auxiliares do TCDF é o vencimento dos desembargadores do Tribunal de Justiça do Distrito Federal e Territórios.","r":"O gabarito é Certo[cite: 2]. A interpretação sistemática é irrepreensível: o art. 81 da lei veda ao servidor receber importância superior à percebida como remuneração por Conselheiro do próprio Tribunal[cite: 1]. Por sua vez, o art. 71 determina expressamente que os Conselheiros terão vencimentos equiparados aos dos Desembargadores do TJDFT[cite: 1]. Logo, indiretamente, o teto atrela-se ao valor deferido aos Desembargadores[cite: 1].","rf":"Teto dos servidores auxiliares = Remuneração do Conselheiro TCDF = Vencimento do Desembargador do TJDFT.","g":"Certo","t":"CE","tm":"Serviços Auxiliares e Servidores"},{"n":88,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"tematico","ft":"Externa (Constituição Federal / LODF)","nv":"media","td":"→ Estável","fr":"2021 (1 questão)","an":[2021],"ar":2021,"q":"88) Com base na Lei Orgânica do Distrito Federal, julgue o item:\nA remuneração do auditor de controle externo do Tribunal de Contas do Distrito Federal não poderá exceder, em espécie, o subsídio mensal do chefe do Poder Executivo.","r":"O gabarito é Errado[cite: 2]. A base constitucional (art. 37, XI, CF) reproduzida na Lei Orgânica distrital determina os parâmetros do teto remuneratório no serviço público. Tratando-se de servidores pertencentes ao quadro de Tribunal de Contas (órgão constitucionalmente atrelado à fiscalização e cujos Conselheiros recebem subsídio equiparado à Magistratura), o teto-limite vincula-se ao subsídio dos Desembargadores do TJDFT, afastando a régua do teto do Poder Executivo local (Governador).","rf":"O teto remuneratório no TCDF baseia-se no teto do Judiciário distrital (Desembargador do TJDFT), não no subsídio do Governador.","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":89,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2021 (1 questão)","an":[2021],"ar":2021,"q":"89) Com base na Lei Orgânica e no Regimento Interno do TCDF, julgue o item a seguir.\nOs conselheiros do TCDF são escolhidos ou aprovados pela Câmara Legislativa do Distrito Federal.","r":"O gabarito é Certo[cite: 2]. A assertiva resume adequadamente a interferência imperativa do Poder Legislativo na composição colegiada da Corte[cite: 1]. Conforme o art. 70 da Lei Orgânica do TCDF, a Câmara Legislativa exerce papel ativo tanto para \"escolher\" livremente cinco dos membros, quanto para \"aprovar\" as indicações dos outros dois conselheiros efetuadas pelo Governador[cite: 1].","rf":"Todos os Conselheiros passam pelo crivo da CLDF (seja por escolha direta das 5 vagas ou aprovação compulsória das 2 vagas do Executivo).","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":90,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2021 (1 questão)","an":[2021],"ar":2021,"q":"90) Com base na Lei Orgânica e no Regimento Interno do TCDF, julgue o item a seguir.\nÉ vedado aos auditores do TCDF o exercício de funções ou comissões nas secretarias desse tribunal.","r":"O gabarito é Certo[cite: 2]. O art. 75, parágrafo único, da LO/TCDF estende aos Auditores (Conselheiros-Substitutos), de forma permanente, as vedações impostas aos Conselheiros[cite: 1]. Por sua vez, o art. 72, inciso I, veda o exercício de outro cargo ou função pública[cite: 1]. Consequentemente, o Auditor, regido pelas garantias e impedimentos da magistratura de contas, não pode ocupar cargos em comissão na área administrativa (secretarias) da Corte[cite: 1].","rf":"Aplica-se ao Auditor (Conselheiro-Substituto) a vedação permanente de ocupar funções comissionadas na área de apoio do Tribunal.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":91,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2021 (1 questão)","an":[2021],"ar":2021,"q":"91) Acerca de controle externo e legislação institucional, julgue o item seguinte.\nOs conselheiros do Tribunal de Contas do Distrito Federal, salvo quando em disponibilidade, não poderão exercer outra função pública ou qualquer profissão remunerada, exceto uma de magistério, nem receber, a qualquer título ou pretexto, participação nos processos, nem se dedicar a atividade político-partidária, sob pena de perda do cargo.","r":"O gabarito é Errado[cite: 2]. A restrição constante no art. 72, inciso I, da LO/TCDF é absoluta quanto ao estado do Conselheiro: é vedado exercer outro cargo ou função \"AINDA QUE EM DISPONIBILIDADE\"[cite: 1]. A banca inseriu a expressão \"salvo quando em disponibilidade\", contrariando expressamente a letra da lei[cite: 1].","rf":"A vedação para exercício de outro cargo (exceto magistério) mantém-se incólume AINDA QUE o Conselheiro esteja em disponibilidade.","g":"Errado","t":"CE","tm":"Controle Externo e Legislação Institucional"},{"n":92,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2014 (1 questão), 2021 (1 questão)","an":[2014,2021],"ar":2021,"q":"92) Acerca de controle externo e legislação institucional, julgue o item a seguir.\nConselheiro do TCDF que cometer crime comum deverá ser processado e julgado originariamente pelo Tribunal de Justiça do Distrito Federal e dos Territórios; se o crime for de responsabilidade, o órgão julgador originário será o Superior Tribunal de Justiça.","r":"O gabarito é Errado[cite: 2]. A regra de foro por prerrogativa de função aplicável aos Conselheiros do TCDF é única. De acordo com o art. 70, § 3º, da LO/TCDF, os Conselheiros serão processados e julgados originariamente pelo Superior Tribunal de Justiça (STJ) tanto nos casos de crime comum quanto nos de responsabilidade[cite: 1].","rf":"O foro originário dos Conselheiros do TCDF, para crime comum e crime de responsabilidade, é integralmente o STJ (não o TJDFT).","g":"Errado","t":"CE","tm":"Controle Externo e Legislação Institucional"},{"n":93,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2021 (1 questão)","an":[2021],"ar":2021,"q":"93) Ainda com relação a controle externo e legislação institucional, julgue o item a seguir.\nPrimos podem ocupar simultaneamente cargo de conselheiro do TCDF, e eventual perda de cargo somente pode ocorrer por decisão judicial transitada em julgado.","r":"O gabarito é Certo[cite: 2]. O art. 73 da LO/TCDF proíbe a ocupação simultânea de Conselheiro por parentes consanguíneos ou afins na linha reta ou colateral ATÉ O SEGUNDO GRAU[cite: 1]. Primos são parentes em 4º grau na linha colateral, não incidindo na vedação[cite: 1]. Além disso, pelo art. 71, parágrafo único, inciso I, a perda do cargo vitalício só ocorre por sentença judicial transitada em julgado[cite: 1].","rf":"Parentesco vedado no TCDF é apenas até o 2º grau; logo, parentes de 3º (tios/sobrinhos) e 4º grau (primos) PODEM atuar juntos.","g":"Certo","t":"CE","tm":"Controle Externo e Legislação Institucional"},{"n":94,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"tematico","ft":"Externa (Constituição Federal / Lei Orgânica do MP)","nv":"baixa","td":"→ Estável","fr":"2021 (1 questão)","an":[2021],"ar":2021,"q":"94) Ainda com relação a controle externo e legislação institucional, julgue o item a seguir.\nOs membros do Ministério Público junto ao TCDF, quanto a direitos, garantias, prerrogativas, vedações, regime domiciliar e forma de investidura, submetem-se às disposições da Constituição Federal de 1988 e, subsidiariamente, da Lei Orgânica do Ministério Público do Distrito Federal.","r":"O gabarito é Certo[cite: 2]. O MPTC-DF não possui Lei Orgânica própria apartada, sendo regido primariamente pela Constituição Federal e pelas disposições do TCDF, com aplicação subsidiária imperativa da Lei Orgânica do Ministério Público do Distrito Federal (que integra o MPU), visando assegurar a simetria de prerrogativas, vedações e garantias entre as carreiras ministeriais (independência funcional e unidade)[cite: 1].","rf":"Aplica-se subsidiariamente aos membros do MPTC-DF a Lei Orgânica do Ministério Público Comum do DF para preencher lacunas de prerrogativas e deveres.","g":"Certo","t":"CE","tm":"Controle Externo e Legislação Institucional"},{"n":95,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2014 (2 questões), 2021 (1 questão)","an":[2014,2021],"ar":2021,"q":"95) Ainda com relação a controle externo e legislação institucional, julgue o item a seguir.\nServidor auxiliar do TCDF que receber alguma vantagem de caráter pessoal, seja qual for a natureza, poderá perceber, por mês, a título de remuneração, importância maior que a soma dos valores percebidos como remuneração, em espécie, por conselheiro do tribunal.","r":"O gabarito é Certo[cite: 2]. O art. 81, parágrafo único, da Lei Orgânica do TCDF consagra explicitamente uma exceção ao teto remuneratório geral: as \"VANTAGENS DE CARÁTER PESSOAL DE QUALQUER NATUREZA\" estão legalmente excluídas do teto balizado pela remuneração dos Conselheiros da Corte[cite: 1]. Sendo assim, o servidor pode auferir montante superior de forma lícita[cite: 1].","rf":"Vantagens pecuniárias de caráter pessoal de qualquer natureza NÃO se submetem ao teto remuneratório (vencimento do Conselheiro) na LO/TCDF.","g":"Certo","t":"CE","tm":"Controle Externo e Legislação Institucional"},{"n":136,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2014 (1 questão)","an":[2014],"ar":2014,"q":"136) Com base na Lei Orgânica do TCDF (LODF), no Regimento Interno e no Código de Ética do Auditor de Controle Externo do TCDF, julgue o item subsequente.\nSegundo o Regimento Interno do TCDF, o auditor terá as garantias, os vencimentos e os impedimentos do conselheiro, e, quando o substituir, terá as mesmas garantias, vencimentos e impedimentos de desembargador do TJDFT.","r":"O gabarito é Errado[cite: 2]. Há um erro substancial quanto ao recebimento de vencimentos. O art. 74, § 1º, da LO/TCDF determina que o Auditor só terá os vencimentos e vantagens do titular (Conselheiro) se for convocado para substituição por período \"MAIS DE TRINTA DIAS\"[cite: 1]. Ele não recebe tais vencimentos automaticamente a cada simples ato de substituição, como faz crer a questão[cite: 1].","rf":"Auditor ganha os vencimentos do Conselheiro substituído SOMENTE se a substituição ultrapassar 30 dias contínuos.","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":137,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2014 (1 questão)","an":[2014],"ar":2014,"q":"137) Com base na Lei Orgânica do TCDF (LODF), no Regimento Interno e no Código de Ética do Auditor de Controle Externo do TCDF, julgue o item subsequente.\nO auditor do TCDF, ao ser designado para fiscalizar determinada entidade do DF, deve se declarar impedido se o responsável pela auditoria dessa entidade tiver sido seu sócio em negócio privado que mantiveram antes do ingresso de ambos no setor público.","r":"O gabarito é Certo[cite: 2]. Embora a LO/TCDF não traga regras processuais extensas de suspeição, o art. 78, inciso I, impõe ao servidor de controle externo o dever basilar de manter \"atitude de independência, serenidade e imparcialidade\"[cite: 1]. Um ex-vínculo societário direto compromete objetivamente a imparcialidade imposta pela lei e pelo Código de Ética, impondo a declaração de impedimento[cite: 1].","rf":"O dever legal de independência e imparcialidade (Art. 78) obriga o auditor a se declarar impedido ante conflito de interesse pretérito (ex-sócio).","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":138,"bc":"CEBRASPE, Analista de Administração Pública (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2014 (1 questão)","an":[2014],"ar":2014,"q":"138) Com base nos dispositivos da LO/TCDF, julgue o item seguinte.\nCabe ao presidente da CLDF dar posse ao presidente do TCDF.","r":"O gabarito é Errado[cite: 2]. Conforme preceitua o art. 4º, inciso I, da LO/TCDF, é da competência EXCLUSIVA do próprio Tribunal de Contas do Distrito Federal eleger seu Presidente, o Vice-Presidente, o Corregedor e demais dirigentes da Mesa, bem como \"dar-lhes posse\"[cite: 1]. O ato de posse decorre da autonomia orgânica da Corte, não competindo à Câmara Legislativa.","rf":"O TCDF possui autonomia orgânica para eleger E dar posse aos seus próprios dirigentes.","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":139,"bc":"CEBRASPE, Analista de Administração Pública (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2014 (1 questão), 2023 (1 questão)","an":[2014,2023],"ar":2023,"q":"139) O item abaixo, é apresentada uma situação hipotética, seguida de uma assertiva a ser julgada de acordo com a LO/TCDF.\nO presidente do TCDF constatou a necessidade de reestruturação das câmaras em que se divide o tribunal. Nessa situação, a nova estruturação dependerá da deliberação da maioria absoluta dos membros titulares do TCDF.","r":"O gabarito é Certo[cite: 2]. O art. 66 dispõe que o Tribunal de Contas poderá dividir-se em Câmaras (o que envolve a estruturação e reestruturação de suas turmas) condicionando esse ato institucional, impreterivelmente, à \"deliberação da maioria absoluta de seus membros titulares\"[cite: 1]. Não se trata de ato unilateral do Presidente, mas de votação qualificada do Colegiado[cite: 1].","rf":"Divisão e estruturação de Câmaras exigem deliberação da maioria absoluta dos Conselheiros titulares (pelo menos 4 votos).","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":140,"bc":"CEBRASPE, Analista de Administração Pública (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2014 (1 questão)","an":[2014],"ar":2014,"q":"140) O item abaixo, é apresentada uma situação hipotética, seguida de uma assertiva a ser julgada de acordo com a LO/TCDF.\nDeterminado auditor do TCDF tomou posse no cargo em fevereiro de 2010 e, em julho de 2013, foi indiciado criminalmente por suspeita de corrupção passiva. Nessa situação, o auditor somente perderá o cargo após o trânsito em julgado de sentença judicial condenatória.","r":"O gabarito é Certo[cite: 2]. Pela narrativa, entre a posse (2010) e o indiciamento (2013), transcorreram mais de dois anos. O art. 75 da Lei Complementar distrital nº 01/1994 assegura expressamente que \"O Auditor, após dois anos de exercício, só perderá o cargo por sentença judicial transitada em julgado\"[cite: 1]. A proteção atinge a estabilidade plena neste cenário temporal[cite: 1].","rf":"O Auditor-Substituto consolida sua estabilidade assecuratória (perda só por sentença judicial final) exatos 2 anos após entrar em efetivo exercício.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":141,"bc":"CEBRASPE, Analista de Administração Pública (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2014 (1 questão)","an":[2014],"ar":2014,"q":"141) O item abaixo, é apresentada uma situação hipotética, seguida de uma assertiva a ser julgada de acordo com a LO/TCDF.\nUm auditor do TCDF foi convocado pelo presidente do órgão para substituir determinado conselheiro afastado do cargo em razão de licença médica, por período superior a trinta dias. Nessa situação, o auditor terá as mesmas garantias, prerrogativas e impedimentos do titular do cargo de conselheiro e, no exercício das demais atribuições da judicatura, as de juiz de direito da justiça do DF e dos territórios.","r":"O gabarito é Certo[cite: 2]. A redação reflete ips litteris o comando normativo insculpido no art. 63, § 3º, da LO/TCDF[cite: 1]. O substituto encarna as prerrogativas de Conselheiro durante a interinidade; quando atuando em suas atribuições normais da judicatura (presidindo a instrução de processos), equipara-se à figura do Juiz de Direito da Justiça do Distrito Federal e Territórios[cite: 1].","rf":"No exercício normal (fora da substituição), o Auditor do TCDF equipara-se a Juiz de Direito do TJDFT; em substituição, equipara-se a Conselheiro.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":142,"bc":"CEBRASPE, Analista de Administração Pública (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2014 (2 questões)","an":[2014],"ar":2014,"q":"142) O item abaixo, é apresentada uma situação hipotética, seguida de uma assertiva a ser julgada de acordo com a LO/TCDF.\nServidor do serviço auxiliar do TCDF, após sentença judicial transitada em julgado em que lhe foi reconhecido o direito a determinada vantagem de caráter pessoal, passou a perceber, mensalmente, a título de remuneração, valores, em espécie, superiores aos de um conselheiro do tribunal. Nessa situação, o referido servidor não ficará restrito ao teto remuneratório do tribunal, podendo os citados valores ser acrescidos à sua remuneração, por corresponderem a vantagem de caráter pessoal.","r":"O gabarito é Certo[cite: 2]. O art. 81, parágrafo único, da LO/TCDF determina expressamente a exclusão do teto remuneratório no caso de \"vantagens de caráter pessoal de qualquer natureza\"[cite: 1]. Portanto, se a ultrapassagem do limite pecuniário originar-se dessa rubrica (p. ex., incorporação via sentença judicial), a extrapolação do subsídio do Conselheiro é lícita perante o Estatuto do Órgão[cite: 1].","rf":"Rubricas provenientes de vantagem de caráter pessoal são blindadas contra o abate-teto na folha de pagamento do TCDF.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":143,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2014 (1 questão)","an":[2014],"ar":2014,"q":"143) Julgue o item subsequente relativo à LO/TCDF.\nOs conselheiros do TCDF serão processados e julgados, em caso de cometimento de crime comum, pelo Tribunal de Justiça do Distrito Federal e dos Territórios e, em caso de crime de responsabilidade, pela CLDF.","r":"O gabarito é Errado[cite: 2]. A competência fixada no art. 70, § 3º, destitui a CLDF e o TJDFT dessas atribuições. Os Conselheiros do TCDF gozam de foro originário perante o Superior Tribunal de Justiça (STJ) tanto nas hipóteses de crime comum quanto em infrações tipificadas como crime de responsabilidade[cite: 1].","rf":"TJDFT e Câmara Legislativa não detêm competência para julgar Conselheiros do TCDF criminalmente (o foro é o STJ).","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":144,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2014 (1 questão)","an":[2014],"ar":2014,"q":"144) Ainda com relação à LO/TCDF, julgue o item subsecutivo.\nCaso, no TCDF, um servidor do serviço auxiliar com mais de trinta anos de serviço público e que perceba mensalmente remuneração menor que a de um conselheiro passe a perceber certas vantagens pecuniárias de caráter pessoal, e, com isso, sua remuneração ultrapasse a do conselheiro, a nova remuneração poderá ser maior que a do conselheiro, pois as vantagens pecuniárias de caráter pessoal estão excluídas do teto remuneratório.","r":"O gabarito é Certo[cite: 2]. A questão reitera a tese central do art. 81, parágrafo único, da Lei Orgânica, sendo pacífico que as vantagens pecuniárias de caráter pessoal não compõem a base de cálculo para a trava do teto remuneratório do TCDF (remuneração em espécie recebida por Conselheiro)[cite: 1]. O servidor perceberá a totalidade da verba incorporada sem cortes[cite: 1].","rf":"As parcelas de cunho pessoal são pagas extrateto, não sofrendo corte sequer se o somatório exceder a remuneração do Conselheiro.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":145,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2014 (1 questão)","an":[2014],"ar":2014,"q":"145) Ainda com relação à LO/TCDF, julgue o item subsecutivo.\nPor deliberação do seu presidente, em resolução, o TCDF poderá ser dividido em câmaras por tratar-se de assunto de sua competência exclusiva.","r":"O gabarito é Errado[cite: 2]. A divisão do Tribunal de Contas em Câmaras de julgamento não é uma decisão unilateral ou exclusiva do seu Presidente[cite: 1]. Segundo a literalidade do art. 66 da Lei Orgânica do TCDF, o Tribunal poderá dividir-se em Câmaras mediante deliberação da \"maioria absoluta de seus membros titulares\"[cite: 1].","rf":"A divisão do TCDF em Câmaras exige aprovação por maioria absoluta do Plenário (titulares), não podendo ser ato isolado do Presidente.","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":146,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2014 (1 questão)","an":[2014],"ar":2014,"q":"146) Ainda com relação à LO/TCDF, julgue o item subsecutivo.\nSe os cargos de presidente e vice-presidente do TCDF ficarem vagos noventa dias antes do término do mandato e dois de seus conselheiros titulares estiverem ausentes, um por estar em gozo de férias e o outro por estar em licença, será facultado a esses conselheiros participar das eleições para os cargos vagos.","r":"O gabarito é Certo[cite: 2]. Há dois pontos validados pela LO/TCDF: 1) Como a vacância ocorreu faltando 90 dias (prazo superior à trava dos últimos 60 dias do art. 67, § 5º), deverá haver nova eleição[cite: 1]. 2) O art. 67, § 8º, garante expressamente que SOMENTE os Conselheiros titulares, *ainda que em gozo de licença ou férias*, poderão tomar parte nas eleições[cite: 1].","rf":"Conselheiros titulares em licença ou férias mantêm a prerrogativa (direito) de participar das eleições da Mesa Diretora do TCDF.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":147,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2014 (1 questão)","an":[2014],"ar":2014,"q":"147) Ainda com relação à LO/TCDF, julgue o item subsecutivo.\nA movimentação de crédito orçamentário destinado ao funcionamento do TCDF compete ao seu presidente, que poderá delegar esse ato, inadmitida a subdelegação.","r":"O gabarito é Certo[cite: 2]. O enunciado traduz com exatidão os arts. 68, inciso IV e seu Parágrafo Único da Lei Orgânica[cite: 1]. A competência para movimentar as dotações e créditos orçamentários do Tribunal é originalmente do Presidente, que pode delegar tal atribuição (por exemplo, a Diretores), sendo expressamente proibida a subdelegação do ato[cite: 1].","rf":"A movimentação orçamentária no TCDF é delegável pelo Presidente, mas sua subdelegação é proibida pela Lei Orgânica.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":148,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2014 (1 questão)","an":[2014],"ar":2014,"q":"148) Ainda com relação à LO/TCDF, julgue o item subsecutivo.\nA competência para nomear cidadão aprovado em concurso de provas e títulos para o cargo de auditor do TCDF é do próprio presidente do tribunal.","r":"O gabarito é Errado[cite: 2]. O provimento do cargo de Auditor (Conselheiro-Substituto) do TCDF não é feito pelo Presidente do Tribunal[cite: 1]. De acordo com o art. 74 da LO/TCDF, os Auditores, em número de três, são expressamente \"nomeados pelo Governador do Distrito Federal\" após aprovação em concurso público de provas e títulos[cite: 1]. O Presidente do TCDF apenas dá posse aos nomeados (Art. 68, II)[cite: 1].","rf":"Auditores (Conselheiros-Substitutos) do TCDF são nomeados pelo Governador do DF (ato complexo), e não pelo Presidente da Corte.","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":149,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2014 (1 questão)","an":[2014],"ar":2014,"q":"149) No que se refere aos controles parlamentar, administrativo e judicial, julgue o item.\nAo auditor do TCDF que atue em substituição a conselheiros caberão as mesmas garantias, prerrogativas e impedimentos dos desembargadores do Tribunal de Justiça do Distrito Federal e dos Territórios.","r":"O gabarito é Certo[cite: 2]. A conclusão atende à via interpretativa lógica do regramento: o art. 63, § 3º, determina que o Auditor, *quando em substituição*, tem as mesmas prerrogativas e garantias do Conselheiro Titular[cite: 1]. E o art. 71 crava que os Conselheiros Titulares gozam das mesmas garantias e prerrogativas dos Desembargadores do TJDFT[cite: 1]. Consequentemente, a afirmativa reflete essa extensão.","rf":"Por extensão legal, se o Conselheiro tem garantias de Desembargador, o Auditor em substituição herda transitoriamente essas mesmas prerrogativas.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":150,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"baixa","td":"→ Estável","fr":"2013 (1 questão)","an":[2013],"ar":2013,"q":"150) Julgue o próximo item, que versa sobre o MP, o TCDF e o TCU.\nO conselheiro do TCDF, à semelhança do que ocorre com o procurador-geral do DF, é indicado pelo presidente da República, e sua indicação deve ser aprovada pela CLDF, em votação secreta, após arguição pública.","r":"O gabarito é Errado[cite: 2]. Os Conselheiros do Tribunal de Contas do DF não sofrem qualquer interferência ou indicação por parte do Presidente da República[cite: 1]. As 7 vagas seguem competências estaduais/distritais (Art. 70), sendo preenchidas diretamente pela Câmara Legislativa (5 vagas) ou pelo Governador do DF com posterior aprovação da CLDF (2 vagas)[cite: 1].","rf":"A indicação para as vagas do TCDF cabe à Câmara Legislativa (CLDF) e ao Governador do Distrito Federal (GDF), sem participação do Presidente da República.","g":"Errado","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"},{"n":151,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2012 (1 questão)","an":[2012],"ar":2012,"q":"151) Julgue o próximo item, acerca da jurisdição e da Lei Orgânica do TCDF.\nO presidente do TCDF é designado pelo governador do DF, a partir de lista tríplice enviada pela CLDF, formada por auditores externos do TCDF ou profissionais de reconhecido conhecimento na área de administração pública, contabilidade ou direito.","r":"O gabarito é Errado[cite: 2]. O Poder Executivo (Governador) não tem nenhuma gerência na escolha da Mesa Diretora da Corte de Contas[cite: 1]. O art. 67 preceitua claramente que os próprios Conselheiros do TCDF elegem internamente, entre os titulares do órgão, o Presidente e o Vice-Presidente para mandato de 2 anos, garantindo a autonomia orgânica da Instituição[cite: 1].","rf":"O TCDF elege seu próprio Presidente em votação interna entre seus Conselheiros (autonomia institucional).","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":152,"bc":"CEBRASPE, Consultor Técnico Legislativo (CLDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2006 (1 questão)","an":[2006],"ar":2006,"q":"152) Com referência ao controle e à auditoria governamentais, julgue o item que se segue.\nA CLDF escolhe a maioria dos conselheiros do TCDF e aprova, ou não, os conselheiros indicados pelo governador.","r":"O gabarito é Certo[cite: 2]. A afirmativa reflete a mecânica de freios e contrapesos na composição do TCDF estabelecida na Constituição e replicada no art. 70 da sua LO[cite: 1]. A Câmara Legislativa (CLDF) detém o domínio sobre a maioria das vagas (quer pelo texto original da LO, quer pelo modelo constitucional STF) e deve, ademais, realizar a aprovação prévia das indicações formuladas pelo Governador para as vagas reservadas ao Poder Executivo[cite: 1].","rf":"O Legislativo escolhe a maior parte dos Conselheiros e tem poder de sabatina/aprovação sobre as indicações feitas pelo Executivo.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":153,"bc":"CEBRASPE, Auditor (TCDF)","es":"tematico","ft":"Mista (Interna + Jurisprudência STF / Constituição)","nv":"media","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"153) Ao fixar as regras gerais acerca de competência, atribuições, composição e funcionamento do TCU, a Constituição da República definiu os parâmetros a serem seguidos pelos tribunais de contas dos estados e municípios. Considerando a jurisprudência do STF referente aos tribunais de contas e em particular ao TCDF, julgue o item a seguir.\nO TCDF compõe-se de sete conselheiros, que deverão atender às exigências fixadas na Lei Orgânica do Tribunal. Quatro conselheiros são escolhidos pela Câmara Legislativa e três, pelo governador. No caso dos conselheiros a serem escolhidos pelo governador, um será de sua livre escolha, um será escolhido entre os auditores e um entre os representantes do Ministério Público que atuam junto ao TCDF.","r":"O gabarito é Certo[cite: 2]. O enunciado expressamente cita o modelo de simetria fixado pela jurisprudência do Supremo Tribunal Federal (Súmula 653 e ADI 346), que impôs aos estados (e ao DF) o paralelismo exato com o TCU. Dessa forma, sobrepõe-se a regra original da LO/TCDF (5-2), consolidando a proporção de 4 vagas para o Legislativo e 3 para o Executivo (sendo destas: 1 livre, 1 para Auditor e 1 para MPTC).","rf":"Pelo modelo de simetria do STF (Constituição Federal), a composição das 7 vagas dos TCEs/TCDF divide-se em: 4 pela CLDF e 3 pelo Governador (1 livre, 1 Auditor, 1 MPTC).","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":154,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"154) A partir da jurisprudência do STF, julgue o item abaixo, referente ao regime jurídico do Ministério Público junto aos tribunais de contas.\nO procurador-geral do Ministério Público junto ao Tribunal de Contas do Distrito Federal (TCDF) deve ser, necessariamente, integrante da carreira, indicado em lista tríplice pelo TCDF.","r":"O gabarito é Errado[cite: 2]. A indicação para a lista tríplice não é elaborada e votada institucionalmente \"pelo TCDF\" (Tribunal/Conselheiros)[cite: 1]. Conforme disposição clara do art. 76-A da Lei Orgânica, a lista tríplice é formada pelos próprios \"integrantes da carreira\" do MPTC-DF, cabendo ao Governador nomear um deles para chefiar a instituição[cite: 1].","rf":"A lista tríplice para o Procurador-Geral do MPTC é votada pelos membros da própria carreira, e não pelos Conselheiros do TCDF.","g":"Errado","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"},{"n":155,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"tematico","ft":"Interna","nv":"media","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"155) A partir da jurisprudência do STF, julgue o item abaixo, referente ao regime jurídico do Ministério Público junto aos tribunais de contas.\nO Ministério Público junto ao TCDF tem garantida a sua participação na composição do Plenário da Corte.","r":"O gabarito é Certo[cite: 2]. O MPTC atua como guarda da lei (custos legis) no bojo do processo de contas, e, portanto, tem assento (participação formal na composição da mesa e voz, não voto) garantido no Plenário do TCDF para exercer as atribuições ministeriais garantidas pela Constituição Federal e pela LO/TCDF (Art. 76)[cite: 1].","rf":"O membro do MP de Contas tem assento e voz obrigatórios nas sessões colegiadas para assegurar a fiscalização da lei.","g":"Certo","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"},{"n":156,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"tematico","ft":"Externa (Constituição Federal)","nv":"baixa","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"156) Acerca do Ministério Público que atua junto ao TCDF (MP/TCDF), julgue o item que se segue.\nCom a posse, passam os procuradores do MP/TCDF a gozar da garantia da vitaliciedade.","r":"O gabarito é Errado[cite: 2]. Aos membros do Ministério Público (inclusive o de Contas) aplicam-se, subsidiariamente, os regramentos gerais da carreira ministerial (Art. 130 da CF). Tais membros adquirem a garantia assecuratória da vitaliciedade apenas após o cumprimento de dois anos de efetivo exercício, e não de imediato com a posse.","rf":"Procuradores do MPTC (assim como Auditores) adquirem a vitaliciedade após 2 anos de efetivo exercício. Somente os Conselheiros a adquirem com a posse.","g":"Errado","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"},{"n":157,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"157) Acerca da composição do TCDF e do regime jurídico dos seus conselheiros e auditores, julgue o item que se segue.\nCaso o conselheiro que tenha sido indicado em vaga de auditor venha a se aposentar, a escolha do novo conselheiro deverá, obrigatoriamente, recair entre os auditores, conforme entendimento firmado pelo STF.","r":"O gabarito é Certo[cite: 2]. É a consagração expressa da teoria da \"cadeira cativa\", amplamente respaldada pela jurisprudência do STF e abordada no material[cite: 1]. A vacância de Conselheiro oriundo de cota vinculada (como as de Auditor e do Ministério Público de Contas) implica a reposição estrita por outro membro originário dos mesmos quadros técnicos[cite: 1].","rf":"A reposição em vaga de Auditor ou Procurador obedece fielmente à origem técnica, confirmando a estabilidade e a representatividade do modelo.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":158,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"tematico","ft":"Mista (Interna + Jurisprudência STF / Constituição)","nv":"media","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"158) Acerca da composição do TCDF e do regime jurídico dos seus conselheiros e auditores, julgue o item que se segue.\nDos sete conselheiros, quatro serão escolhidos pela Câmara Legislativa e três pelo governador. Das três vagas a serem preenchidas mediante escolha do governador, apenas uma será de livre provimento.","r":"O gabarito é Certo[cite: 2]. Apoiado na jurisprudência de simetria do Supremo Tribunal Federal (que afastou o formato original 5/2 da LODF), a composição passa a contar com quatro vagas definidas pelo Legislativo e três indicadas pelo Chefe do Executivo. Dentre as três do Executivo, uma é de livre escolha política, enquanto as outras duas provêm compulsoriamente das carreiras técnicas do TCDF (um Auditor e um membro do MPTC).","rf":"Segundo simetria constitucional, o Executivo (Governador) preenche 3 vagas (1 livre, 1 Auditor, 1 Procurador).","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":159,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"159) Acerca da composição do TCDF e do regime jurídico dos seus conselheiros e auditores, julgue o item que se segue.\nOs conselheiros do TCDF, além de terem as mesmas prerrogativas, vantagens, vencimentos, direitos e impedimentos, deverão seguir a mesma forma de investidura dos desembargadores do Tribunal de Justiça do DF.","r":"O gabarito é Errado[cite: 2]. Apesar de a Lei Orgânica (Art. 71) estatuir a equiparação nos quesitos de vencimentos e garantias entre Conselheiros e Desembargadores do TJDFT, a forma de ingresso e investidura são diametralmente distintas[cite: 1]. A magistratura do TJDFT rege-se por promoção e quinto constitucional, enquanto o TCDF sofre investidura calcada em escolhas políticas pela CLDF e pelo Governador (Art. 70)[cite: 1].","rf":"A equiparação a Desembargador limita-se a garantias e vencimentos, não incidindo sobre a forma de provimento e investidura dos Conselheiros de Contas.","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":160,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"160) Acerca da composição do TCDF e do regime jurídico dos seus conselheiros e auditores, julgue o item que se segue.\nOs auditores do TCDF serão escolhidos em concurso público de provas e títulos e deverão preencher os mesmos requisitos exigidos dos conselheiros.","r":"O gabarito é Certo[cite: 2]. De acordo com o art. 74 da Lei Complementar nº 01/1994 (LO/TCDF), os Auditores, em número de três, são nomeados pelo Governador do Distrito Federal dentre cidadãos que satisfaçam os requisitos exigidos para o cargo de Conselheiro, mediante aprovação prévia em concurso público de provas e títulos[cite: 1].","rf":"Auditores (Conselheiros-Substitutos) exigem aprovação em concurso público de provas e títulos e os mesmos requisitos dos Conselheiros.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":161,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"161) Acerca da composição do TCDF e do regime jurídico dos seus conselheiros e auditores, julgue o item que se segue.\nOs auditores do TCDF, somente quando estiverem atuando em substituição a conselheiros, estarão sujeitos ao mesmo regime jurídico destes últimos.","r":"O gabarito é Certo[cite: 2]. Conforme determina o art. 63, § 3º, da LO/TCDF, o Auditor terá as mesmas garantias, prerrogativas e impedimentos do titular \"quando em substituição a Conselheiro\"[cite: 1]. No exercício de suas demais atribuições normais da judicatura (fora da substituição), ele se equipara a Juiz de Direito da Justiça do Distrito Federal e Territórios, assumindo, portanto, outro referencial jurídico[cite: 1].","rf":"O Auditor herda as garantias e prerrogativas de Conselheiro apenas quando convocado em substituição.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":162,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"tematico","ft":"Externa (Jurisprudência / Doutrina)","nv":"baixa","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"162) A fiscalização contábil, financeira, orçamentária, operacional e patrimonial dos entes da Federação e de suas entidades da administração direta e indireta é exercida pelos órgãos do Poder Legislativo com o auxílio dos tribunais de contas. Considerando especialmente as disposições da Constituição da República e da Lei Orgânica do TCDF, julgue o item a seguir.\nO TCDF, no exercício de suas competências, fornecerá apoio técnico e assessoramento aos órgãos e unidades responsáveis pelo controle interno.","r":"O gabarito é Errado[cite: 2]. O Tribunal de Contas, enquanto órgão de controle externo, julga as contas e fiscaliza os atos da administração de forma independente. Ele não presta \"assessoramento\" ou \"apoio técnico\" prévio ou concomitante aos órgãos de controle interno do jurisdicionado, sob pena de comprometer sua imparcialidade para o posterior julgamento das referidas contas.","rf":"O Tribunal de Contas não presta assessoramento técnico prévio aos jurisdicionados, resguardando sua independência fiscalizatória.","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":163,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"163) A propósito da organização e da composição do TCDF e das prerrogativas de seus membros e tendo em conta, especialmente, as disposições da Constituição da República e da Lei Orgânica desse tribunal, julgue o item seguinte.\nO TCDF é integrado por sete conselheiros e três auditores.","r":"O gabarito é Errado[cite: 2]. A pegadinha reside na composição institucional do órgão julgador. O art. 62 da Lei Orgânica determina expressamente que o TCDF \"compõe-se de sete Conselheiros\"[cite: 1]. Os Auditores (Conselheiros-Substitutos), embora previstos no art. 74 em número de três, não integram a composição constitucional primária da Corte, atuando como magistrados de apoio e substituição[cite: 1].","rf":"O TCDF compõe-se EXCLUSIVAMENTE de 7 Conselheiros. Os Auditores integram a estrutura, mas não a composição basilar do colegiado.","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":164,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"164) A propósito da organização e da composição do TCDF e das prerrogativas de seus membros e tendo em conta, especialmente, as disposições da Constituição da República e da Lei Orgânica desse tribunal, julgue o item seguinte.\nDos conselheiros do TCDF, dois serão escolhidos pelo governador do DF, com aprovação da Câmara Legislativa, sendo um escolhido, alternadamente, entre auditores, membros do Ministério Público junto ao TCDF e advogados inscritos na Ordem dos Advogados do Brasil (OAB).","r":"O gabarito é Errado[cite: 2]. O art. 70, inciso I, da LO/TCDF disciplina a escolha pelo Governador, reservando uma das vagas para escolha alternada \"entre Auditores e membros do Ministério Público junto ao Tribunal de Contas\"[cite: 1]. A inclusão de advogados da OAB na alternância contraria o texto expresso da lei, não existindo vaga cativa para o Quinto Constitucional advocatício em Tribunais de Contas[cite: 1].","rf":"A vaga técnica alternada do Executivo restringe-se a Auditores e membros do MPTC. Não existe cota para OAB no TCDF.","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":165,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"165) A propósito da organização e da composição do TCDF e das prerrogativas de seus membros e tendo em conta, especialmente, as disposições da Constituição da República e da Lei Orgânica desse tribunal, julgue o item seguinte.\nOs auditores serão convocados para substituir conselheiros quando for necessário para efeito de completar quorum, sempre que os titulares comunicarem, ao presidente do tribunal ou da câmara respectiva, a impossibilidade de comparecimento à sessão.","r":"O gabarito é Certo[cite: 2]. O trecho reflete perfeitamente o comando do art. 63, § 1º, da Lei Orgânica[cite: 1]. Uma das hipóteses legais de convocação do Auditor é justamente a necessidade de complementar o quórum de votação sempre que o Conselheiro titular comunicar previamente sua ausência ou impossibilidade de comparecimento à sessão[cite: 1].","rf":"O Auditor substitui o Conselheiro para garantir a presença mínima exigida (quórum) para o funcionamento do Plenário ou das Câmaras.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":166,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2002 (1 questão)","an":[2002],"ar":2002,"q":"166) A propósito da organização e da composição do TCDF e das prerrogativas de seus membros e tendo em conta, especialmente, as disposições da Constituição da República e da Lei Orgânica desse tribunal, julgue o item seguinte.\nConsidere a seguinte situação hipotética.\nComo se tratava de vaga deferida ao Poder Executivo, o governador do DF escolheu, com base no critério da antiguidade, o nome de novo conselheiro oriundo do quadro de auditores do TCDF, tendo a Câmara Legislativa aprovado a escolha, apesar de existir parentesco em primeiro grau entre o escolhido e outro conselheiro.\nNessa situação, a nomeação é legal e, por isso, deve ser mantida.","r":"O gabarito é Errado[cite: 2]. Independentemente de o Auditor ser o mais antigo e ter direito à indicação técnica, a proibição de parentesco insculpida no art. 73 da LO/TCDF é absoluta[cite: 1]. A norma veda expressamente a ocupação simultânea de cargos de Conselheiro por parentes consanguíneos ou afins até o segundo grau, o que atinge diretamente o parentesco de primeiro grau citado no caso[cite: 1].","rf":"Parentes até o 2º grau (ex: pai e filho) jamais podem ocupar simultaneamente cargos de Conselheiro do TCDF, mesmo em vagas cativas.","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":167,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2002 (1 questão), 2014 (1 questão)","an":[2002,2014],"ar":2014,"q":"167) A propósito da organização e da composição do TCDF e das prerrogativas de seus membros e tendo em conta, especialmente, as disposições da Constituição da República e da Lei Orgânica desse tribunal, julgue o item seguinte.\nOs conselheiros do TCDF e seus auditores, estes quando em substituição a conselheiros, terão os mesmos direitos, garantias, prerrogativas, impedimentos, vencimentos e vantagens dos desembargadores do TJDFT.","r":"O gabarito é Errado[cite: 2]. A generalização dos vencimentos invalida o item. O art. 74, § 1º, da Lei Orgânica do TCDF condiciona o recebimento dos mesmos vencimentos e vantagens do titular apenas ao Auditor convocado \"por mais de trinta dias\"[cite: 1]. Assim, o Auditor não herda automaticamente os vencimentos e vantagens pecuniárias nas convocações breves para completar quórum[cite: 1].","rf":"O Auditor substituto tem as mesmas prerrogativas do titular, mas só recebe seus vencimentos integrais se a convocação ultrapassar 30 dias.","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":168,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2024 (1 questão)","an":[2024],"ar":2024,"q":"168) Em relação às sanções e às medidas cautelares aplicáveis pelo TCDF, bem como à sua competência e jurisdição, julgue os itens seguintes, à luz do Regimento Interno do TCDF (Resolução n.º 296/2016) e da Lei Orgânica do TCDF (Lei Complementar distrital n.º 1/1994).\nA jurisdição do TCDF abrange a prática de quaisquer atos de gestão dos representantes do Distrito Federal na assembleia geral das sociedades anônimas de cujo capital o Distrito Federal participe.","r":"O gabarito é Errado[cite: 2]. O controle sobre representantes do DF em empresas estatais não abrange \"quaisquer atos de gestão\"[cite: 1]. O art. 6º, inciso VIII, delimita que a jurisdição do TCDF alcança esses representantes, de forma solidária com os conselheiros de administração/fiscal, estritamente \"pela prática de atos de gestão ruinosa ou liberalidade à custa das respectivas sociedades\"[cite: 1].","rf":"Representantes do DF em sociedades anônimas só respondem no TCDF por atos de gestão ruinosa ou liberalidades, não por qualquer ato.","g":"Errado","t":"CE","tm":"Processo, Fiscalização e Sanções"},{"n":169,"bc":"CEBRASPE, Analista de Administração Pública (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2023 (1 questão)","an":[2023],"ar":2023,"q":"169) À luz da Lei Orgânica do Tribunal de Contas do Distrito Federal - Lei Complementar n.º 1/1994-, julgue o item a seguir.\nA jurisdição do Tribunal de Contas do Distrito Federal abrange os responsáveis por entidades dotadas de personalidade jurídica de direito privado que recebam contribuições e prestem serviço de interesse público ou social.","r":"O gabarito é Certo[cite: 2]. A afirmativa é uma transcrição direta do art. 6º, inciso IV, da LO/TCDF[cite: 1]. A natureza jurídica privada da entidade não a isenta da jurisdição da Corte de Contas, desde que exista o recebimento de contribuições (recursos repassados) e a prestação correlata de serviços de interesse público ou social[cite: 1].","rf":"Entidades privadas que recebem contribuições públicas e prestam serviços de interesse social integram o rol de jurisdicionados do TCDF.","g":"Certo","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":176,"bc":"FCC, Procurador Legislativo (CLDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2018 (1 questão)","an":[2018],"ar":2018,"q":"176) O Tribunal de Contas do Distrito Federal tem sede na cidade de Brasília e jurisdição em todo o território do Distrito Federal. A esse respeito,\na) o Tribunal de Contas tem jurisdição que abrange aqueles que derem causa a perda, extravio ou outra irregularidade de que resulte dano ao Erário, desde que sejam agentes públicos.\nb) o quadro de pessoal do Tribunal de Contas é composto por servidores cedidos, oriundos dos quadros da Câmara Legislativa do Distrito Federal.\nc) a jurisdição do Tribunal de Contas não abrange as pessoas jurídicas de direito privado.\nd) o Tribunal de Contas tem jurisdição que abrange os responsáveis pela aplicação de quaisquer recursos repassados pelo Distrito Federal, mediante convênio, acordo, ajuste ou outros instrumentos congêneres, até o valor do repasse.\ne) o Tribunal de Contas agirá sempre mediante provocação da Câmara Legislativa, do Ministério Público ou das autoridades financeiras e orçamentárias do Distrito Federal ou dos demais órgãos auxiliares, nos casos em que houver indício de irregularidade em qualquer despesa, inclusive naquela decorrente de contrato.","r":"O gabarito é D[cite: 2]. A alternativa correta baseia-se no art. 6º, inciso VI, da Lei Complementar nº 01/1994, que abrange os responsáveis pela aplicação de convênios até o limite do valor repassado[cite: 1]. A alternativa A erra por exigir que sejam agentes públicos (abrange qualquer um); a B erra ao dizer que o quadro é cedido pela CLDF (possui quadro próprio, art. 5º); a C erra pois abrange entes privados; a E erra pois o Tribunal também pode agir \"de ofício\"[cite: 1].","rf":"A jurisdição decorrente de convênios atinge o responsável pela aplicação da verba repassada, limitada estritamente ao valor do repasse.","g":"D","t":"MC","tm":"Serviços Auxiliares e Servidores","alt":[{"letra":"a","texto":"o Tribunal de Contas tem jurisdição que abrange aqueles que derem causa a perda, extravio ou outra irregularidade de que resulte dano ao Erário, desde que sejam agentes públicos."},{"letra":"b","texto":"o quadro de pessoal do Tribunal de Contas é composto por servidores cedidos, oriundos dos quadros da Câmara Legislativa do Distrito Federal."},{"letra":"c","texto":"a jurisdição do Tribunal de Contas não abrange as pessoas jurídicas de direito privado."},{"letra":"d","texto":"o Tribunal de Contas tem jurisdição que abrange os responsáveis pela aplicação de quaisquer recursos repassados pelo Distrito Federal, mediante convênio, acordo, ajuste ou outros instrumentos congêneres, até o valor do repasse."},{"letra":"e","texto":"o Tribunal de Contas agirá sempre mediante provocação da Câmara Legislativa, do Ministério Público ou das autoridades financeiras e orçamentárias do Distrito Federal ou dos demais órgãos auxiliares, nos casos em que houver indício de irregularidade em qualquer despesa, inclusive naquela decorrente de contrato."}]},{"n":177,"bc":"FUNIVERSA, Auditor de Controle Interno (CGDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2014 (1 questão)","an":[2014],"ar":2014,"q":"177) A jurisdição do Tribunal de Contas do Distrito Federal (TCDF) alcança os\na) dirigentes de empresas privadas que recebam recursos do Distrito Federal à conta de contratos de prestação de serviços.\nb) responsáveis por associações que prestem serviços de interesse público ou social com recursos próprios.\nc) sucessores de responsáveis por valores públicos no que exceder o montante do patrimônio transferido.\nd) membros de conselhos fiscais de estatais indicados pelo Governo do Distrito Federal (GDF) que não tiverem formalizado sua discordância em decisão prejudicial aos interesses da empresa.\ne) liquidantes de empresa privada em processo falimentar.","r":"O gabarito é D[cite: 2]. De acordo com o art. 6º, inciso VIII, da LO/TCDF, respondem solidariamente os representantes do poder público juntamente com os membros dos conselhos fiscal e de administração pela prática de atos de gestão ruinosa[cite: 1]. Conselheiros fiscais que não formalizam discordância perante atos ruinosos atraem a responsabilidade solidária. As outras opções erram ao exceder limites patrimoniais (sucessores) ou confundirem receita própria com repasse[cite: 1].","rf":"Membros de Conselhos Fiscais de estatais que não registram formalmente discordância frente a atos de gestão ruinosa submetem-se à jurisdição do TCDF.","g":"D","t":"MC","tm":"Nature
