<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concurso TCDF</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --navy-950:#0b1626;
  --navy-900:#101f35;
  --navy-800:#16294a;
  --navy-700:#1e3660;
  --navy-600:#2a4a80;
  /* superfícies do modo escuro: preto neutro de verdade, não mais azul-marinho */
  --black-950:#08080a;
  --black-900:#131315;
  --black-800:#1a1a1d;
  --paper:#f6f1e4;
  --paper-dim:#ece4d0;
  --paper-line:#d8cba9;
  --ink:#241f16;
  --ink-soft:#544b3a;
  --gold:#b08d3e;
  --gold-bright:#d1ab54;
  --stamp-green:#2f6d4f;
  --stamp-red:#a23a2e;
  --font-display:'Fraunces', serif;
  --font-body:'Source Sans 3', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background:
    radial-gradient(1200px 800px at 15% -10%, #19191c 0%, transparent 60%),
    radial-gradient(900px 700px at 110% 10%, #141416 0%, transparent 55%),
    var(--black-950);
  color:var(--paper);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background .2s;
}

body.theme-light{
  /* tom quente e de baixo contraste (mesma família do papel cor-de-creme do
     conteúdo), pensado pra reduzir cansaço visual em sessões longas de estudo —
     em vez do cinza-azulado frio que destoava do papel */
  background:#f2ecdd;
}
body.theme-light .eyebrow{ color:#8a6d2e; }
body.theme-light .title{ color:#1a1610; }
body.theme-light .subtitle{ color:#5a6472; }
body.theme-light .letterhead{ border-bottom-color:rgba(176,141,62,0.4); }
body.theme-light .snapshot .stat .num{ color:#8a6d2e; }
body.theme-light .snapshot .stat .lbl{ color:#7a8290; }
body.theme-light .seal-mark{ color:#8a6d2e; }
body.theme-light .footer-note{ color:#7a8290; }

::selection{ background:var(--gold); color:var(--navy-950); }

/* ---------- Letterhead ---------- */
.app{
  max-width:1560px;
  margin:0 auto;
  padding:18px 26px 40px;
}

.letterhead{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:24px;
  border-bottom:1px solid rgba(209,171,84,0.35);
  padding-bottom:14px;
  margin-bottom:16px;
  flex-wrap:wrap;
}

.letterhead .seal{
  display:flex;
  align-items:center;
  gap:14px;
}

.seal-mark{
  width:42px; height:42px;
  border-radius:50%;
  border:1.5px solid var(--gold);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display);
  font-size:15px;
  font-weight:600;
  color:var(--gold-bright);
  flex-shrink:0;
  position:relative;
}
.seal-mark::before{
  content:'';
  position:absolute; inset:5px;
  border:1px solid rgba(209,171,84,0.5);
  border-radius:50%;
}

.eyebrow{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gold-bright);
  margin-bottom:2px;
}

h1.title{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(20px,3vw,28px);
  color:var(--paper);
  line-height:1.05;
  letter-spacing:-.01em;
}
.title-count-badge{
  display:inline-block;
  vertical-align:middle;
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:600;
  letter-spacing:.03em;
  color:var(--navy-950);
  background:var(--gold-bright);
  padding:3px 10px;
  border-radius:20px;
  margin-left:6px;
}
body.theme-light .title-count-badge{ color:#3a2c08; }

.subtitle{
  font-size:12px;
  color:#a9b6cc;
  margin-top:3px;
  max-width:46ch;
}

.snapshot{
  display:flex;
  gap:16px;
  font-family:var(--font-mono);
}
.snapshot .stat{ text-align:center; min-width:70px; }
.snapshot .stat .num{
  font-size:18px; font-weight:600; color:var(--gold-bright); line-height:1;
}
.snapshot .stat .lbl{
  font-size:9px; letter-spacing:.04em; text-transform:uppercase; color:#8b98b0; margin-top:3px; white-space:nowrap;
}
.theme-toggle-btn{
  width:38px; height:38px; border-radius:50%;
  border:1px solid rgba(209,171,84,0.4);
  background:rgba(255,255,255,0.04);
  cursor:pointer; font-size:16px;
  display:flex; align-items:center; justify-content:center;
  transition:all .12s;
}
.theme-toggle-btn:hover{ background:rgba(255,255,255,0.1); transform:scale(1.05); }
body.theme-light .theme-toggle-btn{
  background:#fff; border-color:rgba(176,141,62,0.5);
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}
body.theme-light .theme-toggle-btn:hover{ background:#fdf6e8; }

/* ---------- Tabs (dossiê) — tema claro, usadas dentro da sidebar ---------- */
.tabs{
  display:flex;
  gap:2px;
  margin-bottom:22px;
  overflow-x:auto;
}
.tab-btn{
  font-family:var(--font-mono);
  font-size:12.5px;
  letter-spacing:.03em;
  color:var(--ink-soft);
  background:#fff;
  border:1px solid var(--paper-line);
  padding:11px 14px;
  cursor:pointer;
  border-radius:7px;
  white-space:nowrap;
  transition:color .15s, background .15s, border-color .15s;
  position:relative;
  text-align:left;
  width:100%;
}
.tab-btn .n{ color:var(--gold); margin-right:6px; font-weight:700;}
.tab-btn:hover{ border-color:var(--gold); color:var(--ink); }
.tab-btn.active{
  color:#fff;
  background:var(--navy-900);
  border-color:var(--navy-900);
  font-weight:600;
}
.tab-btn.active .n{ color:var(--gold-bright); }
.tab-btn.active .n{ color:var(--stamp-red); }

.panel{
  background:var(--paper);
  color:var(--ink);
  border-radius:0 10px 10px 10px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
  position:relative;
}
.panel::before{
  content:'';
  position:absolute; left:0; top:0; bottom:0; width:5px;
  background:repeating-linear-gradient(180deg, var(--gold) 0 2px, transparent 2px 9px);
  border-radius:0 0 0 10px;
}

.pad{ padding:20px 24px; }
@media (max-width:640px){ .pad{ padding:16px 14px; } }

/* ---------- headings inside panel ---------- */
.section-eyebrow{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--stamp-red);
  margin-bottom:4px;
}
h2.section-title{
  font-family:var(--font-display);
  font-size:19px;
  font-weight:600;
  color:var(--ink);
  margin-bottom:3px;
}
.section-desc{
  color:var(--ink-soft);
  font-size:12.5px;
  max-width:60ch;
  margin-bottom:14px;
  line-height:1.45;
}

/* ---------- buttons ---------- */
.btn{
  font-family:var(--font-body);
  font-weight:600;
  font-size:13.5px;
  border-radius:6px;
  padding:11px 20px;
  border:1px solid transparent;
  cursor:pointer;
  transition:transform .1s, background .15s, border-color .15s;
  display:inline-flex; align-items:center; gap:8px;
}
.btn:active{ transform:scale(0.98); }
.btn-primary{ background:var(--navy-900); color:var(--paper); }
.btn-primary:hover{ background:var(--navy-800); }
.btn-ghost{ background:transparent; border-color:var(--paper-line); color:var(--ink); }
.btn-ghost:hover{ background:var(--paper-dim); }
.btn-gold{ background:var(--gold); color:var(--navy-950); }
.btn-gold:hover{ background:var(--gold-bright); }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn-sm{ padding:7px 13px; font-size:12px; border-radius:5px; }

/* ---------- setup form (simulado) ---------- */
.setup-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
  margin-bottom:24px;
}
.field label{
  display:block;
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin-bottom:8px;
}
.chip-row{ display:flex; flex-wrap:wrap; gap:7px; }
.chip{
  font-size:12.5px;
  padding:7px 12px;
  border-radius:20px;
  border:1px solid var(--paper-line);
  background:#fff;
  cursor:pointer;
  color:var(--ink-soft);
  transition:all .12s;
  user-select:none;
}
.chip:hover{ border-color:var(--gold); }
.chip.selected{
  background:var(--navy-900);
  border-color:var(--navy-900);
  color:var(--paper);
}
.qty-control{
  display:flex; align-items:center; gap:10px;
  background:#fff; border:1px solid var(--paper-line); border-radius:8px;
  padding:6px 10px; width:fit-content;
}
.qty-control button{
  width:26px; height:26px; border-radius:5px; border:1px solid var(--paper-line);
  background:var(--paper); cursor:pointer; font-size:14px; color:var(--ink);
}
.qty-control .val{
  font-family:var(--font-mono); font-weight:600; width:44px; text-align:center;
  border:none; background:none; color:inherit; -moz-appearance:textfield;
}
.qty-control .val::-webkit-outer-spin-button,
.qty-control .val::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.qty-control .val:focus{ outline:none; }

/* ---------- question card ---------- */
.case-file{
  background:#fff;
  border:1px solid var(--paper-line);
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 1px 0 rgba(0,0,0,0.02);
}
.case-header{
  display:flex; flex-direction:column; gap:8px;
  padding:16px 20px;
  background:var(--paper-dim);
  border-bottom:1px solid var(--paper-line);
}
.q-number-row{
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
}
.q-meta-inline{
  font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--ink);
}
.q-historico-badge{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-soft);
  background:var(--paper-dim); border:1px solid var(--paper-line); border-radius:12px;
  padding:3px 9px;
}
.q-tema-line{
  font-family:var(--font-mono); font-size:12px; letter-spacing:.04em; text-transform:uppercase;
  color:#7a5a9c; font-weight:600;
}
.tag-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.nivel-badge{
  font-family:var(--font-mono);
  font-size:14px; font-weight:700; letter-spacing:.03em; line-height:1;
  padding:5px 12px; border-radius:6px; color:#fff;
}
.nivel-badge.baixa{ background:#4c7a5c; }
.nivel-badge.media{ background:#a37a2c; }
.nivel-badge.alta{ background:var(--stamp-red); }
.freq-badge, .prob-badge{
  font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft);
  padding:5px 10px; border-radius:6px; border:1px solid var(--paper-line); background:#fff;
  max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.trend-badge{
  font-family:var(--font-mono);
  font-size:14px;
  font-weight:700;
  letter-spacing:.03em;
  padding:5px 12px;
  border-radius:6px;
  color:#fff;
}
.trend-badge.crescente{ background:var(--stamp-red); }
.trend-badge.decrescente{ background:var(--stamp-green); }
.trend-badge.estavel{ background:#8a8578; }
.tag{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.04em;
  text-transform:uppercase;
  padding:3px 9px;
  border-radius:20px;
  border:1px solid currentColor;
}
.tag-literal{ color:#3a6b8c; }
.tag-tematico{ color:#7a5a9c; }
.tag-fora{ color:#9c5a5a; }
.tag-alta{ color:var(--stamp-red); }
.tag-media{ color:#a37a2c; }
.tag-baixa{ color:#4c7a5c; }
.tag-crescente{ color:var(--stamp-red); }
.tag-estavel{ color:var(--ink-soft); }
.tag-decrescente{ color:var(--stamp-green); }
.tag-alerta{
  background:var(--stamp-red);
  border-color:var(--stamp-red);
  color:#fff;
  font-weight:700;
  animation:alertaPulse 2s ease-in-out infinite;
}
@keyframes alertaPulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(162,58,46,0.4); }
  50%{ box-shadow:0 0 0 4px rgba(162,58,46,0); }
}
.tag-inedita{
  background:#fff3b0;
  border:2px solid #b23a2e;
  color:#7a2418;
  font-weight:700;
  border-radius:6px;
  padding:4px 10px;
}
.case-header.is-inedita{
  border-left:5px solid #b23a2e;
  background:linear-gradient(90deg, rgba(255,243,176,0.35), transparent 60%);
}
.enunciado.is-inedita{
  border-left:5px solid #b23a2e;
  background:#fffbe8;
  padding-left:16px;
}

.case-body{ padding:28px 30px 10px; position:relative; }
.enunciado{
  font-size:13pt;
  line-height:1.7;
  color:#3a2c08;
  white-space:pre-line;
  background:#fffcf3;
  border:1px solid #f0e6c4;
  border-radius:8px;
  padding:16px 18px;
}
.banca{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-bottom:14px;
  font-style:italic;
}
.freq-hist{
  margin-top:14px;
  font-size:12.5px;
  color:var(--ink-soft);
  padding-top:12px;
  border-top:1px dashed var(--paper-line);
}
.freq-hist .lbl-inline{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--gold); margin-right:4px;
}

.answers{ padding:8px 30px 30px; display:flex; flex-direction:column; gap:11px; }
.focus-justificativa{ border-top:1px solid var(--paper-line); padding-top:22px; }
.answer-opt{
  text-align:left;
  padding:16px 19px;
  border:1.5px solid var(--paper-line);
  border-radius:8px;
  background:#fff;
  cursor:pointer;
  font-size:13pt;
  color:#1a1610;
  transition:border-color .12s, background .12s;
  display:flex; gap:12px; align-items:flex-start;
}
.answer-opt:hover{ border-color:var(--gold); }
.answer-opt .letter{
  font-family:var(--font-mono); font-weight:700; letter-spacing:.08em; font-size:10.5px;
  text-transform:uppercase; color:var(--gold);
  flex-shrink:0;
  padding-top:3px;
}
.answer-opt.picked{ border-color:var(--navy-700); background:#eef2f8; }
.answer-opt.correct{ border-color:var(--stamp-green); background:#eef6f0; }
.answer-opt.incorrect{ border-color:var(--stamp-red); background:#fbeeec; }
.answer-opt.nao-escolhida-errada{ text-decoration:line-through; opacity:.55; }
.answer-opt:disabled{ cursor:default; }
.answer-opt.riscado{ opacity:.45; text-decoration:line-through; }
.answer-opt.riscado .letter{ text-decoration:line-through; }

/* ---------- Certo/Errado lado a lado — neutros até serem selecionados ---------- */
.ce-buttons-row{ display:flex; gap:10px; max-width:220px; }
.ce-buttons-row .ce-btn{ flex:1; justify-content:center; text-align:center; padding:10px 12px; }
.ce-btn .letter{ font-size:17px; font-weight:400; }
.ce-btn.ce-certo .letter{ color:#5a8f6f; }
.ce-btn.ce-certo:hover{ border-color:var(--stamp-green); }
.ce-btn.ce-errado .letter{ color:#b4675a; }
.ce-btn.ce-errado:hover{ border-color:var(--stamp-red); }
.ce-btn.picked{ border-width:2.5px; }
.ce-btn.correct{ border-color:var(--stamp-green); background:#dcf0e2; }
.ce-btn.correct .letter{ color:var(--stamp-green); }
.ce-btn.incorrect{ border-color:var(--stamp-red); background:#f7d9d3; }
.ce-btn.incorrect .letter{ color:var(--stamp-red); }
@media (max-width:480px){ .ce-buttons-row{ flex-direction:column; } }

/* ---------- layout de duas colunas: questão à esquerda, resolução à direita ---------- */
.case-columns{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:0;
  align-items:stretch;
}
/* antes de responder, a questão ocupa a janela inteira (sem dividir com a resolução) */
.case-columns.nao-revelado{ grid-template-columns: 1fr; }
.case-columns.nao-revelado .case-col-right{ display:none; }
.case-col-left{ min-width:0; border-right:1px solid var(--paper-line); background:#fff; }
.case-columns.nao-revelado .case-col-left{ border-right:none; }
.case-col-right{
  min-width:0;
  padding:30px 32px;
  background:#fff;
}
@media (max-width:820px){
  .case-columns{ grid-template-columns:1fr; }
  .case-col-left{ border-right:none; border-bottom:1px solid var(--paper-line); }
}
.resolucao-placeholder{
  height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:40px 24px;
  color:var(--ink-soft);
}
.resolucao-placeholder .glyph{ font-size:30px; margin-bottom:12px; opacity:.6; }
.resolucao-placeholder p{ font-size:13.5px; max-width:30ch; }

/* ---------- barra de paginação numerada ---------- */
.paginacao-toggle{
  width:100%; text-align:left; padding:10px 28px;
  background:var(--paper-dim); border:none; border-top:1px solid var(--paper-line);
  font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft);
  cursor:pointer;
}
.paginacao-toggle:hover{ color:var(--ink); }
.pagination-strip{
  display:flex; flex-wrap:wrap; gap:6px;
  padding:14px 28px;
  background:var(--paper-dim);
  border-top:1px solid var(--paper-line);
}
.page-num{
  width:30px; height:30px;
  border-radius:6px;
  border:1px solid var(--paper-line);
  background:#fff;
  color:var(--ink-soft);
  font-family:var(--font-mono);
  font-size:11.5px;
  font-weight:600;
  cursor:pointer;
  transition:all .12s;
}
.page-num:hover{ border-color:var(--gold); color:var(--ink); }
.page-num.page-correct{ background:var(--stamp-green); border-color:var(--stamp-green); color:#fff; }
.page-num.page-incorrect{ background:var(--stamp-red); border-color:var(--stamp-red); color:#fff; }
.page-num.page-current{ outline:2px solid var(--navy-900); outline-offset:1px; }

.answer-feedback{
  font-family:var(--font-mono);
  font-size:12.5px;
  font-weight:600;
  letter-spacing:.04em;
  margin-top:18px;
  margin-bottom:14px;
}
.answer-feedback.correct{ color:var(--stamp-green); }
.answer-feedback.incorrect{ color:var(--stamp-red); }

.resolucao-box{
  padding:20px 22px;
  background:#e8f5ea;
  border:1px solid #bfe0c7;
  border-left:4px solid var(--gold);
  border-radius:0 8px 8px 0;
  font-size:13pt;
  line-height:1.75;
  color:#1a1610;
}
.resolucao-box.tint-correct{ border-left-color:var(--stamp-green); }
.resolucao-box.tint-incorrect{ border-left-color:var(--stamp-red); }
.resolucao-box .lbl{
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin-bottom:8px;
  display:block;
}
.resolucao-box.tint-correct .lbl{ color:var(--stamp-green); }
.resolucao-box.tint-incorrect .lbl{ color:var(--stamp-red); }
.resumo-flash-box{
  margin-top:20px;
  padding:18px 22px;
  background:#fdf6d3;
  border:1px solid #ecdd9c;
  border-left:4px solid var(--gold);
  border-radius:0 8px 8px 0;
  font-size:13pt;
  color:#1a1610;
  line-height:1.75;
}
.resolucao-box p, .resumo-flash-box p, .rf-text p{ margin:0 0 10px; }
.resolucao-box p:last-child, .resumo-flash-box p:last-child, .rf-text p:last-child{ margin-bottom:0; }
.kw-gabarito{ font-weight:700; }
body:not(.theme-light) .kw-gabarito{ color:var(--gold-bright); }
.resumo-flash-box .lbl{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:6px;
  display:block;
}

.progress-bar{
  height:5px; background:var(--paper-dim); border-radius:3px; overflow:hidden; flex:1; min-width:120px;
}
.progress-bar .fill{
  height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-bright)); transition:width .3s;
}

/* ---------- stats ---------- */
.stat-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:16px;
}
.stat-card{
  background:#fff; border:1px solid var(--paper-line); border-radius:9px; padding:12px 14px;
  text-align:center;
}
.stat-card .num{ font-family:var(--font-display); font-size:22px; font-weight:600; color:var(--navy-800); line-height:1; }
.n-certa{ color:var(--stamp-green); }
.n-errada{ color:var(--stamp-red); }
.n-total{ color:#2a5d8f; }
.stat-card .lbl{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin-top:5px; }

.bar-row{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.bar-row .name{ width:150px; font-size:12.5px; color:var(--ink-soft); flex-shrink:0; }
.bar-track{ flex:1; height:10px; background:var(--paper-dim); border-radius:5px; overflow:hidden; }
.bar-fill{ height:100%; border-radius:5px; background:var(--navy-700); }
.bar-row .pct{ font-family:var(--font-mono); font-size:12px; width:70px; text-align:right; color:var(--ink); flex-shrink:0; }

.card-block{
  background:#fff; border:1px solid var(--paper-line); border-radius:9px; padding:15px 17px; margin-bottom:12px;
}
.card-block h3{
  font-family:var(--font-display); font-size:14px; font-weight:600; color:var(--ink); margin-bottom:10px;
}
.tendencia-alerta{
  background:#fdf1de; border:1px solid #edcb96; border-left:4px solid var(--stamp-red);
  border-radius:0 6px 6px 0; padding:10px 14px; font-size:12.5px; color:#5c3a12; margin-bottom:14px;
}
.assunto-analise-row{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px 0; border-bottom:1px solid var(--paper-line);
}
.assunto-analise-row:last-child{ border-bottom:none; }
.assunto-analise-nome{ font-size:13px; font-weight:600; color:var(--ink); flex:0 0 auto; min-width:160px; }
.assunto-analise-nome .cnt{ font-weight:400; color:var(--ink-soft); font-size:11.5px; }
.assunto-analise-incidencia{ display:flex; gap:5px; flex-wrap:wrap; flex:0 0 auto; }
.inc-badge{ font-family:var(--font-mono); font-size:10px; border-radius:10px; padding:2px 7px; font-weight:600; }
.inc-alta{ background:#fbeeec; color:var(--stamp-red); }
.inc-media{ background:#fdf1de; color:#8a6d2e; }
.inc-baixa{ background:#eef6f0; color:var(--stamp-green); }
.assunto-analise-bar{ display:flex; align-items:center; gap:8px; flex:1; min-width:120px; }
.stacked-bar{ flex:1; height:10px; border-radius:5px; overflow:hidden; display:flex; background:var(--paper-dim); }
.stacked-seg{ height:100%; }
.stacked-green{ background:var(--stamp-green); }
.stacked-red{ background:var(--stamp-red); }
.stacked-empty{ background:var(--paper-dim); }
.stacked-pct{ font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); min-width:34px; text-align:right; }
.assunto-analise-score{
  font-family:var(--font-mono); font-weight:700; font-size:13px; color:var(--gold); flex:0 0 auto; min-width:40px; text-align:right;
}

/* ---------- caderno de erros ---------- */
.error-row{
  display:flex; align-items:center; gap:14px;
  padding:14px 16px; border:1px solid var(--paper-line); border-radius:8px; background:#fff;
  margin-bottom:10px; flex-wrap:wrap;
}
.error-row .num{ font-family:var(--font-mono); font-weight:700; color:var(--stamp-red); font-size:13px; width:34px; }
.error-row .summary{ flex:1; min-width:220px; font-size:13px; color:var(--ink); line-height:1.5; }
.error-row .meta{ font-size:11px; color:var(--ink-soft); margin-top:3px; }
.resumo-revisao-item{
  display:flex; gap:12px; align-items:flex-start;
  padding:10px 0; border-bottom:1px solid var(--paper-line);
}
.resumo-revisao-item:last-child{ border-bottom:none; }
.resumo-revisao-item .num{ font-family:var(--font-mono); font-weight:700; color:var(--gold); font-size:12px; width:28px; flex-shrink:0; padding-top:2px; }
.resumo-revisao-item .txt{ flex:1; font-size:13px; line-height:1.6; color:var(--ink); }
.resumo-revisao-item .txt p{ margin:0 0 6px; }
.resumo-revisao-item .txt p:last-child{ margin-bottom:0; }
.empty-state{
  text-align:center; padding:60px 20px; color:var(--ink-soft);
}
.empty-state .glyph{ font-size:38px; margin-bottom:14px; }
.empty-state h3{ font-family:var(--font-display); color:var(--ink); font-size:19px; margin-bottom:8px; }
.empty-state p{ font-size:13px; max-width:38ch; margin:0 auto; }

/* ---------- flashcards ---------- */
.flash-stage{
  display:flex; flex-direction:column; align-items:center; padding:10px 0 26px;
}
.flash-counter{
  font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); margin-bottom:16px; letter-spacing:.05em;
  display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;
}
.flashcard{
  width:100%; max-width:560px; height:300px;
  perspective:1400px;
  cursor:pointer;
}
.flashcard-inner{
  position:relative; width:100%; height:100%;
  transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.2,.8,.3,1);
}
.flashcard.flipped .flashcard-inner{ transform:rotateY(180deg); }
.flashcard-face{
  position:absolute; inset:0;
  backface-visibility:hidden;
  border-radius:14px;
  padding:26px;
  display:flex; flex-direction:column;
  border:1.5px solid var(--paper-line);
  box-shadow:0 18px 40px -18px rgba(0,0,0,0.35);
}
.flashcard-front{
  background:#fff;
  justify-content:center; align-items:center; text-align:center;
}
.flashcard-front .q-text{
  font-size:13pt; line-height:1.6; color:#1a1610; white-space:pre-line;
  max-height:210px; overflow:auto;
}
.flashcard-back{
  background:var(--navy-900); color:var(--paper);
  transform:rotateY(180deg);
  justify-content:flex-start;
}
.flashcard-back .lbl{ font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-bright); margin-bottom:10px; }
.flashcard-back .rf-text{ font-size:13pt; line-height:1.6; }
.flashcard-back .gab-line{ margin-top:auto; padding-top:14px; font-family:var(--font-mono); font-size:12px; color:#a9b6cc; }
.gab-destaque{
  font-weight:800; font-size:14px; letter-spacing:.02em; padding:2px 9px; border-radius:5px;
}
.gab-destaque.gab-certo{ background:#2f6d4f; color:#fff; }
.gab-destaque.gab-errado{ background:var(--stamp-red); color:#fff; }
.gab-destaque.gab-letra{ background:var(--gold); color:var(--navy-950); }
.flip-hint{ font-size:11px; color:var(--ink-soft); margin-top:12px; font-family:var(--font-mono); letter-spacing:.04em;}

.flash-controls{ display:flex; gap:10px; margin-top:20px; }

.review-chip{
  position:absolute; top:14px; right:14px;
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
  padding:3px 9px; border-radius:12px; z-index:2;
}
.review-know{ background:#e2efe6; color:var(--stamp-green); }
.review-study{ background:#f7e6e2; color:var(--stamp-red); }

/* ---------- results screen ---------- */
.results-hero{ text-align:center; padding:20px 10px 30px; }
.results-hero .big{
  font-family:var(--font-display); font-size:56px; font-weight:600; color:var(--navy-800);
}
.results-hero .big span{ font-size:26px; color:var(--ink-soft); }
.results-hero .cap{ font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin-top:6px; }

/* scrollbar */
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:var(--paper-line); border-radius:6px; }
::-webkit-scrollbar-track{ background:transparent; }

.footer-note{
  text-align:center; font-size:11px; color:#5c6a85; margin-top:26px; font-family:var(--font-mono);
}

/* ---------- subject tabs (matéria/assunto) — tema claro ---------- */
.subject-tabs{
  display:flex; gap:6px; flex-wrap:wrap; margin-bottom:0;
}
.subject-tab{
  font-family:var(--font-mono);
  font-size:11.5px;
  letter-spacing:.02em;
  padding:9px 14px;
  border-radius:7px;
  border:1px solid var(--paper-line);
  background:#fff;
  color:var(--ink-soft);
  cursor:pointer;
  transition:all .12s;
  white-space:normal;
  overflow-wrap:break-word;
  word-break:break-word;
  display:flex; align-items:flex-start; justify-content:space-between; gap:8px;
  line-height:1.4;
  max-width:100%;
}
.subject-tab .cnt{ opacity:.7; flex-shrink:0; }
.subject-tab:hover{ border-color:var(--gold); color:var(--ink); }
.subject-tab.active{
  background:var(--gold);
  border-color:var(--gold);
  color:#2a1f08;
  font-weight:700;
}
.materia-tab-btn{ flex-direction:column; align-items:stretch; }
.materia-tab-row1{ display:flex; justify-content:space-between; gap:8px; }
.materia-tab-stats{ font-size:9.5px; opacity:.65; margin-top:4px; letter-spacing:.01em; }
.subject-tab.active .materia-tab-stats{ opacity:.85; }

/* ---------- quiz toolbar (navegação) ---------- */
/* ---------- controle de zoom (tamanho do texto) ---------- */
.zoom-control{
  display:flex; align-items:center; gap:6px;
  padding:6px 8px;
  border-radius:7px;
  border:1px solid var(--paper-line);
  background:var(--paper-dim);
}
.zoom-control button{
  width:26px; height:26px; border-radius:5px; border:1px solid var(--paper-line);
  background:#fff; cursor:pointer; font-size:13px; font-weight:700; color:var(--ink);
  display:flex; align-items:center; justify-content:center;
}
.zoom-control button:hover{ border-color:var(--gold); }
.zoom-control .zoom-pct{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); min-width:34px; text-align:center;
}

/* ---------- contador de simulados por matéria ---------- */
.sim-count-badge{
  font-size:9.5px; color:var(--gold-bright); margin-left:8px; text-transform:none; letter-spacing:normal;
  font-weight:400;
}

/* ---------- modo foco ---------- */
body.focus-mode .app{ padding-top:14px; max-width:1240px; }

.quiz-toolbar{
  display:flex; flex-direction:column; gap:10px;
  padding:14px 24px; gap:10px;
  border-top:1px solid var(--paper-line);
  background:var(--paper-dim);
}
.toolbar-btn-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.toolbar-divider{ width:1px; height:22px; background:var(--paper-line); margin:0 2px; flex-shrink:0; }
.q-jump-label{
  font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); min-width:56px; text-align:center;
}
.toolbar-meta-row{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.icon-btn{
  width:36px; height:36px;
  border-radius:8px;
  border:1.5px solid var(--paper-line);
  background:#fff;
  color:var(--ink);
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .12s;
  flex-shrink:0;
}
.icon-btn-gold{ background:var(--gold); border-color:var(--gold); color:#2a1f08; }
.icon-btn-gold:hover:not(:disabled){ background:var(--gold-bright); border-color:var(--gold-bright); }
.icon-btn:hover:not(:disabled){ border-color:var(--gold); background:#fffdf8; transform:scale(1.04); }
.icon-btn:disabled{ opacity:.3; cursor:not-allowed; }
.kbd-hint{
  font-family:var(--font-mono); font-size:9.5px; color:var(--ink-soft); text-align:center; margin-top:3px;
}
.btn-outline{
  background:#fff; border:1px solid var(--paper-line); color:var(--ink-soft);
  font-family:var(--font-body); font-weight:600; font-size:12px;
  padding:8px 14px; border-radius:6px; cursor:pointer; transition:all .12s;
  display:inline-flex; align-items:center; gap:6px;
}
.btn-outline:hover{ border-color:var(--stamp-red); color:var(--stamp-red); }
.btn-danger{
  background:#fff; border:1px solid #dcb9b3; color:var(--stamp-red);
  font-family:var(--font-body); font-weight:600; font-size:12.5px;
  padding:10px 18px; border-radius:6px; cursor:pointer; transition:all .12s;
}
.btn-danger:hover{ background:#fbeeec; }

/* ---------- upload / importar ---------- */
.upload-zone{
  border:2px dashed var(--paper-line);
  border-radius:12px;
  padding:36px 24px;
  text-align:center;
  background:#fffdf8;
  transition:border-color .15s, background .15s;
  cursor:pointer;
}
.upload-zone:hover, .upload-zone.dragover{ border-color:var(--gold); background:#fbf3e2; }
.upload-zone .glyph{ font-size:34px; margin-bottom:10px; }
.upload-zone h3{ font-family:var(--font-display); font-size:17px; color:var(--ink); margin-bottom:6px; }
.upload-zone p{ font-size:12.5px; color:var(--ink-soft); }
.upload-zone input[type=file]{ display:none; }

.upload-source-row{
  display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;
}
.upload-source-row .side-action-btn{ width:auto; margin-bottom:0; flex:1 1 200px; justify-content:center; }
.upload-source-note{
  font-size:11.5px; color:var(--ink-soft); margin-top:10px; line-height:1.5;
}

.import-field{ margin-bottom:16px; }
.import-field label{
  display:block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px;
}
.import-field input[type=text]{
  width:100%; max-width:420px; padding:10px 13px; border:1px solid var(--paper-line);
  border-radius:7px; font-family:var(--font-body); font-size:13.5px; background:#fff; color:var(--ink);
}
.import-field input[type=text]:focus{ outline:none; border-color:var(--gold); }

.import-log{
  margin-top:20px; padding:16px 18px; border-radius:8px; font-size:13px; line-height:1.6;
}
.import-log.ok{ background:#eef6f0; border:1px solid #bfe0cb; color:#265c40; }
.import-log.err{ background:#fbeeec; border:1px solid #eabdb6; color:var(--stamp-red); }
.import-list{
  margin-top:14px; max-height:220px; overflow-y:auto; border:1px solid var(--paper-line);
  border-radius:8px; background:#fff;
}
.import-list .imp-row{
  padding:9px 14px; font-size:12.5px; border-bottom:1px solid var(--paper-dim); color:var(--ink-soft);
  display:flex; justify-content:space-between; gap:10px;
}
.import-list .imp-row:last-child{ border-bottom:none; }

/* ---------- ações na sidebar: salvar/backup/sincronização (tema claro) ---------- */
.side-action-btn{
  display:flex; align-items:center; gap:8px; width:100%;
  font-family:var(--font-body); font-weight:600; font-size:12.5px;
  padding:11px 14px; border-radius:7px;
  border:1px solid var(--paper-line); background:#fff; color:var(--ink);
  cursor:pointer; margin-bottom:6px; transition:all .12s;
  text-align:left;
}
.side-action-btn:hover{ border-color:var(--gold); background:#fffdf8; }
.side-action-btn.compact{
  padding:7px 11px; font-size:11.5px; margin-bottom:5px;
}
.side-status{
  font-family:var(--font-mono); font-size:11px; margin-top:6px;
}
.side-status.ok{ color:#2f6d4f; }
.side-status.err{ color:var(--stamp-red); }
.side-status.pending{ color:#a37a2c; }
.side-status.detail{ color:var(--ink-soft); font-size:10.5px; margin-top:2px; line-height:1.4; }

.sync-block input[type=text]{
  width:100%;
  font-family:var(--font-mono);
  font-size:12px;
  padding:9px 12px;
  border-radius:6px;
  border:1px solid var(--paper-line);
  background:#fff;
  color:var(--ink);
  margin-bottom:8px;
}
.sync-block.compact input[type=text]{ padding:7px 10px; font-size:11.5px; margin-bottom:6px; }
.sync-block input[type=text]::placeholder{ color:#a89f8c; }
.sync-block input[type=text]:focus{ outline:none; border-color:var(--gold); }
.sync-user-display{
  font-family:var(--font-body); font-weight:700; font-size:14px; color:var(--navy-900);
  margin-bottom:8px; padding:9px 12px; background:#fff; border:1.5px solid var(--gold);
  border-radius:7px;
}
.sync-block.compact .sync-user-display{
  font-size:12.5px; padding:7px 10px; margin-bottom:6px;
}
.side-status.ok{ font-weight:600; }
.import-list .imp-row b{ color:var(--ink); }

/* ---------- layout com sidebar (abas/matérias/configuração à direita) ---------- */
/* ---------- assunto retrátil ---------- */
.assunto-toggle{
  display:flex; align-items:center; justify-content:space-between; width:100%;
  background:none; border:none; cursor:pointer; padding:0;
}
.assunto-atual{ font-family:var(--font-mono); font-size:12px; color:var(--gold); }
.assunto-atual-label{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); margin-top:6px;
}

/* ---------- configurar simulado inline (substitui o painel do candidato) ---------- */
.setup-inline-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(220px, 300px));
  justify-content:start;
  gap:14px;
  margin:18px 0 24px;
  align-items:start;
}
.setup-inline-grid .setup-mini-field{
  background:#fff;
  border:1px solid var(--paper-line);
  border-radius:10px;
  padding:14px 16px;
  margin-bottom:0;
}
.setup-inline-actions{ max-width:360px; }

.app-shell{
  display:grid;
  grid-template-columns: 220px 1fr;
  grid-template-areas: "sidebar main";
  gap:0;
  align-items:start;
}
.main-content{ grid-area:main; min-width:0; }
.main-content .panel{ border-radius:0 0 10px 10px; }
.sidebar{ grid-area:sidebar; display:flex; flex-direction:column; gap:10px; min-width:0; overflow-x:hidden; padding:14px 12px 14px 0; }
.sidebar.compact-side .sidebar-block{ box-shadow:none; border-right:1px solid var(--paper-line); border-radius:0; }
.sidebar.compact-side .sidebar-block::before{ display:none; }
body:not(.theme-light) .sidebar.compact-side .sidebar-block{ border-right-color:rgba(255,255,255,0.14); }

@media (max-width:900px){
  .app-shell{ grid-template-columns:1fr; grid-template-areas:"sidebar" "main"; }
  .sidebar{ padding:14px 0; }
}

.sidebar-block{
  background:var(--paper);
  border-radius:10px;
  box-shadow:0 20px 44px -18px rgba(0,0,0,0.45);
  position:relative;
  overflow:hidden;
}
.sidebar-block::before{
  content:'';
  position:absolute; left:0; top:0; bottom:0; width:4px;
  background:repeating-linear-gradient(180deg, var(--gold) 0 2px, transparent 2px 9px);
}
.sidebar-block .sb-pad{ padding:13px 16px; }
.sidebar-label{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--stamp-red); margin-bottom:10px;
}

/* ---------- modo escuro (padrão, sem body.theme-light): cartões de matéria/navegação/sincronização também ficam escuros ---------- */
body:not(.theme-light) .sidebar-block{
  background:var(--black-800);
}
body:not(.theme-light) .sidebar-block::before{
  background:repeating-linear-gradient(180deg, var(--gold) 0 2px, transparent 2px 9px);
}
body:not(.theme-light) .subject-tab,
body:not(.theme-light) .tab-btn,
body:not(.theme-light) .side-action-btn{
  background:rgba(255,255,255,0.05);
  color:#cbd5e8;
  border-color:rgba(255,255,255,0.14);
}
body:not(.theme-light) .subject-tab:hover,
body:not(.theme-light) .tab-btn:hover,
body:not(.theme-light) .side-action-btn:hover{
  border-color:var(--gold); color:#fff; background:rgba(255,255,255,0.09);
}
body:not(.theme-light) .subject-tab.active,
body:not(.theme-light) .tab-btn.active{
  background:var(--gold); color:#2a1f08;
}
body:not(.theme-light) .sync-block input[type=text]{
  background:rgba(255,255,255,0.07); color:#fff; border-color:rgba(255,255,255,0.18);
}
body:not(.theme-light) .sync-block input[type=text]::placeholder{ color:#8b98b0; }
body:not(.theme-light) .sync-user-display{
  background:rgba(255,255,255,0.08); color:#fff;
}
body:not(.theme-light) .assunto-atual-label{ color:#a9b6cc; }
body:not(.theme-light) .side-status.detail{ color:#8b98b0; }

/* ---------- modo escuro: também cobre o card da questão/simulado ---------- */
body:not(.theme-light) .panel{ background:var(--black-800); }
body:not(.theme-light) .case-file{ background:var(--black-800); }
body:not(.theme-light) .focus-justificativa{ border-top-color:rgba(255,255,255,0.14); }
body:not(.theme-light) .case-header{ background:var(--black-900); border-bottom-color:rgba(255,255,255,0.12); }
body:not(.theme-light) .q-meta-inline{ color:#fff; }
body:not(.theme-light) .q-historico-badge{ background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.16); color:#c9d3e6; }
body:not(.theme-light) .q-tema-line{ color:#b89ae0; }
body:not(.theme-light) .case-col-left{ background:var(--black-800); border-right-color:rgba(255,255,255,0.12); }

/* abas principais na vertical */
.sidebar .tabs{
  flex-direction:column; gap:5px; margin-bottom:0; overflow:visible;
}

/* temas/assuntos/matéria na vertical */
.sidebar .subject-tabs{ flex-direction:column; gap:5px; }
.sidebar .subject-tab{ width:100%; text-align:left; }

.setup-mini-field{ margin-bottom:16px; }
.setup-mini-field label{
  display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--ink-soft); margin-bottom:8px;
}
.setup-mini-field .chip-row{ gap:6px; }
.setup-mini-field .chip{ font-size:11.5px; padding:6px 10px; }
.sidebar .qty-control{ width:100%; justify-content:space-between; }
.sidebar-avail{ font-size:11px; color:var(--ink-soft); margin-top:6px; }
.sidebar .btn-primary{ width:100%; justify-content:center; margin-top:4px; }

/* landing central quando não há simulado ativo */
.landing-hero{ padding:2px 0 4px; }
.landing-hero .big-stats{
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px 0 14px;
}
.landing-cta{
  margin-top:4px; padding:12px 15px; background:var(--paper-dim); border-radius:9px;
  border:1px dashed var(--gold); font-size:12px; color:var(--ink-soft); line-height:1.5;
}
.landing-cta b{ color:var(--ink); }

/* colar texto (fallback de importação) */
.paste-toggle{
  margin-top:16px; font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft);
  background:none; border:none; text-decoration:underline; cursor:pointer; padding:0;
}
.paste-area{ margin-top:12px; }
.paste-area textarea{
  width:100%; min-height:160px; padding:12px 14px; border:1px solid var(--paper-line); border-radius:8px;
  font-family:var(--font-mono); font-size:12px; color:var(--ink); resize:vertical; background:#fff;
}
.paste-area textarea:focus{ outline:none; border-color:var(--gold); }

@media (max-width:560px){
  .letterhead{ flex-direction:column; align-items:flex-start; }
  .snapshot{ gap:14px; }
}
/* ---------- impressão ---------- */
#print-area{ display:none; }
@media print{
  body *{ visibility:hidden; }
  #print-area, #print-area *{ visibility:visible; }
  #print-area{
    display:block; position:absolute; left:0; top:0; width:100%;
    background:#fff; color:#111; padding:20px;
  }
  .print-q{ page-break-inside:avoid; margin-bottom:22px; padding-bottom:16px; border-bottom:1px solid #ccc; }
  .print-q h4{ font-size:14px; margin-bottom:6px; }
  .print-q .print-tags{ font-size:10px; color:#555; margin-bottom:8px; }
  .print-q .print-enun{ font-size:12.5px; line-height:1.5; white-space:pre-line; margin-bottom:8px; }
  .print-q .print-gab{ font-size:11.5px; font-weight:700; margin-bottom:4px; }
  .print-q .print-res{ font-size:11px; line-height:1.45; color:#333; }
  .print-header{ margin-bottom:20px; border-bottom:2px solid #333; padding-bottom:10px; }
  .print-header h2{ font-size:18px; }
  .print-header p{ font-size:11px; color:#555; }
}

<script>
const CONFIG = {"sealText": "TC", "eyebrow": "Tribunal de Contas do Distrito Federal", "title": "Plataforma de Questões", "footer": "PROCESSO Nº LO-TCDF/2026 · MATERIAL DE ESTUDO PRIVADO", "materiaPadrao": "Lei Orgânica do TCDF"};
const QUESTIONS = [{"n":1,"bc":"IDECAN, Oficial BM (CBM DF)","es":"fora","ft":"Não aplicável — fora do edital","nv":"baixa","td":"→ Estável","fr":"2021 (2 questões), 2023 (1 questão)","an":[2021,2023],"ar":2023,"q":"1) Tendo como base a Constituição Federal de 1988, a Lei nº 8.443/1992 (Lei Orgânica do TCU), a Lei nº 10.180/2001 e as normas de auditoria governamental, analise as afirmativas abaixo sobre o exercício do controle na gestão pública e assinale a alternativa correta.\na) O controle externo, exercido pelo Poder Legislativo com o auxílio dos Tribunais de Contas, possui competência para aplicar sanções administrativas diretamente aos gestores públicos.\nb) O controle interno deve atuar de forma independente do gestor público, com autonomia para sustar atos administrativos considerados ilegais, conforme previsto na Constituição.\nc) O controle externo pode avaliar a legalidade, legitimidade, economicidade e eficiência dos atos administrativos, sendo sua atuação regulamentada pela Constituição e legislação infraconstitucional.\nd) O controle interno é facultativo nos entes subnacionais e sua implantação depende de regulamentação específica por lei estadual ou municipal.","r":"Não aplicável — questão fora do escopo do edital.","rf":"Questão sobre normas federais e TCU, fora do escopo estrito da Lei Orgânica do TCDF.","g":null,"t":"fora_edital","tm":"Fora do Edital"},{"n":2,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"tematico","ft":"Interna","nv":"media","td":"→ Estável","fr":"2014 (1 questão), 2024 (1 questão)","an":[2014,2024],"ar":2024,"q":"2) Julgue o item seguinte, relativos à organização do Distrito Federal e de seus Poderes, de acordo com a Lei Orgânica do Distrito Federal (LODF).\nO TCDF tem competência para dar início ao processo legislativo de lei ordinária que verse sobre a sua organização, não lhe sendo atribuída, contudo, a mesma prerrogativa em relação às leis complementares.","r":"O gabarito é Errado[cite: 2]. O art. 4º, inciso VII, da Lei Complementar nº 01/1994 (LO/TCDF) confere competência exclusiva ao TCDF para elaborar e propor à Câmara Legislativa outros projetos de lei de seu interesse[cite: 1]. O texto normativo não restringe a iniciativa legislativa da Corte apenas a leis ordinárias, abrangendo, portanto, a prerrogativa sobre leis complementares inerentes à sua organização[cite: 1].","rf":"A iniciativa legislativa do TCDF para matérias de seu interesse engloba tanto leis ordinárias quanto complementares.","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":3,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"↑ Crescente","fr":"2021 (1 questão), 2023 (1 questão), 2024 (1 questão)","an":[2021,2023,2024],"ar":2024,"q":"3) Em relação à natureza, competência e jurisdição do TCDF, segundo a sua lei orgânica, julgue o item seguinte.\nO TCDF pode fiscalizar de ofício irregularidade na aplicação de recurso público distrital, independentemente da iniciativa de qualquer órgão ou autoridade.","r":"O gabarito é Certo[cite: 2]. Trata-se da aplicação direta do art. 1º, § 3º, da Lei Orgânica do TCDF[cite: 1]. A legislação estabelece que o Tribunal de Contas agirá de ofício ou mediante iniciativa da Câmara Legislativa, Ministério Público ou autoridades competentes sempre que houver indício de irregularidade em qualquer despesa pública[cite: 1].","rf":"O TCDF tem o poder-dever de instaurar processos de fiscalização de ofício diante de indícios de irregularidades.","g":"Certo","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":4,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2012 (1 questão), 2024 (1 questão)","an":[2012,2024],"ar":2024,"q":"4) Em relação à natureza, competência e jurisdição do TCDF, segundo a sua lei orgânica, julgue o item seguinte.\nCompete ao TCDF julgar as contas do governador do DF e dos demais administradores de valores públicos.","r":"O gabarito é Errado[cite: 2]. O TCDF não julga as contas anuais do Governador do Distrito Federal, limitando-se a apreciá-las, fazer relatório analítico e emitir parecer prévio (Art. 1º, I), ficando o julgamento político a cargo da CLDF[cite: 1]. O julgamento definitivo pelo Tribunal restringe-se às contas dos administradores e demais responsáveis por recursos distritais (Art. 1º, II)[cite: 1].","rf":"O TCDF apenas aprecia (emite parecer) as contas do Governador, enquanto julga as contas dos demais administradores.","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":5,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2014 (1 questão), 2024 (1 questão)","an":[2014,2024],"ar":2024,"q":"5) Em relação à natureza, competência e jurisdição do TCDF, segundo a sua lei orgânica, julgue o item seguinte.\nDiferentemente do que ocorre com os atos de concessão de aposentadoria por tempo de contribuição, os atos de concessão de aposentadoria por invalidez não são registrados pelo TCDF, uma vez que seguem o rito próprio conduzido pela junta médica oficial do órgão.","r":"O gabarito é Errado[cite: 2]. O art. 1º, III, da LO/TCDF dispõe que compete ao Tribunal apreciar para fins de registro a legalidade das concessões iniciais de aposentadorias, reformas e pensões de forma ampla[cite: 1]. A lei não faz qualquer distinção ou ressalva que exclua o registro de aposentadorias por invalidez, sendo estas submetidas ao mesmo escrutínio[cite: 1].","rf":"Atos de aposentadoria sujeitam-se ao registro do TCDF independentemente da modalidade concessória (inclusive por invalidez).","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":6,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"tematico","ft":"Externa (Regimento Interno do TCDF)","nv":"baixa","td":"→ Estável","fr":"2021 (1 questão), 2024 (1 questão)","an":[2021,2024],"ar":2024,"q":"6) Com base na Lei Orgânica do TCDF e no Regimento Interno do TCDF, julgue o item que se seguem.\nA representação formulada pelo membro do MP junto ao TCDF é ordinariamente apreciada pelas câmaras, ressalvando-se a competência do Plenário quando se tratar de representação contra os chefes dos Poderes Executivo e Legislativo ou contra secretário do Distrito Federal.","r":"O gabarito é Errado[cite: 2]. A matéria está detalhada no Regimento Interno do TCDF, que afasta a divisão exclusiva sugerida na assertiva. Em regra, o Plenário exerce a atribuição primordial para apreciar as representações formuladas pelo MPTC-DF quando relativas a indícios de irregularidades de maior vulto ou contra autoridades de alto escalão, não sendo o rito ordinário vinculado preferencialmente às Câmaras como regra absoluta.","rf":"O Regimento Interno estabelece o Plenário como foro principal para deliberações relevantes do MPTC, e não as Câmaras em caráter ordinário exclusivo.","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":7,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"tematico","ft":"Externa (Regimento Interno do TCDF)","nv":"media","td":"↑ Crescente","fr":"2021 (1 questão), 2024 (1 questão)","an":[2021,2024],"ar":2024,"q":"7) Com base na Lei Orgânica do TCDF e no Regimento Interno do TCDF, julgue o item que se seguem.\nÉ atribuição do MP junto ao TCDF intermediar a solicitação da corte de contas à Procuradoria-Geral do Distrito Federal para que esta adote as medidas necessárias ao arresto dos bens dos responsáveis julgados em débito.","r":"O gabarito é Certo[cite: 2]. Trata-se de uma prerrogativa operacional consolidada no Regimento Interno do TCDF. Como guardião da lei e órgão interveniente, o MPTC-DF atua formalmente na intermediação de ofícios e requerimentos da Corte de Contas direcionados à Procuradoria-Geral do Distrito Federal (PGDF) visando o acionamento judicial cautelar para arresto de bens de gestores em débito.","rf":"O MPTC-DF atua como via de conexão oficial entre o TCDF e a PGDF para o bloqueio e arresto de bens de responsáveis.","g":"Certo","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"},{"n":8,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"tematico","ft":"Externa (Regimento Interno do TCDF)","nv":"baixa","td":"→ Estável","fr":"2021 (2 questões), 2024 (1 questão)","an":[2021,2024],"ar":2024,"q":"8) Com base na Lei Orgânica do TCDF e no Regimento Interno do TCDF, julgue o item que se seguem.\nNas sessões ordinárias, o representante do MP junto ao TCDF pode pedir vista do processo durante a fase de discussão, ainda que já tenha se manifestado nos autos.","r":"O gabarito é Certo[cite: 2]. O Regimento Interno assegura expressamente ao Procurador de Contas, na sua atuação presencial nas sessões plenárias e de Câmaras, o direito potestativo de solicitar vista regimental do processo durante a fase de debates e discussões, mesmo que já conste seu parecer prévio nos autos, a fim de reexaminar a matéria.","rf":"A manifestação escrita prévia não impede o membro do MPTC de pedir vista dos autos na sessão de julgamento.","g":"Certo","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":9,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"↑ Crescente","fr":"2023 (1 questão), 2024 (1 questão)","an":[2023,2024],"ar":2024,"q":"9) O Ministério Público de Contas de determinado estado impetrou, perante o STJ, mandado de segurança contra acórdão proferido pelo tribunal de contas do mesmo estado. Na petição inicial, argumentou que o julgamento da corte de contas seria nulo, em razão da participação de dois conselheiros impedidos, cujos votos haviam sido fundamentais para o resultado final do processo.\nConsiderando a situação hipotética apresentada e a jurisprudência dos tribunais superiores, julgue o item a seguir.\nO Ministério Público de Contas tem legitimidade para impetrar mandado de segurança contra acórdão do tribunal de contas junto ao qual atua, quando for constatada manifesta ilegalidade.","r":"O gabarito é Errado[cite: 2]. Conforme assentado pela jurisprudência pacífica do STF, o Ministério Público de Contas não detém capacidade processual nem personalidade jurídica própria para impetrar mandado de segurança perante os Tribunais Superiores contra acórdãos proferidos pela própria Corte de Contas onde atua[cite: 1].","rf":"O MPTC não tem legitimidade ativa (capacidade processual) para impetrar MS contra acórdãos do Tribunal de Contas perante o qual oficia.","g":"Errado","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"},{"n":10,"bc":"CEBRASPE, Analista (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2023 (1 questão)","an":[2023],"ar":2023,"q":"10) À luz da Lei Orgânica do Tribunal de Contas do Distrito Federal - Lei Complementar n.º 1/1994-, julgue o item a seguir.\nO Tribunal de Contas do Distrito Federal tem a responsabilidade de fiscalizar exclusivamente a aplicação de recursos repassados ao Distrito Federal mediante convênio ou acordo.","r":"O gabarito é Errado[cite: 2]. A previsão normativa contida no art. 1º, inciso VII, da Lei Complementar nº 01/1994, estabelece que a competência de fiscalização recai sobre a aplicação de quaisquer recursos repassados AO Distrito Federal, bem como sobre os recursos repassados PELO Distrito Federal a terceiros mediante convênio ou acordo[cite: 1]. A palavra \"exclusivamente\" torna a assertiva restritiva e falsa[cite: 1].","rf":"A jurisdição do TCDF é ampla para acordos/convênios, alcançando recursos que entram e que saem do Distrito Federal.","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":11,"bc":"CEBRASPE, Analista (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2023 (1 questão)","an":[2023],"ar":2023,"q":"11) À luz da Lei Orgânica do Tribunal de Contas do Distrito Federal - Lei Complementar n.º 1/1994-, julgue o item a seguir.\nCompete ao Tribunal de Contas do Distrito Federal realizar, por iniciativa própria, inspeções e auditorias de estimativa, lançamento, arrecadação, recolhimento, parcelamento e renúncia de receitas.","r":"O gabarito é Certo[cite: 2]. Trata-se da cópia exata do texto normativo presente no art. 1º, inciso V, alínea \"a\", da Lei Orgânica do TCDF[cite: 1]. O Tribunal de Contas possui a competência explícita e abrangente para, de ofício ou provocado, realizar auditorias de natureza contábil e financeira focadas em todas as etapas de gestão e renúncia das receitas distritais[cite: 1].","rf":"A gestão da receita pública (do lançamento à renúncia fiscal) também é alvo direto da auditoria ordinária do TCDF.","g":"Certo","t":"CE","tm":"Processo, Fiscalização e Sanções"},{"n":12,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"↑ Crescente","fr":"2021 (1 questão), 2023 (1 questão)","an":[2021,2023],"ar":2023,"q":"12) Acerca das competências do TCDF, julgue o item seguinte, considerando, no que couber, a jurisprudência do STF.\nA Lei Orgânica do TCDF, bem como seu Regimento Interno, confere poder normativo ao TCDF sobre matéria de suas atribuições e sobre a organização dos processos que Ihe devam ser submetidos, entretanto, segundo o STF, essa atribuição normativa dos tribunais de contas inova a ordem jurídica e viola o princípio da legalidade.","r":"O gabarito é Errado[cite: 2]. O art. 3º da LO/TCDF garante o poder de normatizar e expedir instruções processuais no âmbito do Tribunal[cite: 1]. Contrariamente ao afirmado, o Supremo Tribunal Federal (STF) reconhece plenamente a constitucionalidade do poder normativo regulamentar das Cortes de Contas para disciplinar procedimentos operacionais internos, não configurando violação ao princípio da legalidade[cite: 1].","rf":"O STF chancela o poder regulamentar processual e organizacional das Cortes de Contas, rejeitando tese de violação à legalidade.","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":13,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"↑ Crescente","fr":"2023 (1 questão), 2024 (1 questão)","an":[2023,2024],"ar":2024,"q":"13) Em relação às competências do Tribunal de Contas do Distrito Federal (TCDF), julgue o item a seguir, de acordo com a Lei Orgânica do TCDF.\nCompete ao TCDF apreciar, para fins de registro, a legalidade dos atos de admissão dos empregados públicos das empresas estatais do Distrito Federal, bem como a legalidade das respectivas aposentadorias.","r":"O gabarito é Errado[cite: 2]. Embora o TCDF efetivamente aprecie a legalidade dos atos de admissão de empregados de empresas públicas e sociedades de economia mista, os referidos celetistas são vinculados ao Regime Geral de Previdência Social (RGPS/INSS)[cite: 1]. Conforme a teoria sedimentada, o TCDF não ostenta competência para apreciar e registrar as aposentadorias custeadas e concedidas pelo INSS[cite: 1].","rf":"O TCDF avalia os concursos (admissões) de estatais, mas nunca o ato previdenciário (aposentadoria) gerido pelo INSS.","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":14,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2002 (1 questão), 2012 (1 questão), 2023 (1 questão)","an":[2002,2012,2023],"ar":2023,"q":"14) Em relação às competências do Tribunal de Contas do Distrito Federal (TCDF), julgue o item a seguir, de acordo com a Lei Orgânica do TCDF.\nA competência do TCDF pode alcançar pessoas físicas e pessoas jurídicas da iniciativa privada.","r":"O gabarito é Certo[cite: 2]. A jurisdição do TCDF não se limita aos agentes puramente estatais[cite: 1]. Conforme preconiza o art. 6º, inciso IV, da Lei Orgânica, o controle externo abrange e alcança explicitamente os responsáveis por entidades dotadas de personalidade jurídica de direito privado que venham a receber recursos e prestem serviços de interesse público ou social no DF[cite: 1].","rf":"A gestão de verba pública submete entes privados e pessoas físicas à fiscalização do Tribunal de Contas.","g":"Certo","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":15,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2023 (1 questão)","an":[2023],"ar":2023,"q":"15) Em relação às competências do Tribunal de Contas do Distrito Federal (TCDF), julgue o item a seguir, de acordo com a Lei Orgânica do TCDF.\nAo TCDF compete elaborar sua proposta de lei orçamentária e encaminhar o projeto de lei diretamente à Câmara Legislativa do Distrito Federal para apreciação e aprovação.","r":"O gabarito é Errado[cite: 2]. O art. 4º, inciso III, assegura a autonomia do TCDF para elaborar a própria proposta orçamentária; contudo, o envio não ocorre diretamente à Câmara Legislativa[cite: 1]. A lei estabelece que a proposta orçamentária da Corte deve ser remetida ao Poder Executivo (Governador) para ser integrada ao projeto consolidado do orçamento anual do Distrito Federal[cite: 1].","rf":"O orçamento do TCDF não é enviado avulso ao Legislativo; ele integra obrigatoriamente a peça orçamentária do Chefe do Executivo.","g":"Errado","t":"CE","tm":"Controle Externo e Legislação Institucional"},{"n":16,"bc":"CEBRASPE, Procurador (PGDF)","es":"tematico","ft":"Externa (Jurisprudência TCU/STJ)","nv":"media","td":"→ Estável","fr":"2022 (1 questão)","an":[2022],"ar":2022,"q":"16) Julgue o item subsequente, a respeito do direito financeiro e orçamentário.\nCompete ao TCDF o controle da aplicação de recursos federais transferidos ao DF por meio de repasse automático de fundo a fundo destinados ao financiamento de ações e serviços de assistência social e saúde.","r":"O gabarito é Errado[cite: 2]. Segundo a jurisprudência consolidada do Superior Tribunal de Justiça (Súmula 208 do STJ) e do Supremo Tribunal Federal, os recursos repassados pela União aos entes federativos mediante transferência fundo a fundo (ex.: SUS e SUAS) mantêm a natureza de verba federal e estão sujeitos à fiscalização do Tribunal de Contas da União (TCU), e não do TCDF.","rf":"Recursos federais transferidos fundo a fundo (saúde/assistência social) sofrem controle externo do TCU, e não do TCDF.","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":17,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2021 (1 questão)","an":[2021],"ar":2021,"q":"17) Acerca dos sistemas de controle na administração pública brasileira, julgue o item.\nConsidere que, durante a apreciação dos atos de admissão de pessoal de uma entidade pública, o tribunal de contas estadual não tenha analisado as nomeações para os cargos de provimento em comissão. Nessa situação, constitui falha do tribunal de contas deixar de analisar as citadas nomeações.","r":"O gabarito é Errado[cite: 2]. Consoante o art. 1º, inciso III, da LO/TCDF, a apreciação da legalidade para fins de registro dos atos de admissão de pessoal excepciona expressamente as nomeações para cargo de provimento em comissão[cite: 1]. Logo, não analisá-los para fins de registro obrigatório inicial não constitui falha, mas sim cumprimento da ressalva legal[cite: 1].","rf":"Cargos em comissão estão isentos de apreciação para fins de registro pelos Tribunais de Contas.","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":18,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2021 (1 questão)","an":[2021],"ar":2021,"q":"18) Com relação às competências do Tribunal de Contas do Distrito Federal (TCDF) e à fiscalização exercida por esse órgão, julgue o item.\nCompete ao TCDF avaliar a execução das metas previstas no plano plurianual, nas diretrizes orçamentárias e no orçamento anual do governo do Distrito Federal.","r":"O gabarito é Certo[cite: 2]. A assertiva espelha exatamente a literalidade do art. 1º, inciso IV, da Lei Orgânica do TCDF[cite: 1]. É competência do Tribunal avaliar a execução das metas estabelecidas nas peças de planejamento orçamentário do governo (PPA, LDO e LOA)[cite: 1].","rf":"O TCDF possui competência expressa para avaliar a execução das metas previstas no PPA, LDO e LOA.","g":"Certo","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":19,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2021 (1 questão)","an":[2021],"ar":2021,"q":"19) Com base na Lei Orgânica e no Regimento Interno do TCDF, julgue o item a seguir.\nO TCDF, quando acionado judicialmente, é representado em juízo pelo procurador-geral do Distrito Federal, sendo vedada a contratação de serviço técnico profissional para essa finalidade.","r":"O gabarito é Errado[cite: 2]. Embora a regra geral determine que o TCDF seja representado em juízo pelo Procurador-Geral do Distrito Federal, o art. 4º, § 1º, da Lei Complementar nº 01/1994 prevê expressamente a ressalva para a \"eventual necessidade de contratar serviços técnicos profissionais e especializados para tais fins\"[cite: 1].","rf":"A representação judicial do TCDF pela PGDF comporta exceção, sendo permitida a contratação extraordinária de advogados.","g":"Errado","t":"CE","tm":"Ministério Público de Contas (MP/TCDF)"},{"n":20,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2021 (1 questão)","an":[2021],"ar":2021,"q":"20) Acerca de controle externo e legislação institucional, julgue o item seguinte.\nConforme a Lei Orgânica do Tribunal de Contas do Distrito Federal, esse tribunal tem a competência de expedir atos e instruções a respeito de matéria de suas atribuições e da organização dos processos que lhe devam ser submetidos. Assim, o Tribunal de Contas do Distrito Federal pode estabelecer rito próprio para o julgamento de suas próprias contas, estabelecendo, por exemplo, quórum qualificado para a sua aprovação.","r":"O gabarito é Errado[cite: 2]. O TCDF não julga as suas próprias contas[cite: 1]. A prestação de contas do próprio TCDF é submetida ao controle externo exercido diretamente pelo Poder Legislativo (CLDF), tornando incabível o uso do poder normativo da Corte de Contas para estabelecer rito de julgamento sobre matéria que foge à sua competência[cite: 1].","rf":"O TCDF não julga suas próprias contas; elas são julgadas diretamente pela Câmara Legislativa do DF (CLDF).","g":"Errado","t":"CE","tm":"Controle Externo e Legislação Institucional"},{"n":21,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2021 (1 questão)","an":[2021],"ar":2021,"q":"21) Acerca de controle externo e legislação institucional, julgue o item a seguir.\nO TCDF pode, tanto por iniciativa própria quanto pela Câmara Legislativa do Distrito Federal, realizar, em órgão do GDF, auditoria operacional para verificar procedimentos de licenciamento ambiental e a sua fiscalização.","r":"O gabarito é Certo[cite: 2]. O art. 1º, V, da LO/TCDF estabelece a competência do Tribunal para realizar, por iniciativa própria ou da CLDF, inspeções e auditorias de natureza contábil, financeira, orçamentária, operacional e patrimonial nas unidades administrativas do Poder Executivo[cite: 1]. Assim, inclui-se plenamente a auditoria operacional de caráter ambiental.","rf":"O TCDF pode atuar de ofício ou provocado pela CLDF para realizar auditorias operacionais em qualquer órgão do GDF.","g":"Certo","t":"CE","tm":"Controle Externo e Legislação Institucional"},{"n":22,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2021 (1 questão)","an":[2021],"ar":2021,"q":"22) Acerca de controle externo e legislação institucional, julgue o item a seguir.\nCaso o TCDF, em auditoria realizada em órgão do GDF, constate ilegalidade em contrato administrativo celebrado pelo seu administrador, eventual sustação do contrato poderá ser realizada pela Câmara Legislativa do Distrito Federal, mas não pelo próprio TCDF.","r":"O gabarito é Certo[cite: 2]. O TCDF não tem poder para sustar diretamente contratos administrativos de plano; ele assina prazo para correção e, se inatendido, comunica o fato à CLDF[cite: 1]. Compete privativamente à Câmara Legislativa do Distrito Federal o ato imediato de sustação do contrato (Art. 1º, XI, interpretado em consonância com o modelo constitucional)[cite: 1]. O TCDF só agirá na omissão de 90 dias da CLDF[cite: 1].","rf":"Contratos administrativos não são sustados de imediato pelo TCDF; a competência primária de sustação de contrato é do Legislativo.","g":"Certo","t":"CE","tm":"Controle Externo e Legislação Institucional"},{"n":23,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"tematico","ft":"Externa (Regimento Interno do TCDF)","nv":"baixa","td":"→ Estável","fr":"2021 (1 questão)","an":[2021],"ar":2021,"q":"23) Acerca de direto processual de contas, julgue o item a seguir.\nCabe ao TCDF apreciar, por meio de parecer prévio, as contas anualmente prestadas pelo governador do Distrito Federal, devendo o relator das contas ser definido por meio de rodízio entre os conselheiros efetivos e substitutos, aplicando-se o critério da ordem decrescente de antiguidade.","r":"O gabarito é Errado[cite: 2]. De acordo com as disposições regimentalmente fixadas no TCDF, o rodízio para a relatoria das contas anuais do Governador do Distrito Federal não se aplica indistintamente a Conselheiros e Auditores (Conselheiros-Substitutos). O encargo recai exclusivamente entre os Conselheiros Titulares, excluindo-se os Substitutos dessa fila específica.","rf":"A relatoria das contas do Governador é incumbência restrita aos Conselheiros Titulares mediante rodízio regimental.","g":"Errado","t":"CE","tm":"Processo, Fiscalização e Sanções"},{"n":24,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"tematico","ft":"Externa (Jurisprudência do STF)","nv":"alta","td":"→ Estável","fr":"2021 (1 questão)","an":[2021],"ar":2021,"q":"24) Acerca de direto processual de contas, julgue o item a seguir.\nEm razão do princípio da segurança jurídica, de acordo com o STF, os tribunais de contas devem apreciar a legalidade dos atos de aposentadoria, reforma ou pensão no prazo de cinco anos a contar da data da concessão do benefício.","r":"O gabarito é Errado[cite: 2]. A jurisprudência vinculante do STF (Tema 445 / RE 636.553) fixou o entendimento de que os Tribunais de Contas têm o prazo decadencial de 5 (cinco) anos para apreciar os atos de aposentadoria, reforma ou pensão, porém esse prazo não é contado da data da concessão, mas sim da *data da chegada (recebimento)* do processo à Corte de Contas.","rf":"O prazo de 5 anos para o TC registrar atos de aposentadoria é contado da chegada do processo ao Tribunal, não da concessão inicial.","g":"Errado","t":"CE","tm":"Processo, Fiscalização e Sanções"},{"n":25,"bc":"CEBRASPE, Procurador do Ministério Público de Contas (TCDF)","es":"tematico","ft":"Externa (Jurisprudência)","nv":"media","td":"→ Estável","fr":"2021 (1 questão)","an":[2021],"ar":2021,"q":"25) Acerca de direto processual de contas, julgue o item a seguir.\nAs medidas cautelares que o TCDF pode adotar incluem a decretação de indisponibilidade de bens, o afastamento temporário de responsável e a decretação de arresto de bens.","r":"O gabarito é Errado[cite: 2]. Embora o TCDF tenha amplos poderes cautelares, ele não possui competência jurisdicional para determinar o *arresto de bens* de forma direta e autônoma. Consoante o modelo brasileiro, a decretação de arresto de bens depende de decisão do Poder Judiciário, devendo o Tribunal de Contas solicitar à respectiva Procuradoria (PGDF) que promova as medidas judiciais cabíveis.","rf":"O Tribunal de Contas não pode decretar diretamente o arresto de bens, dependendo de provocação ao Poder Judiciário para isso.","g":"Errado","t":"CE","tm":"Processo, Fiscalização e Sanções"},{"n":26,"bc":"CEBRASPE, Auditor (Conselheiro-Substituto - TCDF)","es":"tematico","ft":"Externa (Constituição Federal / Jurisprudência STF)","nv":"alta","td":"→ Estável","fr":"2021 (1 questão)","an":[2021],"ar":2021,"q":"26) Acerca das funções e competências dos tribunais de contas no Brasil, julgue o item a seguir.\nConsidere que determinado gestor público tenha sido multado por tribunal de contas. Nessa situação, como a decisão tem eficácia de título executivo extrajudicial, o próprio tribunal de contas poderá realizar a ação de execução contra o referido gestor.","r":"O gabarito é Errado[cite: 2]. Por expressa determinação constitucional e entendimento do STF, os Tribunais de Contas não possuem capacidade postulatória e personalidade jurídica para executar os seus próprios julgados. A decisão de imputação de débito ou multa, que possui eficácia de título executivo, deve ser encaminhada ao ente beneficiário (via Procuradoria do Estado/DF) para que proceda à execução fiscal no Judiciário.","rf":"Tribunais de Contas não executam judicialmente suas próprias multas; essa atribuição é do ente lesado via advocacia pública.","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":27,"bc":"CEBRASPE, Auditor (Conselheiro-Substituto - TCDF)","es":"tematico","ft":"Externa (Regimento Interno do TCDF)","nv":"baixa","td":"→ Estável","fr":"2021 (1 questão)","an":[2021],"ar":2021,"q":"27) Acerca dos instrumentos de fiscalização previstos no Regimento Interno do TCDF, julgue o item a seguir.\nOs relatores possuem competência para autorizar diretamente, independentemente de deliberação do Plenário do TCDF, levantamentos e inspeções.","r":"O gabarito é Certo[cite: 2]. O Regimento Interno do TCDF descentraliza as etapas investigatórias preliminares conferindo aos Conselheiros-Relatores a prerrogativa para autorizarem diretamente a realização de levantamentos, inspeções e diligências nos processos sob sua condução, em prestígio à celeridade, não sendo obrigatória a deliberação colegiada prévia do Plenário.","rf":"O Conselheiro-Relator possui autonomia regimental para autorizar inspeções sem depender de aval prévio do Plenário.","g":"Certo","t":"CE","tm":"Processo, Fiscalização e Sanções"},{"n":28,"bc":"CEBRASPE, Auditor (Conselheiro-Substituto - TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"↑ Crescente","fr":"2021 (1 questão)","an":[2021],"ar":2021,"q":"28) Acerca da apreciação da legalidade dos atos de admissão de pessoal, julgue o item a seguir.\nAs nomeações para cargo de provimento em comissão não são fiscalizadas pelo TCDF.","r":"O gabarito é Errado[cite: 2]. O fato de os cargos de provimento em comissão estarem *excetuados da apreciação para fins de registro* (Art. 1º, III, da LO/TCDF) não significa que eles não possam ser *fiscalizados* pelo Tribunal[cite: 1]. O TCDF retém a competência para verificar a legalidade de sua ocupação, cotas, e requisitos, atuando via processos de auditoria, representações e denúncias[cite: 1].","rf":"Cargos em comissão estão isentos de REGISTRO, mas NÃO de FISCALIZAÇÃO pelo Tribunal de Contas.","g":"Errado","t":"CE","tm":"Natureza, Competência e Jurisdição"},{"n":58,"bc":"CEBRASPE, Analista (SEE DF)","es":"tematico","ft":"Interna","nv":"media","td":"→ Estável","fr":"2017 (1 questão)","an":[2017],"ar":2017,"q":"58) Julgue o próximo item, relativo a poderes, organização administrativa do Estado e controle da administração.\nO Tribunal de Contas do DF exerce controle legislativo sobre os atos do governo do DF.","r":"O gabarito é Certo[cite: 2]. Doutrinária e constitucionalmente, o controle exercido pelos Tribunais de Contas qualifica-se como controle externo (art. 1º da LO/TCDF), o qual é estruturalmente uma função de titularidade do Poder Legislativo[cite: 1]. Assim, atuando no auxílio direto ao Poder Legislativo distrital, o controle do TCDF insere-se na tipologia de controle legislativo externo sobre o Executivo.","rf":"O controle exercido pelo Tribunal de Contas tem a natureza jurídico-estrutural de controle legislativo (controle externo).","g":"Certo","t":"CE","tm":"Controle Externo e Legislação Institucional"},{"n":59,"bc":"CEBRASPE, Analista (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2014 (1 questão)","an":[2014],"ar":2014,"q":"59) Com base nos dispositivos da LO/TCDF, julgue o item seguinte.\nA concessão de pensão por morte de servidor do governo do DF e os reajustes de seu valor, ainda que não alterem o fundamento legal do ato concessório, deverão ser apreciados pelo TCDF.","r":"O gabarito é Errado[cite: 2]. O art. 1º, inciso III, da LO/TCDF, que atribui a competência para apreciar a legalidade das concessões de pensões para fins de registro, expressamente afasta os ajustes posteriores de cálculo de benefícios: \"RESSALVADAS as melhorias posteriores que não alterem o fundamento legal do ato concessório\"[cite: 1].","rf":"Melhorias e reajustes que não alteram o fundamento legal da aposentadoria/pensão NÃO são registrados pelo TCDF.","g":"Errado","t":"CE","tm":"Serviços Auxiliares e Servidores"},{"n":60,"bc":"FUNIVERSA, Auditor de Controle Interno (CGDF)","es":"literal","ft":"Interna","nv":"media","td":"→ Estável","fr":"2014 (2 questões)","an":[2014],"ar":2014,"q":"60) Entre as competências do Tribunal de Contas, cita-se a de apreciar, para fins de registro, a legalidade dos atos de admissão de pessoal, ou das mudanças ou melhorias em relação aos benefícios ou beneficiários, tal como no caso de\na) cargo em comissão de servidor efetivo.\nb) aumento de remuneração em virtude da revisão geral anual.\nc) conclusão do estágio probatório.\nd) cargo em comissão quando não há outro vínculo com a Administração.\ne) concessão de pensão.","r":"O gabarito é E[cite: 2]. Segundo o art. 1º, inciso III, da LO/TCDF, compete ao Tribunal de Contas apreciar para fins de registro a legalidade dos atos de admissão de pessoal e das concessões iniciais de aposentadorias, reformas e pensões[cite: 1]. A mesma regra afasta a apreciação (excetua) das nomeações para cargos de provimento em comissão (afastando as letras A e D)[cite: 1].","rf":"A concessão de pensão, assim como a admissão e a aposentadoria, é ato sujeito a registro pelo Tribunal de Contas.","g":"E","t":"MC","tm":"Serviços Auxiliares e Servidores","alt":[{"letra":"a","texto":"cargo em comissão de servidor efetivo."},{"letra":"b","texto":"aumento de remuneração em virtude da revisão geral anual."},{"letra":"c","texto":"conclusão do estágio probatório."},{"letra":"d","texto":"cargo em comissão quando não há outro vínculo com a Administração."},{"letra":"e","texto":"concessão de pensão."}]},{"n":61,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"baixa","td":"→ Estável","fr":"2014 (1 questão)","an":[2014],"ar":2014,"q":"61) Julgue o item subsequente relativo à LO/TCDF.\nCompete exclusivamente ao TCDF conceder a conselheiro e auditor licença para tratamento de saúde, que, se for superior ao prazo de seis meses, dependerá de inspeção por junta médica.","r":"O gabarito é Certo[cite: 2]. A assertiva baseia-se literalmente na regra do art. 4º, inciso VI, da LO/TCDF[cite: 1]. Compete privativamente ao Tribunal conceder licenças a seus Conselheiros e Auditores, exigindo-se a formalidade de inspeção por junta médica apenas quando o afastamento para tratamento de saúde ultrapassar seis meses ininterruptos[cite: 1].","rf":"Licença médica a Conselheiros e Auditores superior a 6 meses exige, por lei orgânica, inspeção por junta médica do TCDF.","g":"Certo","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":62,"bc":"CEBRASPE, Auditor de Controle Externo (TCDF)","es":"literal","ft":"Interna","nv":"alta","td":"→ Estável","fr":"2012 (1 questão), 2024 (1 questão)","an":[2012,2024],"ar":2024,"q":"62) Julgue o próximo item, acerca da jurisdição e da Lei Orgânica do TCDF.\nDe acordo com a Lei Orgânica do TCDF, é de competência desse tribunal julgar as contas do governador do DF e elaborar relatório sintético a esse respeito, emitindo parecer definitivo, no qual o conselheiro relator - antes de se pronunciar sobre o mérito das contas - ordena a citação dos responsáveis.","r":"O gabarito é Errado[cite: 2]. A competência do TCDF não é de julgar as contas do Governador do Distrito Federal, mas sim de apreciá-las, fazer relatório analítico e emitir parecer prévio (Art. 1º, inciso I)[cite: 1]. O julgamento (mérito político-financeiro) é atribuição constitucional e legal exclusiva da Câmara Legislativa do DF (CLDF)[cite: 1].","rf":"O TCDF não julga nem emite parecer definitivo sobre as contas do Governador, limitando-se à emissão de parecer prévio.","g":"Errado","t":"CE","tm":"Composição, Conselheiros e Auditores"},{"n":63,"bc":"CEBRASPE, Consultor Técnico Legislativo (CLDF)","es":"tematico","ft":"Externa (LO/TCDF completa - LC 01/1994, Art. 21)","nv":"baixa","td":"→ Estável","fr":"2006 (1 questão)","an":[2006],"ar":2006,"q":"63) Com referência ao controle e à auditoria governamentais, julgue o item que se segue.\nNo caso das contas consideradas iliquidáveis, além de não haver baixa na responsabilidade do administrador, o TCDF poderá, a qualquer tempo, autorizar o desarquivamento do processo, diante de novos elementos que considere suficientes, e determinar que se ultime a respectiva tomada da prestação de contas.","r":"O gabarito é Errado[cite: 2]. Nos termos da Lei Orgânica do TCDF, o Tribunal ordenará o trancamento das contas quando elas forem consideradas iliquidáveis (por caso fortuito ou força maior). O prazo para que o Tribunal autorize o desarquivamento do processo (havendo nova documentação) não é a qualquer tempo, mas sim no prazo de cinco anos. Decorrido o quinquênio sem nova manifestação, o administrador fica liberado de responsabilidade, não cabendo desarquivamento ad eternum.","rf":"Contas iliquidáveis podem ser desarquivadas no prazo de 5 anos; após isso, a responsabilidade do gestor prescreve.","g":"Er
