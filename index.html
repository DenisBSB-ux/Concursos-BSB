<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="600">
    <title>Monitor de Concursos Públicos — Brasília/DF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // MODO CLARO / ESCURO
        function toggleDarkMode() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (icon) icon.innerText = isDark ? '☀️' : '🌙';
            if (text) text.innerText = isDark ? 'Claro' : 'Escuro';
        }

        function initTheme() {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                const icon = document.getElementById('themeIcon');
                const text = document.getElementById('themeText');
                if (icon) icon.innerText = '☀️';
                if (text) text.innerText = 'Claro';
            } else {
                document.documentElement.classList.remove('dark');
                const icon = document.getElementById('themeIcon');
                const text = document.getElementById('themeText');
                if (icon) icon.innerText = '🌙';
                if (text) text.innerText = 'Escuro';
            }
        }

        // Data Dinâmica
        function atualizarDataInterface() {
            const agora = new Date();
            const opcoesData = { day: 'numeric', month: 'long', year: 'numeric' };
            const dataFormatada = agora.toLocaleDateString('pt-BR', opcoesData);
            const horaFormatada = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('dataAtualizacao').innerText = `${dataFormatada} às ${horaFormatada}`;
        }
        let filtroPerfilAtual = 'TODOS';

        const dadosManuais = {
            'METRO_DF': { titulo: 'Metrô-DF', status: 'Concurso determinado pelo TCDF com trâmites para escolha de banca organizadora.', historico: 'Previsão de 299 vagas imediatas + CR. Escolha da banca e edital em andamento.', link: 'https://www.metro.df.gov.br/' },
            'TCDF': { titulo: 'TCDF 2026', status: 'Edital nº 1/2026 publicado para Analista Administrativo de Controle Externo.', historico: 'Inscrições: 26/08 a 17/09/2026. Aplicação das Provas em 22/11/2026.', link: 'https://www.cebraspe.org.br/concursos/tc_df_26_analista', simulados: '• <span class="font-bold text-slate-900 dark:text-white">Gran Concursos:</span> 1º Simulado TCDF (Analista) — PDF + Gabarito [Gratuito] (<a href="https://concursos.grancursosonline.com.br/tcdf-1o-simulado-analista-administrativo-de-controle-externo-area-de-gestao-servicos-tecnico-administrativos-pos-edital/" target="_blank" class="text-blue-600 dark:text-blue-400 font-bold underline">Baixar PDF Grátis</a>)<br>• <span class="font-bold text-slate-900 dark:text-white">Estratégia Concursos:</span> Simulado Especial TCDF Cebraspe [Gratuito] (<a href="https://www.estrategiaconcursos.com.br/curso/tcdf-analista-administrativo-de-controle-externo-servicos-tecnico-administrativos-anace-rodadas-avancadas-de-simulados-2026-pos-edital/" target="_blank" class="text-blue-600 dark:text-blue-400 font-bold underline">Acessar Simulado Grátis</a>)' },
            'DATAPREV': { titulo: 'DATAPREV 2026', status: 'Concurso nacional com vagas para Brasília/DF para a área de Tecnologia e Gestão. Inscrições encerradas.', historico: 'Realização das Provas Objetivas em 11/10/2026.', link: 'https://conhecimento.fgv.br/concursos/dataprev', simulados: '• <span class="font-bold text-slate-900 dark:text-white">Gran Concursos:</span> Simulado Especial DATAPREV [Gratuito] (<a href="#" target="_blank" class="text-blue-600 dark:text-blue-400 font-bold underline">Baixar PDF Grátis</a>)' },
            'SEDES_DF': { titulo: 'SEDES-DF', status: 'Concurso unificado para EDAS e TDAS (Psicologia, Serviço Social, etc). Inscrições encerradas.', historico: 'Realização das Provas Objetivas em 06/09/2026.', link: 'https://www.quadrix.org.br/', simulados: '• <span class="font-bold text-slate-900 dark:text-white">Gran Concursos:</span> Simulados Oficiais Aplicados em Julho/2026 — PDF + Gabarito [Gratuito] (<a href="https://concursos.grancursosonline.com.br/sedes-df-3-simulado-gratuito-pos-edital/" target="_blank" class="text-blue-600 dark:text-blue-400 font-bold underline">Baixar Cadernos de Julho</a>)' },
            'ANPD': { titulo: 'ANPD', status: 'Concurso autorizado (Portaria MGI nº 5.092) para 50 vagas de Especialista em Regulação.', historico: 'Edital aguardado para o fim de 2026.', link: 'https://www.gov.br/' },
            'COFEN_TI': { titulo: 'COFEN — TI', status: 'Vagas para Analista de TI e Suporte Técnico na Sede.', historico: 'Edital previsto até 15/09/2026.', link: 'https://www.cofen.gov.br/' },
            'COFEN_GERAL': { titulo: 'COFEN — Geral', status: 'Cargos de Analista Técnico e Gestão de Pessoas.', historico: 'Edital previsto até 15/09/2026.', link: 'https://www.cofen.gov.br/' },
            'SEEC_DF': { titulo: 'SEEC-DF', status: 'Carreira de Planejamento e Infraestrutura do DF.', historico: 'Lançamento do edital esperado para Outubro/2026.' },
            'PCDF': { titulo: 'PCDF — Agente de Custódia', status: 'Autorização para 50 vagas imediatas + 100 CR.', historico: 'Assinatura do contrato com a banca prevista para Set/2026.' },
            'SEDF': { titulo: 'SEDF — PPGE', status: 'Gestor, Analista, Psicólogo e Pedagogo em Políticas Públicas.', historico: 'Definição de banca em Outubro/2026.' },
            'CFC': { titulo: 'CFC', status: 'Concurso de Contador e Analista Contábil.', historico: 'Edital aguardado para Novembro/2026.' },
            'RECEITA': { titulo: 'Receita Federal', status: 'Pedido para 146 vagas (Auditor/Analista) no DF.', historico: 'Aguardando portaria MGI em Nov/2026.' },
            'SEFAZ_DF': { titulo: 'SEFAZ-DF', status: 'Auditor Fiscal. Banca Cebraspe contratada.', historico: 'Minuta do edital em ajustes.' },
            'AGSUS': { titulo: 'AgSUS', status: 'Processos seletivos contínuos para área da Saúde (Psicologia, Fono, Med).', historico: 'Editais frequentes por unidade/DSEI.', link: 'https://agsus.empregare.com/pt-br/editais' },
            'IGESDF': { titulo: 'IGESDF', status: 'Processos seletivos contínuos para área da Saúde (Psicologia, Fono, Enfermagem, Med).', historico: 'Acompanhar novos editais mensalmente.', link: 'https://processoseletivo.igesdf.org.br' },
            'SES_DF': { titulo: 'SES-DF', status: 'Secretaria de Saúde do DF (Médico, Fonoaudiólogo, Psicólogo).', historico: 'Sem edital publicado até o momento.' },
            'DER_DF': { titulo: 'DER-DF', status: 'Concurso autorizado desde 2023, parado.', historico: 'TCDF cobra explicações do órgão.' },
            'CGU': { titulo: 'CGU', status: 'Pedido de 470 vagas para Auditor.', historico: 'Aguardando Aval do MGI.' },
            'ANAC': { titulo: 'ANAC', status: 'Pedido para 332 vagas de Especialista.', historico: 'Autorização esperada no pacote MGI.' },
            'ANTT': { titulo: 'ANTT', status: 'Pedido de 170+ vagas para Brasília.', historico: 'Autorização esperada no pacote MGI.' },
            'PRF_ADM': { titulo: 'PRF (Administrativo)', status: 'Pedido para 248 vagas administrativas.', historico: 'Reavaliação orçamentária para 2027.' },
            'IBRAM_DF': { titulo: 'IBRAM-DF', status: 'Previsão de concurso para Analista Ambiental.', historico: 'Comissão aguardada para 2027.' },
            'SISTEMA_S': { titulo: 'Sistema S', status: 'Seleções contínuas regidas pela CLT.', historico: 'Novos editais regionais a partir de Setembro/2026.' }
        };

        const dadosAutomaticos = {};
        const dadosAuditoria = { ...dadosManuais, ...dadosAutomaticos };

        function setFiltroPerfil(perfil) {
            filtroPerfilAtual = perfil;
            document.querySelectorAll('.btn-perfil').forEach(btn => {
                btn.className = "btn-perfil px-2.5 py-1 text-[11px] font-bold rounded-md bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all";
            });
            const ativos = { 'TODOS': 'btnPerfTODOS', 'a': 'btnPerfA', 'c': 'btnPerfC', 's': 'btnPerfS', 'f': 'btnPerfF', 'p': 'btnPerfP' };
            if (ativos[perfil]) {
                document.getElementById(ativos[perfil]).className = "btn-perfil px-2.5 py-1 text-[11px] font-bold rounded-md bg-slate-900 dark:bg-blue-600 text-white transition-all";
            }
            filtrarTabelas();
        }

        function limparBusca() {
            document.getElementById('searchInput').value = '';
            filtrarTabelas();
        }

        function filtrarTabelas() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const linhas = document.querySelectorAll('tbody tr');
            let [v1, v2, v3, v4] = [0, 0, 0, 0];

            linhas.forEach(linha => {
                const rowPerfil = linha.getAttribute('data-perfil');
                const exibe = (query === '' || linha.innerText.toLowerCase().includes(query)) && 
                              (filtroPerfilAtual === 'TODOS' || rowPerfil === filtroPerfilAtual);
                
                linha.style.display = exibe ? '' : 'none';

                if (exibe) {
                    const id = linha.closest('tbody').id;
                    if (id === 'tblSec1') v1++;
                    if (id === 'tblSec2') v2++;
                    if (id === 'tblSec3') v3++;
                    if (id === 'tblSec4') v4++;
                }
            });

            document.getElementById('badgeCountSec1').innerText = `${v1} item(ns)`;
            document.getElementById('badgeCountSec2').innerText = `${v2} item(ns)`;
            document.getElementById('badgeCountSec3').innerText = `${v3} item(ns)`;
            document.getElementById('badgeCountSec4').innerText = `${v4} item(ns)`;

            document.getElementById('kpiTotal').innerText = v1 + v2 + v3 + v4;
            document.getElementById('kpiAbertos').innerText = v1;
            document.getElementById('kpiAndamento').innerText = v2;
            document.getElementById('kpiFuturos').innerText = v3 + v4;
        }

        function abrirModal(chave) {
            const item = dadosAuditoria[chave];
            if (!item) return;
            document.getElementById('modalTitle').innerText = item.titulo;
            document.getElementById('modalStatusText').innerText = item.status;
            document.getElementById('modalHistorico').innerHTML = `⏳ ${item.historico}`;

            const simEl = document.getElementById('modalSimulados');
            const simContainer = document.getElementById('modalSimuladosContainer');
            if (item.simulados) {
                simEl.innerHTML = item.simulados;
                simContainer.classList.remove('hidden');
            } else {
                simContainer.classList.add('hidden');
            }

            const linkEl = document.getElementById('modalLink');
            if (item.link) {
                linkEl.href = item.link;
                linkEl.classList.remove('hidden');
                linkEl.innerText = '🔗 Ver Fonte / Banca Oficial';
            } else {
                linkEl.classList.add('hidden');
            }
            document.getElementById('modal').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        window.onclick = e => { if (e.target === document.getElementById('modal')) fecharModal(); };

        function verificarDatasAplicadas() {
            const agora = new Date();
            document.querySelectorAll('[data-simulado-data]').forEach(badge => {
                const dataStr = badge.getAttribute('data-simulado-data');
                const dataEvento = new Date(dataStr);
                
                if (agora > dataEvento) {
                    badge.innerHTML = '✅ Simulado: Já aplicado';
                    badge.className = 'inline-flex items-center gap-1 px-2 py-0.5 bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-bold text-[10px] rounded-md shadow-sm';
                }
            });
        }

        // Executa as rotinas iniciais
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            atualizarDataInterface();
            verificarDatasAplicadas();
            filtrarTabelas();
        });

        // Caso o DOM já tenha carregado antes do script executar
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            initTheme();
            atualizarDataInterface();
            verificarDatasAplicadas();
            filtrarTabelas();
        }

        window.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });
    </script>
</body>
</html>
